<!doctype html><html data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../../assets/site.css"><style>body{margin:0}main{padding:18px;max-width:1160px;margin:auto}.topic-card{padding:18px}</style></head><body><main class="day foundation-refresh"><article class="topic-card"><h3>next_hop: after — light theme</h3><figure class="diagram-container"><div style="max-width:100%;overflow-x:auto"><svg role="img" aria-labelledby="d002-next-hop-title d002-next-hop-desc" viewBox="0 0 1120 544" style="display:block;width:100%;height:auto;min-width:1120px;background:#090d16;font-family:ui-monospace,monospace"><title id="d002-next-hop-title">Supplied Ethernet model: host A to host B</title><desc id="d002-next-hop-desc">Read 1 → 2 → 3 → 4 → 5 → 6. Supplied conventional Ethernet teaching topology, with no NAT and connected router interfaces. IP endpoints stay A and B; link-layer addresses change at the router. This is a tabletop path, not a capture of Google Cloud physical forwarding.</desc><defs><marker id="d002-next-hop-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#38bdf8"/></marker></defs><text x="30" y="32" fill="#f8fafc" font-size="20" font-weight="700">Supplied Ethernet model: host A to host B</text><g id="d002-next-hop-step-1" aria-label="off-link"><line x1="310" y1="158.0" x2="410" y2="158.0" stroke="#38bdf8" stroke-width="2" marker-end="url(#d002-next-hop-arrow)"/><text x="360.0" y="118.0" fill="#cbd5e1" font-size="12" text-anchor="middle">1 → 2:</text><text x="360.0" y="134.0" fill="#cbd5e1" font-size="12" text-anchor="middle">off-link</text></g><g id="d002-next-hop-step-2" aria-label="encapsulate"><line x1="700" y1="158.0" x2="800" y2="158.0" stroke="#38bdf8" stroke-width="2" marker-end="url(#d002-next-hop-arrow)"/><text x="750.0" y="118.0" fill="#cbd5e1" font-size="12" text-anchor="middle">2 → 3:</text><text x="750.0" y="134.0" fill="#cbd5e1" font-size="12" text-anchor="middle">encapsulate</text></g><g id="d002-next-hop-step-3" aria-label="route lookup"><line x1="950" y1="230" x2="950" y2="360" stroke="#38bdf8" stroke-width="2" marker-end="url(#d002-next-hop-arrow)"/><text x="928" y="279.0" fill="#cbd5e1" font-size="12" text-anchor="end">3 → 4: route</text><text x="928" y="295.0" fill="#cbd5e1" font-size="12" text-anchor="end">lookup</text></g><g id="d002-next-hop-step-4" aria-label="neighbor"><line x1="810" y1="442.0" x2="710" y2="442.0" stroke="#38bdf8" stroke-width="2" marker-end="url(#d002-next-hop-arrow)"/><text x="760.0" y="402.0" fill="#cbd5e1" font-size="12" text-anchor="middle">4 → 5:</text><text x="760.0" y="418.0" fill="#cbd5e1" font-size="12" text-anchor="middle">neighbor</text></g><g id="d002-next-hop-step-5" aria-label="deliver"><line x1="420" y1="442.0" x2="320" y2="442.0" stroke="#38bdf8" stroke-width="2" marker-end="url(#d002-next-hop-arrow)"/><text x="370.0" y="402.0" fill="#cbd5e1" font-size="12" text-anchor="middle">5 → 6:</text><text x="370.0" y="418.0" fill="#cbd5e1" font-size="12" text-anchor="middle">deliver</text></g><g id="d002-next-hop-node-n1" data-node="n1" aria-label="Host A selects route" transform="translate(30,86)"><rect width="280" height="144" rx="10" fill="#121526" stroke="#38bdf8"/><image href="../../../assets/icons/generic/client.svg" x="15" y="14" width="30" height="30" preserveAspectRatio="xMidYMid meet"/><text x="54" y="32" fill="#7dd3fc" font-size="16" font-weight="700">1. Host A selects</text><text x="54" y="52" fill="#7dd3fc" font-size="16" font-weight="700">route</text><text x="16" y="86" fill="#e2e8f0" font-size="14">10.240.0.10/26 → .75</text><text x="16" y="106" fill="#e2e8f0" font-size="14">Destination outside A subnet</text></g><g id="d002-next-hop-node-n2" data-node="n2" aria-label="Resolve next hop" transform="translate(420,86)"><rect width="280" height="144" rx="10" fill="#121526" stroke="#38bdf8"/><image href="../../../assets/icons/generic/router.svg" x="15" y="14" width="30" height="30" preserveAspectRatio="xMidYMid meet"/><text x="54" y="32" fill="#7dd3fc" font-size="16" font-weight="700">2. Resolve next hop</text><text x="16" y="66" fill="#e2e8f0" font-size="14">Gateway IP: 10.240.0.1</text><text x="16" y="86" fill="#e2e8f0" font-size="14">ARP learns gateway MAC</text></g><g id="d002-next-hop-node-n3" data-node="n3" aria-label="Send local frame" transform="translate(810,86)"><rect width="280" height="144" rx="10" fill="#121526" stroke="#38bdf8"/><image href="../../../assets/icons/generic/switch.svg" x="15" y="14" width="30" height="30" preserveAspectRatio="xMidYMid meet"/><text x="54" y="32" fill="#7dd3fc" font-size="16" font-weight="700">3. Send local frame</text><text x="16" y="66" fill="#e2e8f0" font-size="14">IP destination stays .75</text><text x="16" y="86" fill="#e2e8f0" font-size="14">Frame destination: gateway</text></g><g id="d002-next-hop-node-n4" data-node="n4" aria-label="Router forwards" transform="translate(810,370)"><rect width="280" height="144" rx="10" fill="#121526" stroke="#38bdf8"/><image href="../../../assets/icons/generic/router.svg" x="15" y="14" width="30" height="30" preserveAspectRatio="xMidYMid meet"/><text x="54" y="32" fill="#7dd3fc" font-size="16" font-weight="700">4. Router forwards</text><text x="16" y="66" fill="#e2e8f0" font-size="14">Connected 10.240.0.64/26</text><text x="16" y="86" fill="#e2e8f0" font-size="14">Outgoing interface:</text><text x="16" y="106" fill="#e2e8f0" font-size="14">10.240.0.65</text></g><g id="d002-next-hop-node-n5" data-node="n5" aria-label="Resolve host B" transform="translate(420,370)"><rect width="280" height="144" rx="10" fill="#121526" stroke="#38bdf8"/><image href="../../../assets/icons/generic/endpoint.svg" x="15" y="14" width="30" height="30" preserveAspectRatio="xMidYMid meet"/><text x="54" y="32" fill="#7dd3fc" font-size="16" font-weight="700">5. Resolve host B</text><text x="16" y="66" fill="#e2e8f0" font-size="14">Router ARPs for 10.240.0.75</text><text x="16" y="86" fill="#e2e8f0" font-size="14">New frame destination: B MAC</text></g><g id="d002-next-hop-node-n6" data-node="n6" aria-label="Host B receives" transform="translate(30,370)"><rect width="280" height="144" rx="10" fill="#121526" stroke="#38bdf8"/><image href="../../../assets/icons/generic/server.svg" x="15" y="14" width="30" height="30" preserveAspectRatio="xMidYMid meet"/><text x="54" y="32" fill="#7dd3fc" font-size="16" font-weight="700">6. Host B receives</text><text x="16" y="66" fill="#e2e8f0" font-size="14">IP destination: 10.240.0.75</text><text x="16" y="86" fill="#e2e8f0" font-size="14">Transport delivers to socket</text></g></svg></div><figcaption>Read 1 → 2 → 3 → 4 → 5 → 6. Supplied conventional Ethernet teaching topology, with no NAT and connected router interfaces. IP endpoints stay A and B; link-layer addresses change at the router. This is a tabletop path, not a capture of Google Cloud physical forwarding.<ol class="flow-transitions"><li>1 → 2: off-link</li><li>2 → 3: encapsulate</li><li>3 → 4: route lookup</li><li>4 → 5: neighbor</li><li>5 → 6: deliver</li></ol></figcaption></figure></article></main></body></html>
