<!doctype html><html data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../../assets/site.css"><style>body{margin:0}main{padding:18px;max-width:1160px;margin:auto}.topic-card{padding:18px}</style></head><body><main class="day foundation-refresh"><article class="topic-card"><h3>nic: after — dark theme</h3><figure class="diagram-container"><div style="max-width:100%;overflow-x:auto"><svg role="img" aria-labelledby="d002-nic-socket-title d002-nic-socket-desc" viewBox="0 0 1120 544" style="display:block;width:100%;height:auto;min-width:1120px;background:#090d16;font-family:ui-monospace,monospace"><title id="d002-nic-socket-title">Receive sequence: NIC to application socket</title><desc id="d002-nic-socket-desc">Read 1 → 2 → 3 → 4 → 5 → 6. A simplified Linux receive path for established TCP traffic addressed to this host. Driver offloads and kernel versions can change processing details; SYN/accept queues belong to connection establishment. Loopback skips physical NIC/DMA, and this drawing does not reveal Google Cloud fabric internals.</desc><defs><marker id="d002-nic-socket-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#38bdf8"/></marker></defs><text x="30" y="32" fill="#f8fafc" font-size="20" font-weight="700">Receive sequence: NIC to application socket</text><g id="d002-nic-socket-step-1" aria-label="notify"><line x1="310" y1="158.0" x2="410" y2="158.0" stroke="#38bdf8" stroke-width="2" marker-end="url(#d002-nic-socket-arrow)"/><text x="360.0" y="118.0" fill="#cbd5e1" font-size="12" text-anchor="middle">1 → 2:</text><text x="360.0" y="134.0" fill="#cbd5e1" font-size="12" text-anchor="middle">notify</text></g><g id="d002-nic-socket-step-2" aria-label="poll"><line x1="700" y1="158.0" x2="800" y2="158.0" stroke="#38bdf8" stroke-width="2" marker-end="url(#d002-nic-socket-arrow)"/><text x="750.0" y="134.0" fill="#cbd5e1" font-size="12" text-anchor="middle">2 → 3: poll</text></g><g id="d002-nic-socket-step-3" aria-label="IP input"><line x1="950" y1="230" x2="950" y2="360" stroke="#38bdf8" stroke-width="2" marker-end="url(#d002-nic-socket-arrow)"/><text x="928" y="279.0" fill="#cbd5e1" font-size="12" text-anchor="end">3 → 4: IP</text><text x="928" y="295.0" fill="#cbd5e1" font-size="12" text-anchor="end">input</text></g><g id="d002-nic-socket-step-4" aria-label="demux"><line x1="810" y1="442.0" x2="710" y2="442.0" stroke="#38bdf8" stroke-width="2" marker-end="url(#d002-nic-socket-arrow)"/><text x="760.0" y="418.0" fill="#cbd5e1" font-size="12" text-anchor="middle">4 → 5: demux</text></g><g id="d002-nic-socket-step-5" aria-label="read"><line x1="420" y1="442.0" x2="320" y2="442.0" stroke="#38bdf8" stroke-width="2" marker-end="url(#d002-nic-socket-arrow)"/><text x="370.0" y="418.0" fill="#cbd5e1" font-size="12" text-anchor="middle">5 → 6: read</text></g><g id="d002-nic-socket-node-n1" data-node="n1" aria-label="NIC receive queue" transform="translate(30,86)"><rect width="280" height="144" rx="10" fill="#121526" stroke="#38bdf8"/><image href="../../../assets/icons/generic/endpoint.svg" x="15" y="14" width="30" height="30" preserveAspectRatio="xMidYMid meet"/><text x="54" y="32" fill="#7dd3fc" font-size="16" font-weight="700">1. NIC receive queue</text><text x="16" y="66" fill="#e2e8f0" font-size="14">Frame arrives at interface</text><text x="16" y="86" fill="#e2e8f0" font-size="14">Driver-managed receive</text><text x="16" y="106" fill="#e2e8f0" font-size="14">buffers</text></g><g id="d002-nic-socket-node-n2" data-node="n2" aria-label="Driver processing" transform="translate(420,86)"><rect width="280" height="144" rx="10" fill="#121526" stroke="#38bdf8"/><image href="../../../assets/icons/generic/queue.svg" x="15" y="14" width="30" height="30" preserveAspectRatio="xMidYMid meet"/><text x="54" y="32" fill="#7dd3fc" font-size="16" font-weight="700">2. Driver processing</text><text x="16" y="66" fill="#e2e8f0" font-size="14">DMA: device transfers to RAM</text><text x="16" y="86" fill="#e2e8f0" font-size="14">Interrupt / polling</text><text x="16" y="106" fill="#e2e8f0" font-size="14">notification</text></g><g id="d002-nic-socket-node-n3" data-node="n3" aria-label="NAPI polling" transform="translate(810,86)"><rect width="280" height="144" rx="10" fill="#121526" stroke="#38bdf8"/><image href="../../../assets/icons/generic/queue.svg" x="15" y="14" width="30" height="30" preserveAspectRatio="xMidYMid meet"/><text x="54" y="32" fill="#7dd3fc" font-size="16" font-weight="700">3. NAPI polling</text><text x="16" y="66" fill="#e2e8f0" font-size="14">Linux processes receive work</text><text x="16" y="86" fill="#e2e8f0" font-size="14">Scheduling varies by driver</text></g><g id="d002-nic-socket-node-n4" data-node="n4" aria-label="IP input checks" transform="translate(810,370)"><rect width="280" height="144" rx="10" fill="#121526" stroke="#38bdf8"/><image href="../../../assets/icons/generic/firewall.svg" x="15" y="14" width="30" height="30" preserveAspectRatio="xMidYMid meet"/><text x="54" y="32" fill="#7dd3fc" font-size="16" font-weight="700">4. IP input checks</text><text x="16" y="66" fill="#e2e8f0" font-size="14">Headers, policy, local</text><text x="16" y="86" fill="#e2e8f0" font-size="14">delivery</text><text x="16" y="106" fill="#e2e8f0" font-size="14">Transit packets use</text><text x="16" y="126" fill="#e2e8f0" font-size="14">forwarding</text></g><g id="d002-nic-socket-node-n5" data-node="n5" aria-label="Transport + socket" transform="translate(420,370)"><rect width="280" height="144" rx="10" fill="#121526" stroke="#38bdf8"/><image href="../../../assets/icons/generic/server.svg" x="15" y="14" width="30" height="30" preserveAspectRatio="xMidYMid meet"/><text x="54" y="32" fill="#7dd3fc" font-size="16" font-weight="700">5. Transport + socket</text><text x="16" y="66" fill="#e2e8f0" font-size="14">TCP matches connection tuple</text><text x="16" y="86" fill="#e2e8f0" font-size="14">Bytes wait in receive buffer</text></g><g id="d002-nic-socket-node-n6" data-node="n6" aria-label="Application reads" transform="translate(30,370)"><rect width="280" height="144" rx="10" fill="#121526" stroke="#38bdf8"/><image href="../../../assets/icons/generic/user.svg" x="15" y="14" width="30" height="30" preserveAspectRatio="xMidYMid meet"/><text x="54" y="32" fill="#7dd3fc" font-size="16" font-weight="700">6. Application reads</text><text x="16" y="66" fill="#e2e8f0" font-size="14">Process reads socket bytes</text><text x="16" y="86" fill="#e2e8f0" font-size="14">Parses request; may still</text><text x="16" y="106" fill="#e2e8f0" font-size="14">fail</text></g></svg></div><figcaption>Read 1 → 2 → 3 → 4 → 5 → 6. A simplified Linux receive path for established TCP traffic addressed to this host. Driver offloads and kernel versions can change processing details; SYN/accept queues belong to connection establishment. Loopback skips physical NIC/DMA, and this drawing does not reveal Google Cloud fabric internals.<ol class="flow-transitions"><li>1 → 2: notify</li><li>2 → 3: poll</li><li>3 → 4: IP input</li><li>4 → 5: demux</li><li>5 → 6: read</li></ol></figcaption></figure></article></main></body></html>
