<!doctype html><html data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../../assets/site.css"><style>body{margin:0}main{padding:18px;max-width:1160px;margin:auto}.topic-card{padding:18px}</style></head><body><main class="day foundation-refresh"><article class="topic-card"><h3>next_hop: before — light theme</h3><figure class="diagram-container"><div style="max-width:100%;overflow-x:auto"><svg role="img" aria-labelledby="d002-next-hop-title d002-next-hop-desc" viewBox="0 0 1120 455" style="display:block;width:100%;height:auto;background:#090d16;font-family:ui-monospace,monospace">
<title id="d002-next-hop-title">Supplied Ethernet model: host A to host B</title><desc id="d002-next-hop-desc">Read 1 → 2 → 3 → 4 → 5 → 6. Supplied conventional Ethernet teaching topology, with no NAT and connected router interfaces. IP endpoints stay A and B; link-layer addresses change at the router. This is a tabletop path, not a capture of Google Cloud physical forwarding.</desc>
<defs><marker id="d002-next-hop-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#38bdf8"/></marker></defs>
<text x="30" y="38" fill="#f8fafc" font-size="20" font-weight="700">Supplied Ethernet model: host A to host B</text>
<line x1="310" y1="135" x2="410" y2="135" stroke="#38bdf8" stroke-width="2" marker-end="url(#d002-next-hop-arrow)"/><text x="360" y="118" fill="#cbd5e1" font-size="12" text-anchor="middle">off-link</text><line x1="700" y1="135" x2="800" y2="135" stroke="#38bdf8" stroke-width="2" marker-end="url(#d002-next-hop-arrow)"/><text x="750" y="118" fill="#cbd5e1" font-size="12" text-anchor="middle">encapsulate</text><line x1="950" y1="190" x2="950" y2="300" stroke="#38bdf8" stroke-width="2" marker-end="url(#d002-next-hop-arrow)"/><text x="864" y="246" fill="#cbd5e1" font-size="12" text-anchor="middle">route lookup</text><line x1="810" y1="365" x2="710" y2="365" stroke="#38bdf8" stroke-width="2" marker-end="url(#d002-next-hop-arrow)"/><text x="760" y="348" fill="#cbd5e1" font-size="12" text-anchor="middle">neighbor</text><line x1="420" y1="365" x2="320" y2="365" stroke="#38bdf8" stroke-width="2" marker-end="url(#d002-next-hop-arrow)"/><text x="370" y="348" fill="#cbd5e1" font-size="12" text-anchor="middle">deliver</text><g transform="translate(30,80)"><rect width="280" height="110" rx="10" fill="#121526" stroke="#38bdf8"/>
<image href="../../../assets/icons/generic/client.svg" x="15" y="17" width="30" height="30" preserveAspectRatio="xMidYMid meet"/>
<text x="54" y="35" fill="#7dd3fc" font-size="16" font-weight="700">1. Host A selects route</text>
<text x="16" y="70" fill="#e2e8f0" font-size="14">10.240.0.10/26 → .75</text>
<text x="16" y="92" fill="#e2e8f0" font-size="14">Destination outside A subnet</text></g><g transform="translate(420,80)"><rect width="280" height="110" rx="10" fill="#121526" stroke="#38bdf8"/>
<image href="../../../assets/icons/generic/router.svg" x="15" y="17" width="30" height="30" preserveAspectRatio="xMidYMid meet"/>
<text x="54" y="35" fill="#7dd3fc" font-size="16" font-weight="700">2. Resolve next hop</text>
<text x="16" y="70" fill="#e2e8f0" font-size="14">Gateway IP: 10.240.0.1</text>
<text x="16" y="92" fill="#e2e8f0" font-size="14">ARP learns gateway MAC</text></g><g transform="translate(810,80)"><rect width="280" height="110" rx="10" fill="#121526" stroke="#38bdf8"/>
<image href="../../../assets/icons/generic/switch.svg" x="15" y="17" width="30" height="30" preserveAspectRatio="xMidYMid meet"/>
<text x="54" y="35" fill="#7dd3fc" font-size="16" font-weight="700">3. Send local frame</text>
<text x="16" y="70" fill="#e2e8f0" font-size="14">IP destination stays .75</text>
<text x="16" y="92" fill="#e2e8f0" font-size="14">Frame destination: gateway</text></g><g transform="translate(810,310)"><rect width="280" height="110" rx="10" fill="#121526" stroke="#38bdf8"/>
<image href="../../../assets/icons/generic/router.svg" x="15" y="17" width="30" height="30" preserveAspectRatio="xMidYMid meet"/>
<text x="54" y="35" fill="#7dd3fc" font-size="16" font-weight="700">4. Router forwards</text>
<text x="16" y="70" fill="#e2e8f0" font-size="14">Connected 10.240.0.64/26</text>
<text x="16" y="92" fill="#e2e8f0" font-size="14">Outgoing interface: 10.240.0.65</text></g><g transform="translate(420,310)"><rect width="280" height="110" rx="10" fill="#121526" stroke="#38bdf8"/>
<image href="../../../assets/icons/generic/endpoint.svg" x="15" y="17" width="30" height="30" preserveAspectRatio="xMidYMid meet"/>
<text x="54" y="35" fill="#7dd3fc" font-size="16" font-weight="700">5. Resolve host B</text>
<text x="16" y="70" fill="#e2e8f0" font-size="14">Router ARPs for 10.240.0.75</text>
<text x="16" y="92" fill="#e2e8f0" font-size="14">New frame destination: B MAC</text></g><g transform="translate(30,310)"><rect width="280" height="110" rx="10" fill="#121526" stroke="#38bdf8"/>
<image href="../../../assets/icons/generic/server.svg" x="15" y="17" width="30" height="30" preserveAspectRatio="xMidYMid meet"/>
<text x="54" y="35" fill="#7dd3fc" font-size="16" font-weight="700">6. Host B receives</text>
<text x="16" y="70" fill="#e2e8f0" font-size="14">IP destination: 10.240.0.75</text>
<text x="16" y="92" fill="#e2e8f0" font-size="14">Transport delivers to socket</text></g></svg></div><figcaption>Read 1 → 2 → 3 → 4 → 5 → 6. Supplied conventional Ethernet teaching topology, with no NAT and connected router interfaces. IP endpoints stay A and B; link-layer addresses change at the router. This is a tabletop path, not a capture of Google Cloud physical forwarding.</figcaption></figure></article></main></body></html>
