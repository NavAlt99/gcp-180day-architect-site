  <figcaption>
    <strong>Figure 23.5: Incident Flow · Unconstrained Offshore VM Provisioning vs. Organization Policy Guardrails.</strong>
    Contrasts the failed deployment of an unshielded compute instance in an unapproved offshore region with the corrected architecture enforcing Organization Policy constraints to intercept and block non-compliant API calls.
    <br><strong>Supplied facts:</strong> A contractor attempted to deploy an offshore virtual machine with a public external IP to process franchise transactions.
    <br><strong>Architectural inference:</strong> IAM permissions alone cannot prevent configuration non-compliance; Organization Policy constraints provide an immutable veto at the API admission gateway.
    <br><strong>Expected post-fix behavior:</strong> Root organization constraints reject foreign region and external IP requests with <code>FAILED_PRECONDITION</code>, enforcing domestic processing with Cloud NAT and preserving &le; 1 physical fulfillment per unique order ID.
  </figcaption>
