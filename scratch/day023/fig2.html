<figure class="diagram-figure" id="fig-23-2">
  <div class="diagram-scroll">
    <svg role="img" aria-labelledby="fig23-2-title fig23-2-desc" viewBox="0 0 960 520" width="960" height="520" xmlns="http://www.w3.org/2000/svg">
      <title id="fig23-2-title">Organization Policy Service Admission Control and Constraint Evaluation Flow</title>
      <desc id="fig23-2-desc">Architectural diagram illustrating how the Google Cloud Organization Policy Service intercepts control plane API requests at admission time to evaluate Boolean and List constraints, overriding caller IAM roles to enforce compliance.</desc>
      <defs>
        <linearGradient id="p23-f2-bg" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#0c101d"/>
          <stop offset="100%" stop-color="#121526"/>
        </linearGradient>
        <linearGradient id="p23-f2-engine" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#1e1b4b"/>
          <stop offset="100%" stop-color="#0f172a"/>
        </linearGradient>
        <marker id="p23-f2-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
        </marker>
        <marker id="p23-f2-arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e"/>
        </marker>
        <marker id="p23-f2-arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 9 5 L 0 9 z" fill="#22c55e"/>
        </marker>
      </defs>

      <!-- Background Canvas -->
      <rect width="960" height="520" rx="12" fill="url(#p23-f2-bg)" stroke="#1e293b" stroke-width="1.5"/>

      <!-- Header Label -->
      <text x="32" y="34" fill="#f8fafc" font-size="16" font-weight="700" font-family="system-ui, -apple-system, sans-serif">ORGANIZATION POLICY ADMISSION CONTROL &amp; CONSTRAINT EVALUATION</text>
      <text x="32" y="54" fill="#94a3b8" font-size="12" font-family="system-ui, -apple-system, sans-serif">Centralized guardrails enforce resource invariants at the API boundary, vetoing non-compliant requests regardless of IAM privileges.</text>

      <!-- LEFT: Caller & Request Payload -->
      <g transform="translate(36, 85)">
        <rect width="260" height="315" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
        <rect x="0" y="0" width="260" height="36" rx="8" fill="#334155"/>
        <text x="14" y="24" fill="#ffffff" font-size="12" font-weight="700" font-family="system-ui, -apple-system, sans-serif">1 · INCOMING API CALL</text>

        <!-- Caller ID -->
        <g transform="translate(12, 48)">
          <text x="0" y="14" fill="#38bdf8" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif">AUTHENTICATED PRINCIPAL:</text>
          <text x="0" y="28" fill="#e2e8f0" font-size="10" font-family="ui-monospace, monospace">lead-dev@brightloaf.com</text>
          <text x="0" y="44" fill="#94a3b8" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif">IAM ROLE POSSESSED:</text>
          <text x="0" y="58" fill="#22c55e" font-size="10" font-weight="700" font-family="ui-monospace, monospace">roles/owner (Full IAM Privileges)</text>
        </g>

        <!-- Request Details -->
        <g transform="translate(12, 125)">
          <rect width="236" height="160" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
          <text x="10" y="18" fill="#f8fafc" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif">API: compute.instances.insert</text>
          <text x="10" y="38" fill="#94a3b8" font-size="9" font-family="system-ui, -apple-system, sans-serif">Target Project: bl-order-fulfill-prod</text>
          <text x="10" y="54" fill="#94a3b8" font-size="9" font-family="system-ui, -apple-system, sans-serif">Requested Parameters:</text>
          
          <rect x="8" y="62" width="220" height="42" rx="4" fill="#3f1219" stroke="#f43f5e" stroke-width="1"/>
          <text x="14" y="78" fill="#fca5a5" font-size="9" font-family="ui-monospace, monospace">externalNat: 203.0.113.10</text>
          <text x="14" y="94" fill="#fca5a5" font-size="9" font-family="ui-monospace, monospace">zone: europe-west1-b (Offshore)</text>

          <text x="10" y="122" fill="#cbd5e1" font-size="9" font-family="system-ui, -apple-system, sans-serif">&bull; Caller passes IAM check (&check;)</text>
          <text x="10" y="136" fill="#cbd5e1" font-size="9" font-family="system-ui, -apple-system, sans-serif">&bull; Dispatched to Org Policy Gateway</text>
          <text x="10" y="150" fill="#38bdf8" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif">&rarr; Intercepted at admission</text>
        </g>
      </g>

      <!-- Connection Arrow: Caller to Org Policy Engine -->
      <line x1="296" y1="240" x2="336" y2="240" stroke="#38bdf8" stroke-width="2" marker-end="url(#p23-f2-arrow)"/>

      <!-- MIDDLE: Organization Policy Evaluation Engine -->
      <g transform="translate(340, 85)">
        <rect width="320" height="315" rx="8" fill="url(#p23-f2-engine)" stroke="#6366f1" stroke-width="1.8"/>
        <rect x="0" y="0" width="320" height="36" rx="8" fill="#4338ca"/>
        <text x="16" y="24" fill="#ffffff" font-size="12" font-weight="700" font-family="system-ui, -apple-system, sans-serif">2 · ORG POLICY ADMISSION ENGINE</text>

        <!-- Constraint 1: Boolean Constraint -->
        <g transform="translate(14, 48)">
          <rect width="292" height="115" rx="6" fill="#0f172a" stroke="#f43f5e" stroke-width="1.2"/>
          <text x="10" y="18" fill="#f43f5e" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif">CONSTRAINT A: BOOLEAN CONSTRAINT</text>
          <text x="10" y="34" fill="#cbd5e1" font-size="9" font-family="ui-monospace, monospace">constraints/compute.vmExternalIpAccess</text>
          <text x="10" y="50" fill="#94a3b8" font-size="9" font-family="system-ui, -apple-system, sans-serif">Inheritance: Root Org &rarr; /Prod Folder &rarr; Project</text>
          <text x="10" y="66" fill="#e2e8f0" font-size="9" font-family="system-ui, -apple-system, sans-serif">Policy Rule: <tspan fill="#f43f5e" font-weight="700">enforce: true (Deny All)</tspan></text>
          <text x="10" y="84" fill="#fca5a5" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif">Evaluation: Request contains externalNat IP</text>
          <text x="10" y="100" fill="#ffffff" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif">&cross; VIOLATION DETECTED: External IP Denied</text>
        </g>

        <!-- Constraint 2: List Constraint -->
        <g transform="translate(14, 175)">
          <rect width="292" height="115" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2"/>
          <text x="10" y="18" fill="#f59e0b" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif">CONSTRAINT B: LIST CONSTRAINT</text>
          <text x="10" y="34" fill="#cbd5e1" font-size="9" font-family="ui-monospace, monospace">constraints/gcp.resourceLocations</text>
          <text x="10" y="50" fill="#94a3b8" font-size="9" font-family="system-ui, -apple-system, sans-serif">Allowed Values: <tspan fill="#86efac" font-family="ui-monospace, monospace">['in:us-locations']</tspan></text>
          <text x="10" y="66" fill="#e2e8f0" font-size="9" font-family="system-ui, -apple-system, sans-serif">Denied Values: All other regions</text>
          <text x="10" y="84" fill="#fca5a5" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif">Evaluation: Requested 'europe-west1-b'</text>
          <text x="10" y="100" fill="#ffffff" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif">&cross; VIOLATION DETECTED: Region Not In List</text>
        </g>
      </g>

      <!-- Connection Arrows: Engine to Outcomes -->
      <!-- Up to Rejected -->
      <path d="M 660 160 L 700 160" fill="none" stroke="#f43f5e" stroke-width="2" marker-end="url(#p23-f2-arrow-red)"/>
      <!-- Down to Compliant -->
      <path d="M 660 320 L 700 320" fill="none" stroke="#22c55e" stroke-width="2" marker-end="url(#p23-f2-arrow-green)"/>

      <!-- RIGHT: Admission Outcomes -->
      <!-- TOP: REJECTION (Non-compliant) -->
      <g transform="translate(705, 85)">
        <rect width="218" height="150" rx="8" fill="#380d15" stroke="#f43f5e" stroke-width="1.8"/>
        <rect x="0" y="0" width="218" height="32" rx="8" fill="#881337"/>
        <text x="12" y="22" fill="#ffffff" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif">OUTCOME A: REJECTED</text>
        <text x="12" y="52" fill="#fca5a5" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif">HTTP 400 Bad Request</text>
        <text x="12" y="68" fill="#fecaca" font-size="9" font-family="ui-monospace, monospace">FAILED_PRECONDITION</text>
        <text x="12" y="86" fill="#cbd5e1" font-size="9" font-family="system-ui, -apple-system, sans-serif">Org policy constraint</text>
        <text x="12" y="100" fill="#cbd5e1" font-size="9" font-family="system-ui, -apple-system, sans-serif">blocks resource allocation.</text>
        <text x="12" y="120" fill="#f43f5e" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif">&cross; VM NEVER CREATED</text>
        <text x="12" y="136" fill="#fca5a5" font-size="8" font-style="italic" font-family="system-ui, -apple-system, sans-serif">Overrides caller roles/owner</text>
      </g>

      <!-- BOTTOM: ACCEPTED (Compliant) -->
      <g transform="translate(705, 250)">
        <rect width="218" height="150" rx="8" fill="#062e1c" stroke="#22c55e" stroke-width="1.8"/>
        <rect x="0" y="0" width="218" height="32" rx="8" fill="#14532d"/>
        <text x="12" y="22" fill="#ffffff" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif">OUTCOME B: ADMITTED</text>
        <text x="12" y="52" fill="#86efac" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif">HTTP 200 OK</text>
        <text x="12" y="68" fill="#bbf7d0" font-size="9" font-family="ui-monospace, monospace">Resource Provisioned</text>
        <text x="12" y="86" fill="#cbd5e1" font-size="9" font-family="system-ui, -apple-system, sans-serif">Complies with us-locations;</text>
        <text x="12" y="100" fill="#cbd5e1" font-size="9" font-family="system-ui, -apple-system, sans-serif">internal IP only + Cloud NAT.</text>
        <text x="12" y="120" fill="#22c55e" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif">&check; SAFE PROVISIONING</text>
        <text x="12" y="136" fill="#86efac" font-size="8" font-style="italic" font-family="system-ui, -apple-system, sans-serif">Audit logged &amp; compliant</text>
      </g>

      <!-- Bottom Architectural Invariant Banner -->
      <g transform="translate(36, 420)">
        <rect width="888" height="75" rx="8" fill="#111827" stroke="#334155" stroke-width="1.2"/>
        <text x="18" y="22" fill="#38bdf8" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif">GOVERNANCE BOUNDARY PRINCIPLE: IAM VS. ORGANIZATION POLICY</text>
        <text x="18" y="42" fill="#cbd5e1" font-size="10" font-family="system-ui, -apple-system, sans-serif">&bull; <strong>IAM:</strong> Evaluates IDENTITY (Who can call which API). Grants capabilities to principals.</text>
        <text x="18" y="58" fill="#cbd5e1" font-size="10" font-family="system-ui, -apple-system, sans-serif">&bull; <strong>Organization Policy:</strong> Evaluates RESOURCE STATE (What configurations are permitted). Acts as a hard programmatic veto.</text>
        <text x="18" y="72" fill="#38bdf8" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif">&check; Result: Even an Organization Owner or Project Owner cannot deploy resources that violate effective Organization Policies.</text>
      </g>
    </svg>
  </div>
  <figcaption>
    <strong>Figure 23.2: Organization Policy Service Admission Control and Constraint Evaluation Flow.</strong>
    Demonstrates how Google Cloud intercepts control plane API requests at admission time. Even when a caller holds <code>roles/owner</code> with complete IAM permissions, the Organization Policy Service evaluates Boolean and List constraints, rejecting non-compliant configurations (such as external IP allocations or unapproved deployment locations) with a <code>FAILED_PRECONDITION</code> error before resources can be instantiated.
  </figcaption>
</figure>
