  <figcaption>
    <strong>Figure 23.3: Incident Flow · Accidental Project Deletion vs. Project Lien and Undelete Recovery.</strong>
    Contrasts an unshielded shared project shutdown caused by an automated script with the corrected path utilizing Project Liens to block deletion and the 30-day undelete recovery process.
    <br><strong>Supplied facts:</strong> An automated cleanup script issued <code>projects.delete</code> against <code>bl-shared-artifacts-prod</code>, placing the project into <code>DELETE_REQUESTED</code> and causing GKE image pulls to fail.
    <br><strong>Architectural inference:</strong> Critical shared infrastructure projects must be protected with declarative Project Liens to block deletion at the control plane API gateway.
    <br><strong>Expected post-fix behavior:</strong> Project Liens reject deletion attempts with <code>FAILED_PRECONDITION</code>, and undelete operations combined with transaction idempotency guarantee &le; 1 physical fulfillment per unique order ID.
  </figcaption>
