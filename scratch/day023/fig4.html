  <figcaption>
    <strong>Figure 23.4: Incident Flow · Team-First Hierarchy Collision vs. Environment-First Isolation Architecture.</strong>
    Contrasts a flat team-first folder hierarchy that leaked developer write permissions and staging load into production with an environment-first hierarchy enforcing complete cross-environment isolation.
    <br><strong>Supplied facts:</strong> Staging load testing scripts connected to the production database via inherited folder-level developer permissions, exhausting connection pools.
    <br><strong>Architectural inference:</strong> Placing staging and production projects in a single team folder makes permission leakage and network cross-contamination inevitable.
    <br><strong>Expected post-fix behavior:</strong> Reorganizing into environment-first folders with distinct VPC boundaries drops non-production traffic and ensures &le; 1 physical fulfillment per unique order ID.
  </figcaption>
