<figure class="diagram-figure" id="fig-23-1">
  <div class="diagram-scroll">
    <svg role="img" aria-labelledby="fig23-1-title fig23-1-desc" viewBox="0 0 960 520" width="960" height="520" xmlns="http://www.w3.org/2000/svg">
      <title id="fig23-1-title">Google Cloud Project Lifecycle State Machine and Lien Protection Architecture</title>
      <desc id="fig23-1-desc">Architectural state diagram illustrating the lifecycle of a Google Cloud project from Active state through Lien protection, Delete Requested with a 30-day soft recovery window, undelete restoration, and permanent purge.</desc>
      <defs>
        <linearGradient id="p23-f1-bg" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#0c101d"/>
          <stop offset="100%" stop-color="#121526"/>
        </linearGradient>
        <linearGradient id="p23-f1-active" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#064e3b"/>
          <stop offset="100%" stop-color="#022c22"/>
        </linearGradient>
        <linearGradient id="p23-f1-pending" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#78350f"/>
          <stop offset="100%" stop-color="#451a03"/>
        </linearGradient>
        <linearGradient id="p23-f1-purged" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#881337"/>
          <stop offset="100%" stop-color="#4c0519"/>
        </linearGradient>
        <marker id="p23-f1-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
        </marker>
        <marker id="p23-f1-arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 9 5 L 0 9 z" fill="#22c55e"/>
        </marker>
        <marker id="p23-f1-arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e"/>
        </marker>
      </defs>

      <!-- Background Canvas -->
      <rect width="960" height="520" rx="12" fill="url(#p23-f1-bg)" stroke="#1e293b" stroke-width="1.5"/>

      <!-- Header Label -->
      <text x="32" y="34" fill="#f8fafc" font-size="16" font-weight="700" font-family="system-ui, -apple-system, sans-serif">PROJECT LIFECYCLE STATE MACHINE &amp; RESOURCE LIEN BOUNDARY</text>
      <text x="32" y="54" fill="#94a3b8" font-size="12" font-family="system-ui, -apple-system, sans-serif">Managing project state transitions, lien deletion blocks, the 30-day soft recovery window, and permanent purge.</text>

      <!-- STATE 1: ACTIVE -->
      <g transform="translate(40, 85)">
        <rect width="250" height="230" rx="10" fill="url(#p23-f1-active)" stroke="#22c55e" stroke-width="2"/>
        <rect x="0" y="0" width="250" height="38" rx="10" fill="#047857"/>
        <text x="16" y="24" fill="#ffffff" font-size="13" font-weight="700" font-family="system-ui, -apple-system, sans-serif">STATE 1: ACTIVE</text>
        <text x="16" y="60" fill="#a7f3d0" font-size="11" font-weight="600" font-family="system-ui, -apple-system, sans-serif">Normal Production Operation</text>
        <text x="16" y="80" fill="#e2e8f0" font-size="10" font-family="system-ui, -apple-system, sans-serif">&bull; All APIs &amp; workloads running</text>
        <text x="16" y="98" fill="#e2e8f0" font-size="10" font-family="system-ui, -apple-system, sans-serif">&bull; Cloud Billing attached &amp; active</text>
        <text x="16" y="116" fill="#e2e8f0" font-size="10" font-family="system-ui, -apple-system, sans-serif">&bull; IAM policies enforced at boundary</text>
        <text x="16" y="134" fill="#e2e8f0" font-size="10" font-family="system-ui, -apple-system, sans-serif">&bull; Service agents operational</text>

        <!-- Lien Guard Subpanel -->
        <g transform="translate(12, 148)">
          <rect width="226" height="70" rx="6" fill="#062e24" stroke="#34d399" stroke-width="1.2"/>
          <text x="10" y="18" fill="#6ee7b7" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif">PROJECT LIEN GUARDRAIL</text>
          <text x="10" y="34" fill="#cbd5e1" font-size="9" font-family="ui-monospace, monospace">resourcemanager.lien active</text>
          <text x="10" y="48" fill="#a7f3d0" font-size="9" font-family="system-ui, -apple-system, sans-serif">Blocks delete API with 400 Precondition</text>
          <text x="10" y="62" fill="#34d399" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif">&check; Protected from rogue scripts</text>
        </g>
      </g>

      <!-- Deletion Attempt (Lien Blocked) Self-Loop -->
      <path d="M 120 85 C 120 45, 210 45, 210 85" fill="none" stroke="#f43f5e" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#p23-f1-arrow-red)"/>
      <text x="125" y="42" fill="#fca5a5" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif">Delete blocked by Lien</text>

      <!-- Transition: Lien Released & Delete Invoked -->
      <line x1="290" y1="160" x2="360" y2="160" stroke="#f59e0b" stroke-width="2" marker-end="url(#p23-f1-arrow)"/>
      <text x="296" y="148" fill="#fcd34d" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif">Lien Released &rarr;</text>
      <text x="296" y="176" fill="#94a3b8" font-size="9" font-family="ui-monospace, monospace">projects.delete</text>

      <!-- STATE 2: DELETE_REQUESTED (30-Day Window) -->
      <g transform="translate(365, 85)">
        <rect width="260" height="230" rx="10" fill="url(#p23-f1-pending)" stroke="#f59e0b" stroke-width="2"/>
        <rect x="0" y="0" width="260" height="38" rx="10" fill="#b45309"/>
        <text x="16" y="24" fill="#ffffff" font-size="13" font-weight="700" font-family="system-ui, -apple-system, sans-serif">STATE 2: DELETE_REQUESTED</text>
        <text x="16" y="60" fill="#fde68a" font-size="11" font-weight="600" font-family="system-ui, -apple-system, sans-serif">30-Day Soft Recovery Window</text>
        <text x="16" y="80" fill="#e2e8f0" font-size="10" font-family="system-ui, -apple-system, sans-serif">&bull; Compute VMs stopped immediately</text>
        <text x="16" y="98" fill="#e2e8f0" font-size="10" font-family="system-ui, -apple-system, sans-serif">&bull; External static IPs released to pool</text>
        <text x="16" y="116" fill="#e2e8f0" font-size="10" font-family="system-ui, -apple-system, sans-serif">&bull; Cloud Billing automatically detached</text>
        <text x="16" y="134" fill="#e2e8f0" font-size="10" font-family="system-ui, -apple-system, sans-serif">&bull; Configuration &amp; disks preserved</text>

        <!-- Recovery Window Detail -->
        <g transform="translate(12, 148)">
          <rect width="236" height="70" rx="6" fill="#2d1704" stroke="#f59e0b" stroke-width="1.2"/>
          <text x="10" y="18" fill="#fde68a" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif">RECOVERY BOUNDARY (Days 1–30)</text>
          <text x="10" y="34" fill="#cbd5e1" font-size="9" font-family="system-ui, -apple-system, sans-serif">Principal with roles/resourcemanager.</text>
          <text x="10" y="48" fill="#cbd5e1" font-size="9" font-family="ui-monospace, monospace">projectDeleter can execute undelete</text>
          <text x="10" y="62" fill="#fde68a" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif">Restores configs, requires re-linking billing</text>
        </g>
      </g>

      <!-- Recovery Arc (Undelete) Back to ACTIVE -->
      <path d="M 430 315 C 430 380, 220 380, 220 315" fill="none" stroke="#22c55e" stroke-width="2" marker-end="url(#p23-f1-arrow-green)"/>
      <text x="255" y="395" fill="#86efac" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif">&larr; RECOVERY PATH: projects.undelete (Restores to Active State)</text>

      <!-- Transition: 30 Days Expire -->
      <line x1="625" y1="160" x2="695" y2="160" stroke="#f43f5e" stroke-width="2" marker-end="url(#p23-f1-arrow)"/>
      <text x="632" y="148" fill="#fca5a5" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif">Day 31 Expiry &rarr;</text>
      <text x="632" y="176" fill="#94a3b8" font-size="9" font-family="system-ui, -apple-system, sans-serif">Automated Purge</text>

      <!-- STATE 3: PERMANENTLY DELETED -->
      <g transform="translate(700, 85)">
        <rect width="220" height="230" rx="10" fill="url(#p23-f1-purged)" stroke="#f43f5e" stroke-width="2"/>
        <rect x="0" y="0" width="220" height="38" rx="10" fill="#9f1239"/>
        <text x="16" y="24" fill="#ffffff" font-size="13" font-weight="700" font-family="system-ui, -apple-system, sans-serif">STATE 3: DELETED</text>
        <text x="16" y="60" fill="#fca5a5" font-size="11" font-weight="600" font-family="system-ui, -apple-system, sans-serif">Permanent Physical Purge</text>
        <text x="16" y="80" fill="#e2e8f0" font-size="10" font-family="system-ui, -apple-system, sans-serif">&bull; Cryptographic disk erasure</text>
        <text x="16" y="98" fill="#e2e8f0" font-size="10" font-family="system-ui, -apple-system, sans-serif">&bull; Configurations irrecoverable</text>
        <text x="16" y="116" fill="#e2e8f0" font-size="10" font-family="system-ui, -apple-system, sans-serif">&bull; Project ID permanently retired</text>
        <text x="16" y="134" fill="#fca5a5" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif">&bull; ID CANNOT be reused ever</text>

        <g transform="translate(10, 148)">
          <rect width="200" height="70" rx="6" fill="#3b0717" stroke="#f43f5e" stroke-width="1.2"/>
          <text x="10" y="18" fill="#fca5a5" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif">HARD TERMINATION</text>
          <text x="10" y="34" fill="#fecaca" font-size="9" font-family="system-ui, -apple-system, sans-serif">Zero recourse via Google Support.</text>
          <text x="10" y="48" fill="#fecaca" font-size="9" font-family="system-ui, -apple-system, sans-serif">Metadata stripped from directory.</text>
          <text x="10" y="62" fill="#f87171" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif">Total data shredding complete.</text>
        </g>
      </g>

      <!-- Bottom Guidance / Best Practices Panel -->
      <g transform="translate(40, 425)">
        <rect width="880" height="75" rx="8" fill="#111827" stroke="#334155" stroke-width="1.2"/>
        <text x="18" y="22" fill="#38bdf8" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif">PRODUCTION LIFECYCLE BEST PRACTICES:</text>
        <text x="18" y="40" fill="#cbd5e1" font-size="10" font-family="system-ui, -apple-system, sans-serif">1. Attach a protective Project Lien (`resourcemanager.lien`) on all production and shared-services projects during Terraform provisioning.</text>
        <text x="18" y="56" fill="#cbd5e1" font-size="10" font-family="system-ui, -apple-system, sans-serif">2. Restrict `roles/resourcemanager.projectDeleter` and lien removal privileges strictly to central Enterprise Cloud Architecture review boards.</text>
        <text x="18" y="70" fill="#cbd5e1" font-size="10" font-family="system-ui, -apple-system, sans-serif">3. During accidental deletion, execute `gcloud projects undelete` within 30 days and immediately re-link the Cloud Billing account.</text>
      </g>
    </svg>
  </div>
  <figcaption>
    <strong>Figure 23.1: Google Cloud Project Lifecycle State Machine and Lien Protection Architecture.</strong>
    Illustrates project state transitions from Active through Delete Requested (30-day soft recovery window) to permanently purged. Shows how project liens block accidental shutdown requests, how the undelete API restores projects before day 30, and emphasizes that project IDs are permanently retired and cannot be recycled after purge.
  </figcaption>
</figure>
