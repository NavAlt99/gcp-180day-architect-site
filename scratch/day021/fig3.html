        <text x="15" y="24" fill="#f87171" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">[FAILED PATH: Unmanaged Orphan Project Security Breach]</text>
        <text x="15" y="46" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">1. Project parent = No Organization (Orphan)</text>
        <text x="15" y="64" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">2. Org policies (constraints/compute.vmExternalIp) absent!</text>
        <text x="15" y="84" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">3. Contractor deploys database with public 0.0.0.0 IP</text>

        <text x="25" y="206" fill="#86efac" font-family="monospace" font-size="9">$ gcloud org-policies check</text>
        <text x="25" y="222" fill="#bbf7d0" font-family="system-ui, sans-serif" font-size="9">[ENFORCED] vmExternalIpAccess</text>

        <rect x="15" y="275" width="210" height="60" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
        <text x="25" y="295" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Invariant Preserved:</text>

      <text x="45" y="480" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Architectural Rule: Never permit corporate workloads to run in standalone projects outside the Organization node.</text>
      <text x="45" y="495" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Bind project creation permissions exclusively to corporate Cloud Identity groups to maintain enterprise governance.</text>

  <figcaption>
    <strong>Figure 21.3: Incident Flow · Rogue Unmanaged Project Creation vs. Org Governance.</strong>
    Contrasts a security exposure caused by an orphan project created outside corporate boundaries with an organization-anchored project enforcing centralized guardrails.
    <br><strong>Supplied facts:</strong> Projects created by personal accounts lack an Organization parent, bypassing organizational constraints and central audit logging.
    <br><strong>Architectural inference:</strong> Unmanaged shadow IT projects expose infrastructure to automated scanners and risk data loss when contractors depart.
    <br><strong>Expected post-fix behavior:</strong> Projects are moved under the corporate Organization node, inheriting external IP blocks and centralized audit logging, while database deduplication preserves fulfillment invariants.
  </figcaption>
</figure>
