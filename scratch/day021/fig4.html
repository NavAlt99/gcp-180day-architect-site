
<figure class="diagram-figure" id="fig-21-4">

        <text x="15" y="46" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">1. Dev group assigned roles/editor on /Order-Fulfillment</text>
        <text x="15" y="64" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">2. Additive IAM propagates Editor role to ALL child projects</text>
        <text x="15" y="84" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">3. Dev executes local staging test script: DROP TABLE</text>

        <text x="15" y="122" fill="#f87171" font-family="system-ui, sans-serif" font-size="10">4. Morning bakery dispatch halted; loyalty data corrupted</text>
        <text x="15" y="140" fill="#f87171" font-family="system-ui, sans-serif" font-size="10">DB row-lock stopped duplicate order re-execution.</text>

        <text x="25" y="238" fill="#4ade80" font-family="system-ui, sans-serif" font-size="9">Production protected 100%</text>

        <text x="25" y="295" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Invariant Preserved:</text>

      <text x="45" y="480" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Architectural Rule: Never mix development and production projects inside the same parent folder.</text>
      <text x="45" y="495" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Always employ an Environment-First top-level folder hierarchy to prevent additive IAM permissions from compromising production.</text>
    </svg>
  </div>
  <figcaption>
    <strong>Figure 21.4: Incident Flow · Flat Folder Permission Leakage vs. Environment Segregation.</strong>
    Traces how an unsegregated folder structure allowed developer editor permissions to inherit into production, causing a catastrophic database deletion, and how environment-first separation corrected the defect.
    <br><strong>Supplied facts:</strong> IAM permissions are additive; assigning roles/editor at a parent folder grants write privileges across all child projects.
    <br><strong>Architectural inference:</strong> Placing staging and production in a single folder makes accidental cross-environment destruction inevitable during routine testing.
    <br><strong>Expected post-fix behavior:</strong> Folders are structured strictly by environment stage (/Production, /Non-Production), with developer write grants bounded exclusively to non-production leaf nodes.
  </figcaption>
</figure>
