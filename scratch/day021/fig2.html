
<figure class="diagram-figure" id="fig-21-2">

        <text x="30" y="280" fill="#86efac" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">ADVANTAGES OF ENVIRONMENT-FIRST:</text>
        <text x="30" y="298" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9">• Zero risk of developer permissions leaking into production</text>
        <text x="30" y="314" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9">• Organizational security constraints applied uniformly per stage</text>
        <text x="30" y="330" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9">• Easy mapping to compliance boundaries (e.g. PCI-DSS, SOC2)</text>

        <text x="30" y="214" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">3. Project Policy Binding (proj-order-dev):</text>
        <text x="30" y="232" fill="#cbd5e1" font-family="monospace" font-size="9">alice@brightloaf.com &rarr; roles/viewer</text>

        <!-- Evaluation Output -->
        <rect x="20" y="260" width="390" height="85" rx="4" fill="#261208" stroke="#b45309" stroke-width="1"/>
        <text x="30" y="280" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">EFFECTIVE PERMISSION EVALUATION:</text>
        <text x="30" y="298" fill="#f87171" font-family="system-ui, sans-serif" font-size="9">• Project Viewer DOES NOT restrict Folder Editor role!</text>
        <text x="30" y="314" fill="#fde68a" font-family="system-ui, sans-serif" font-size="9">• Effective access on proj-order-dev = roles/editor (Full Write!)</text>
        <text x="30" y="330" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9">• Rule: IAM cannot restrict access granted higher in the tree.</text>

      <!-- Bottom Banner -->
      <rect x="30" y="460" width="900" height="45" rx="6" fill="#111827" stroke="#334155" stroke-width="1"/>
      <text x="45" y="480" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Architectural Rule: Never assign permissive broad roles (e.g. Editor) at the Folder or Organization level.</text>
      <text x="45" y="495" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Keep folder-level grants restricted to administrative oversight roles (Viewer, Security Reviewer); assign mutating roles strictly at leaf Projects.</text>
    </svg>

  <figcaption>
    <strong>Figure 21.2: Folder Hierarchy Structuring &amp; Additive IAM Inheritance.</strong>
    Compares the environment-first folder architecture with business-unit models and visualizes the additive nature of IAM role inheritance down the resource tree.
    <br><strong>Supplied facts:</strong> IAM policies are evaluated as a union: granting a role on a parent folder grants that role on all descendant projects; child projects cannot deny or restrict parent grants.
    <br><strong>Architectural inference:</strong> Granting developer write roles at a parent folder containing both staging and production projects inevitably leads to accidental production mutations.
    <br><strong>Expected post-fix behavior:</strong> Organizations structure folders by environment stage (/Production, /Non-Production), reserving parent folder grants for read-only telemetry and binding write access strictly at project boundaries.
  </figcaption>
</figure>
