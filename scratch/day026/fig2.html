        <figure class="diagram-container">
          <svg viewBox="0 0 960 520" width="100%" height="auto" role="img" aria-labelledby="fig26-2-title fig26-2-desc" style="background:#121526; border-radius:8px; border:1px solid #1e293b; display:block; margin:0 auto;">
            <title id="fig26-2-title">Figure 26.2: Application Default Credentials Resolution and Token Types</title>
            <desc id="fig26-2-desc">Flow diagram showing the sequential Application Default Credentials (ADC) resolution chain and contrasting OAuth2 Access Tokens with OpenID Connect (OIDC) ID Tokens.</desc>
            <defs>
              <marker id="arrow26-2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
              </marker>
            </defs>

            <!-- Title -->
            <text x="480" y="32" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Figure 26.2: ADC Resolution Chain &amp; Token Anatomy</text>
            <text x="480" y="52" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">How client libraries discover credentials and select OAuth2 Access Tokens vs. OIDC ID Tokens</text>

            <!-- Left Box: ADC Search Chain -->
            <g transform="translate(30, 75)">
              <rect width="360" height="420" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#38bdf8" stroke-width="1.5"/>
              <rect x="0" y="0" width="360" height="36" rx="8" fill="#38bdf8" fill-opacity="0.2"/>
              <text x="180" y="24" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Application Default Credentials (ADC) Search Order</text>

              <!-- Step 1 -->
              <g transform="translate(20, 50)">
                <rect width="320" height="70" rx="6" fill="#0f172a" stroke="#94a3b8" stroke-width="1"/>
                <text x="15" y="22" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">1. Environment Variable</text>
                <text x="15" y="40" fill="#38bdf8" font-family="monospace" font-size="10">GOOGLE_APPLICATION_CREDENTIALS</text>
                <text x="15" y="58" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Explicit file path to credentials on disk</text>
              </g>

              <line x1="180" y1="120" x2="180" y2="140" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow26-2)"/>

              <!-- Step 2 -->
              <g transform="translate(20, 145)">
                <rect width="320" height="75" rx="6" fill="#0f172a" stroke="#94a3b8" stroke-width="1"/>
                <text x="15" y="22" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">2. User ADC (Local Development)</text>
                <text x="15" y="40" fill="#22c55e" font-family="monospace" font-size="10">gcloud auth application-default login</text>
                <text x="15" y="58" fill="#94a3b8" font-family="monospace" font-size="9">~/.config/gcloud/application_default_credentials.json</text>
              </g>

              <line x1="180" y1="220" x2="180" y2="240" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow26-2)"/>

              <!-- Step 3 -->
              <g transform="translate(20, 245)">
                <rect width="320" height="85" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
                <text x="15" y="22" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">3. Attached Compute Metadata Server</text>
                <text x="15" y="40" fill="#7dd3fc" font-family="monospace" font-size="9">http://metadata.google.internal/computeMetadata/v1/</text>
                <text x="15" y="55" fill="#e2e8f0" font-family="monospace" font-size="9">Header: Metadata-Flavor: Google</text>
                <text x="15" y="72" fill="#22c55e" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">Production Workload Standard (GCE/GKE/Cloud Run)</text>
              </g>

              <!-- Failure -->
              <line x1="180" y1="330" x2="180" y2="350" stroke="#f43f5e" stroke-width="1.5" marker-end="url(#arrow26-2)"/>
              <rect x="20" y="355" width="320" height="45" rx="6" fill="#450a0a" stroke="#f43f5e" stroke-width="1"/>
              <text x="180" y="375" fill="#fecdd3" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">RESOLUTION FAILURE: DefaultCredentialsError</text>
              <text x="180" y="390" fill="#fca5a5" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">Thrown if running outside GCP with no ADC file configured</text>
            </g>

            <!-- Right Box: Access Tokens vs ID Tokens -->
            <g transform="translate(420, 75)">
              <rect width="510" height="420" rx="8" fill="#182234" stroke="#94a3b8" stroke-width="1.5"/>
              <rect x="0" y="0" width="510" height="36" rx="8" fill="#334155" fill-opacity="0.5"/>
              <text x="255" y="24" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Token Types: Authorization vs. Identity</text>

              <!-- Panel 1: Access Token -->
              <g transform="translate(20, 50)">
                <rect width="470" height="165" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
                <rect x="0" y="0" width="470" height="28" rx="6" fill="#0c4a6e"/>
                <text x="15" y="19" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">OAUTH2 ACCESS TOKEN (AUTHORIZATION)</text>
                <text x="455" y="19" fill="#7dd3fc" font-family="monospace" font-size="10" text-anchor="end">Max Lifetime: 3600s (1 hr)</text>

                <text x="15" y="48" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="11"><strong>Target Consumer:</strong> Google Cloud APIs (<code>*.googleapis.com</code>)</text>
                <text x="15" y="68" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="11"><strong>Evaluation:</strong> Decoded &amp; validated by Google Cloud API Gateway against IAM policies</text>
                <text x="15" y="88" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="11"><strong>Key Fields:</strong> Scopes (<code>https://www.googleapis.com/auth/cloud-platform</code>)</text>
                <text x="15" y="108" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="11"><strong>Format:</strong> Opaque bearer string (e.g., <code>ya29.c.b0...</code>)</text>
                
                <rect x="15" y="120" width="440" height="32" rx="4" fill="#1e293b"/>
                <text x="25" y="140" fill="#94a3b8" font-family="monospace" font-size="10">Header: <tspan fill="#38bdf8">Authorization: Bearer ya29.c.b0AXv0zT123...</tspan></text>
              </g>

              <!-- Panel 2: ID Token -->
              <g transform="translate(20, 235)">
                <rect width="470" height="165" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
                <rect x="0" y="0" width="470" height="28" rx="6" fill="#064e3b"/>
                <text x="15" y="19" fill="#22c55e" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">OPENID CONNECT (OIDC) ID TOKEN (IDENTITY)</text>
                <text x="455" y="19" fill="#86efac" font-family="monospace" font-size="10" text-anchor="end">Max Lifetime: 3600s (1 hr)</text>

                <text x="15" y="48" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="11"><strong>Target Consumer:</strong> Cloud Run, Cloud Functions, API Gateway, custom endpoints</text>
                <text x="15" y="68" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="11"><strong>Evaluation:</strong> Destination service validates cryptographic signature &amp; audience</text>
                <text x="15" y="88" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="11"><strong>Critical Claim:</strong> <code>aud</code> (must match target service URL: <code>https://service.run.app</code>)</text>
                <text x="15" y="108" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="11"><strong>Format:</strong> Signed JSON Web Token (Header.Payload.Signature)</text>

                <rect x="15" y="120" width="440" height="32" rx="4" fill="#1e293b"/>
                <text x="25" y="140" fill="#94a3b8" font-family="monospace" font-size="10">Claims: <tspan fill="#22c55e">{"iss":"accounts.google.com","aud":"https://run.app","email":"..."}</tspan></text>
              </g>
            </g>
          </svg>
          <figcaption class="diagram-caption">Figure 26.2: Application Default Credentials (ADC) resolution chain and token anatomy. ADC searches environment variables, local user configurations, and the Compute metadata server sequentially. Applications must supply OAuth2 Access Tokens when calling Google APIs and OpenID Connect (OIDC) ID Tokens with specific audience claims when invoking private Cloud Run microservices.</figcaption>
        </figure>
