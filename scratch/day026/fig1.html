        <figure class="diagram-container">
          <svg viewBox="0 0 960 480" width="100%" height="auto" role="img" aria-labelledby="fig26-1-title fig26-1-desc" style="background:#121526; border-radius:8px; border:1px solid #1e293b; display:block; margin:0 auto;">
            <title id="fig26-1-title">Figure 26.1: Service Account Key Avoidance, Attached Identity, and Impersonation Architecture</title>
            <desc id="fig26-1-desc">Architectural comparison showing the vulnerabilities of static service account JSON keys contrasted with attached workload identities and audited ephemeral impersonation flows.</desc>
            <defs>
              <linearGradient id="gBadKey" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.2"/>
                <stop offset="100%" stop-color="#121526" stop-opacity="0.8"/>
              </linearGradient>
              <linearGradient id="gAttached" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
                <stop offset="100%" stop-color="#121526" stop-opacity="0.8"/>
              </linearGradient>
              <linearGradient id="gImpersonate" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#22c55e" stop-opacity="0.2"/>
                <stop offset="100%" stop-color="#121526" stop-opacity="0.8"/>
              </linearGradient>
              <marker id="arrow26-1" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8"/>
              </marker>
            </defs>

            <!-- Grid Header -->
            <text x="480" y="34" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Figure 26.1: Service Account Key Avoidance &amp; Credential Lifecycles</text>
            <text x="480" y="56" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">Eliminating static private keys via attached workload identity and IAM impersonation</text>

            <!-- Column 1: Static JSON Keys (Antipattern) -->
            <g transform="translate(40, 80)">
              <rect width="260" height="340" rx="8" fill="url(#gBadKey)" stroke="#f43f5e" stroke-width="1.5"/>
              <rect x="0" y="0" width="260" height="42" rx="8" fill="#f43f5e" fill-opacity="0.25"/>
              <text x="130" y="26" fill="#f43f5e" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">STATIC JSON KEYS (ANTIPATTERN)</text>

              <text x="20" y="65" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="700">key.json (RSA Private Key)</text>
              <line x1="20" y1="75" x2="240" y2="75" stroke="#334155" stroke-width="1"/>

              <text x="20" y="100" fill="#fca5a5" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">&bull; Lifetime: 10 years / Indefinite</text>
              <text x="20" y="125" fill="#fca5a5" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">&bull; Storage: Plaintext on disk / repo</text>
              <text x="20" y="150" fill="#fca5a5" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">&bull; Rotation: Manual, risky, ignored</text>
              <text x="20" y="175" fill="#fca5a5" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">&bull; Audit Trail: Unattributable</text>
              <text x="20" y="200" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">&bull; Exfiltration Risk: Severe</text>
              <text x="20" y="225" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">&bull; Organization Policy: Block via</text>
              <text x="30" y="242" fill="#fda4af" font-family="monospace" font-size="10">iam.disableServiceAccountKeyCreation</text>

              <rect x="20" y="275" width="220" height="45" rx="6" fill="#450a0a" stroke="#f43f5e" stroke-width="1"/>
              <text x="130" y="295" fill="#fecdd3" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">STRICTLY PROHIBITED</text>
              <text x="130" y="310" fill="#fca5a5" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">#1 vector of enterprise cloud compromise</text>
            </g>

            <!-- Column 2: Attached Workload Identity -->
            <g transform="translate(350, 80)">
              <rect width="260" height="340" rx="8" fill="url(#gAttached)" stroke="#38bdf8" stroke-width="1.5"/>
              <rect x="0" y="0" width="260" height="42" rx="8" fill="#38bdf8" fill-opacity="0.25"/>
              <text x="130" y="26" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">ATTACHED WORKLOAD IDENTITY</text>

              <text x="20" y="65" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="700">Compute Metadata Server</text>
              <line x1="20" y1="75" x2="240" y2="75" stroke="#334155" stroke-width="1"/>

              <text x="20" y="100" fill="#7dd3fc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">&bull; Lifetime: 1 Hour (auto-refreshed)</text>
              <text x="20" y="125" fill="#7dd3fc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">&bull; Storage: Ephemeral in memory only</text>
              <text x="20" y="150" fill="#22c55e" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">&bull; Rotation: Fully automated by Google</text>
              <text x="20" y="175" fill="#7dd3fc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">&bull; Audit Trail: Bound to VM / Pod / Run</text>
              <text x="20" y="200" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">&bull; Mechanisms: GCE, Cloud Run, GKE</text>
              <text x="20" y="225" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">&bull; Metadata Endpoint:</text>
              <text x="30" y="242" fill="#38bdf8" font-family="monospace" font-size="10">169.254.169.254 (Metadata-Flavor: Google)</text>

              <rect x="20" y="275" width="220" height="45" rx="6" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1"/>
              <text x="130" y="295" fill="#bae6fd" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">PRODUCTION WORKLOAD STANDARD</text>
              <text x="130" y="310" fill="#7dd3fc" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">Zero local files; hardware-isolated token minting</text>
            </g>

            <!-- Column 3: IAM Impersonation -->
            <g transform="translate(660, 80)">
              <rect width="260" height="340" rx="8" fill="url(#gImpersonate)" stroke="#22c55e" stroke-width="1.5"/>
              <rect x="0" y="0" width="260" height="42" rx="8" fill="#22c55e" fill-opacity="0.25"/>
              <text x="130" y="26" fill="#22c55e" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">SERVICE ACCOUNT IMPERSONATION</text>

              <text x="20" y="65" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="700">generateAccessToken API</text>
              <line x1="20" y1="75" x2="240" y2="75" stroke="#334155" stroke-width="1"/>

              <text x="20" y="100" fill="#86efac" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">&bull; Lifetime: Up to 1 Hour (configurable)</text>
              <text x="20" y="125" fill="#86efac" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">&bull; Storage: Memory cache during session</text>
              <text x="20" y="150" fill="#86efac" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">&bull; Required Role on Target SA:</text>
              <text x="30" y="168" fill="#22c55e" font-family="monospace" font-size="10">roles/iam.serviceAccountTokenCreator</text>
              <text x="20" y="192" fill="#86efac" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">&bull; Audit Trail: Dual-Principal Logging</text>
              <text x="30" y="210" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">(Logs who impersonated + actions taken)</text>
              <text x="20" y="235" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">&bull; Use Case: CI/CD, local developers, SRE</text>

              <rect x="20" y="275" width="220" height="45" rx="6" fill="#052e16" stroke="#22c55e" stroke-width="1"/>
              <text x="130" y="295" fill="#bbf7d0" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">HUMAN &amp; CI/CD BEST PRACTICE</text>
              <text x="130" y="310" fill="#86efac" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">Auditable ephemeral delegation without keys</text>
            </g>

            <!-- Bottom Note -->
            <text x="480" y="450" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">Security Principle: Enforce organization policy constraints/iam.disableServiceAccountKeyCreation to prevent key generation across all projects.</text>
          </svg>
          <figcaption class="diagram-caption">Figure 26.1: Service account identity lifecycles and risk profiles. Static JSON keys present catastrophic blast radiuses due to unmanaged longevity; attached workload identities and IAM impersonation provide ephemeral, auditable, short-lived tokens without storing persistent credentials on disk.</figcaption>
        </figure>
