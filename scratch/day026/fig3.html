          <figcaption class="diagram-caption">Figure 26.3: Architecture comparison for Incident 26.1.
            <br><strong>Supplied facts:</strong> External adversary extracted a downloaded service account JSON key from a public repository and used it to issue unauthorized mutations against the production Cloud Spanner database.
            <br><strong>Architectural inference:</strong> Static service account keys lack hardware binding, automatic expiration, and caller attribution, allowing unmonitored exfiltration and remote misuse.
            <br><strong>Expected post-fix behavior:</strong> Key creation is disabled via organization policy; workloads migrate to attached metadata identities and human engineers use IAM impersonation, ensuring ephemeral token lifecycles and complete dual-principal audit trails.
