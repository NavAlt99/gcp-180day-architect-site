          <figcaption class="diagram-caption">Figure 26.4: Architecture comparison for Incident 26.2.
            <br><strong>Supplied facts:</strong> Edge store gateways were rejected with HTTP 401 Unauthorized when attempting to post batch order requests to a private Cloud Run endpoint.
            <br><strong>Architectural inference:</strong> Cloud Run private ingress requires an OpenID Connect (OIDC) ID token with an audience claim exactly matching the service URL; client code had erroneously supplied an OAuth2 access token meant for Google Cloud APIs.
            <br><strong>Expected post-fix behavior:</strong> Client library is reconfigured to invoke the IAM Credentials API generateIdToken method targeting the Cloud Run URI; Cloud Run validates the JWT signature and audience, successfully processing orders without duplicate replays.
