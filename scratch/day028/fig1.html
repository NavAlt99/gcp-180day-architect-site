        <figure class="architecture-diagram" id="fig-28-1">
          <svg viewBox="0 0 980 440" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-28-1-title fig-28-1-desc">
            <title id="fig-28-1-title">Figure 28.1: Programmatic Pub/Sub Budget Notification Architecture &amp; Idempotent Consumer State Machine</title>
            <desc id="fig-28-1-desc">Architectural diagram illustrating how Google Cloud Billing budget alerts publish JSON event envelopes to a Cloud Pub/Sub topic, and how an idempotent consumer checks a persistent state store to filter duplicate messages before executing remediation workflows.</desc>
            <defs>
              <linearGradient id="bg-grad-28-1" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#090d16"/>
                <stop offset="100%" stop-color="#121526"/>
              </linearGradient>
              <linearGradient id="panel-grad-28-1" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#161b30"/>
                <stop offset="100%" stop-color="#1e243d"/>
              </linearGradient>
              <marker id="arrow-cyan-28-1" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
              </marker>
              <marker id="arrow-green-28-1" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1 L 8 5 L 0 9 z" fill="#22c55e"/>
              </marker>
              <marker id="arrow-amber-28-1" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1 L 8 5 L 0 9 z" fill="#f59e0b"/>
              </marker>
              <marker id="arrow-rose-28-1" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1 L 8 5 L 0 9 z" fill="#f43f5e"/>
              </marker>
            </defs>

            <!-- Background canvas -->
            <rect width="980" height="440" rx="12" fill="url(#bg-grad-28-1)" stroke="#1e293b" stroke-width="1.5"/>

            <!-- Diagram Title Banner -->
            <text x="30" y="38" fill="#f8fafc" font-size="16" font-weight="700" font-family="system-ui, -apple-system, sans-serif">Programmatic Pub/Sub Budget Notifications &amp; Idempotent Consumer Flow</text>
            <text x="30" y="58" fill="#94a3b8" font-size="12" font-family="system-ui, -apple-system, sans-serif">Cloud Billing Budget triggers &rarr; Pub/Sub at-least-once delivery &rarr; Deduplication state check &rarr; Gated remediation</text>

            <!-- Step 1: Cloud Billing Engine -->
            <rect x="30" y="90" width="200" height="150" rx="8" fill="url(#panel-grad-28-1)" stroke="#38bdf8" stroke-width="1.5"/>
            <rect x="42" y="102" width="65" height="20" rx="4" fill="#0284c7" fill-opacity="0.25"/>
            <text x="74" y="116" fill="#38bdf8" font-size="10" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">BILLING ENGINE</text>
            <text x="42" y="142" fill="#f8fafc" font-size="14" font-weight="700" font-family="system-ui, sans-serif">Cloud Billing Budget</text>
            <text x="42" y="162" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">• Evaluates Actual &amp; Forecast Spend</text>
            <text x="42" y="180" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">• Rule Thresholds: 50%, 90%, 100%</text>
            <text x="42" y="198" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">• Period: Monthly / Calendar / Custom</text>
            <text x="42" y="222" fill="#38bdf8" font-size="11" font-weight="600" font-family="system-ui, sans-serif">Publishes event JSON envelope</text>

            <!-- Arrow 1: Billing -> Pub/Sub -->
            <line x1="230" y1="165" x2="274" y2="165" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-cyan-28-1)"/>
            <text x="252" y="155" fill="#38bdf8" font-size="10" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Publish</text>

            <!-- Step 2: Pub/Sub Topic -->
            <rect x="280" y="90" width="210" height="150" rx="8" fill="url(#panel-grad-28-1)" stroke="#f59e0b" stroke-width="1.5"/>
            <rect x="292" y="102" width="75" height="20" rx="4" fill="#d97706" fill-opacity="0.25"/>
            <text x="329" y="116" fill="#f59e0b" font-size="10" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">CLOUD PUB/SUB</text>
            <text x="292" y="142" fill="#f8fafc" font-size="14" font-weight="700" font-family="system-ui, sans-serif">projects/.../topics/budget</text>
            <text x="292" y="162" fill="#f59e0b" font-size="11" font-weight="600" font-family="system-ui, sans-serif">At-Least-Once Delivery Semantics</text>
            <text x="292" y="180" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">• Redeliveries on ACK timeout</text>
            <text x="292" y="198" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">• Multiple updates per billing day</text>
            <text x="292" y="222" fill="#94a3b8" font-size="11" font-style="italic" font-family="system-ui, sans-serif">Duplicates ARE expected</text>

            <!-- Arrow 2: Pub/Sub -> Consumer -->
            <line x1="490" y1="165" x2="534" y2="165" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-amber-28-1)"/>
            <text x="512" y="155" fill="#f59e0b" font-size="10" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Push / Pull</text>

            <!-- Step 3: Idempotent Consumer -->
            <rect x="540" y="90" width="220" height="150" rx="8" fill="url(#panel-grad-28-1)" stroke="#22c55e" stroke-width="1.5"/>
            <rect x="552" y="102" width="70" height="20" rx="4" fill="#16a34a" fill-opacity="0.25"/>
            <text x="587" y="116" fill="#22c55e" font-size="10" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">CONSUMER</text>
            <text x="552" y="142" fill="#f8fafc" font-size="14" font-weight="700" font-family="system-ui, sans-serif">Cloud Run / Function</text>
            <text x="552" y="162" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">1. Parse JSON envelope</text>
            <text x="552" y="180" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">2. Extract composite state key:</text>
            <text x="562" y="198" fill="#38bdf8" font-size="10" font-family="monospace">budget_id + interval + threshold</text>
            <text x="552" y="222" fill="#22c55e" font-size="11" font-weight="600" font-family="system-ui, sans-serif">3. Atomic Deduplication Lookup</text>

            <!-- State Store Box (Bottom Center) -->
            <rect x="540" y="280" width="220" height="120" rx="8" fill="#0f172a" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3"/>
            <text x="650" y="306" fill="#f8fafc" font-size="13" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">Idempotency State Store</text>
            <text x="650" y="326" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle">(Firestore / Memorystore / SQL)</text>
            <text x="552" y="352" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">• Key: <tspan fill="#38bdf8">display_name#interval#thresh</tspan></text>
            <text x="552" y="372" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">• Record processed timestamp &amp; status</text>
            <text x="552" y="390" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">• TTL expiry aligned with billing cycle</text>

            <!-- Two-way lookup arrow between Consumer and State Store -->
            <line x1="630" y1="240" x2="630" y2="274" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-cyan-28-1)"/>
            <text x="618" y="262" fill="#94a3b8" font-size="9" font-family="system-ui, sans-serif" text-anchor="end">Check Key</text>
            <line x1="670" y1="274" x2="670" y2="246" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow-green-28-1)"/>
            <text x="682" y="262" fill="#22c55e" font-size="9" font-family="system-ui, sans-serif">Record Lock</text>

            <!-- Branch A: Duplicate detected (Bottom Right) -->
            <path d="M 760 185 L 820 185 L 820 300 L 844 300" fill="none" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrow-rose-28-1)"/>
            <rect x="850" y="270" width="105" height="60" rx="6" fill="#450a0a" stroke="#f43f5e" stroke-width="1.5"/>
            <text x="902" y="292" fill="#f87171" font-size="11" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">DUPLICATE</text>
            <text x="902" y="308" fill="#fca5a5" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Skip Action</text>
            <text x="902" y="322" fill="#fca5a5" font-size="9" font-family="system-ui, sans-serif" text-anchor="middle">ACK Message</text>

            <!-- Branch B: New Threshold (Top Right) -->
            <path d="M 760 140 L 844 140" fill="none" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow-green-28-1)"/>
            <rect x="850" y="110" width="105" height="60" rx="6" fill="#052e16" stroke="#22c55e" stroke-width="1.5"/>
            <text x="902" y="132" fill="#4ade80" font-size="11" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">NEW EVENT</text>
            <text x="902" y="148" fill="#86efac" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Run Workflow</text>
            <text x="902" y="162" fill="#86efac" font-size="9" font-family="system-ui, sans-serif" text-anchor="middle">ACK Message</text>

            <!-- Invariant Protection Footer Note -->
            <rect x="30" y="280" width="460" height="120" rx="8" fill="#13192e" stroke="#1e293b" stroke-width="1"/>
            <text x="45" y="304" fill="#38bdf8" font-size="12" font-weight="700" font-family="system-ui, sans-serif">Idempotent Remediation Guardrails</text>
            <text x="45" y="324" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">1. <tspan font-weight="600">Duplicate Fulfillment Invariant (&le; 1 fulfillment):</tspan> Automated scaling or</text>
            <text x="61" y="340" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">quota actions must NEVER disrupt order ingestion or dispatch services.</text>
            <text x="45" y="360" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">2. <tspan font-weight="600">Target Isolation:</tspan> Automated throttling restricted strictly to development,</text>
            <text x="61" y="376" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">sandbox, and unattached batch analytics pipelines.</text>
            <text x="45" y="394" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">3. <tspan font-weight="600">Audit Trail:</tspan> Every Pub/Sub ACK and deduplicated discard logged to Cloud Logging.</text>
          </svg>
          <figcaption>Figure 28.1: Programmatic Pub/Sub Budget Notification Architecture &amp; Idempotent Consumer State Machine. Google Cloud Billing evaluates budgets and sends JSON envelopes to Pub/Sub with at-least-once delivery guarantees. The downstream consumer derives a deterministic composite state key to query a state store, safely executing remediation workflows on unique threshold events while discarding duplicate deliveries to protect production availability.</figcaption>
        </figure>
