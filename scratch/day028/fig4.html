          <figcaption>Figure 28.4: Incident 28.2 - Unlabeled Workload Contamination vs. Governed Label Attribution Architecture.
            <br><strong>Supplied facts:</strong> An ad-hoc data analytics cluster lacked mandatory cost-center labels. A naive FinOps SQL query fell back to the project ID, dumping $38,500 of exploratory analytics compute into the eCommerce operations budget.
            <br><strong>Architectural inference:</strong> Relying on default project IDs for unallocated spend creates severe organizational friction; mandatory labels must be enforced at deploy time, and unallocated spend must be segregated into an explicit debt bucket.
            <br><strong>Expected post-fix behavior:</strong> CI/CD blocks deployments lacking mandatory labels (<code>cost-center</code>, <code>env</code>, <code>service</code>, <code>owner</code>), FinOps SQL maps remaining untagged spend to <code>UNALLOCATED_SHARED_DEBT</code>, and operational order services retain full budget stability.
          </figcaption>
        </figure>
