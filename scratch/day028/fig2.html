        <figure class="architecture-diagram" id="fig-28-2">

            <text x="52" y="280" fill="#38bdf8" font-size="10" font-family="monospace">cost-center: cc-bakery-ops</text>
            <text x="52" y="298" fill="#38bdf8" font-size="10" font-family="monospace">env: prod | tier: db-ha</text>

            <rect x="362" y="97" width="100" height="20" rx="4" fill="#9333ea" fill-opacity="0.25"/>
            <text x="412" y="111" fill="#c084fc" font-size="10" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">CLOUD BILLING</text>

            <rect x="362" y="168" width="226" height="110" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>

            <rect x="362" y="290" width="226" height="106" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="374" y="310" fill="#f8fafc" font-size="12" font-weight="600" font-family="system-ui, sans-serif">Labels vs Tags vs Network Tags</text>
            <text x="374" y="328" fill="#38bdf8" font-size="10" font-family="system-ui, sans-serif">Labels &rarr; Ingested in Billing Export</text>
            <text x="374" y="346" fill="#f59e0b" font-size="10" font-family="system-ui, sans-serif">Tags &rarr; IAM / Org Policy inheritance</text>

            <!-- Arrow 2: Billing Collector -> BigQuery Export -->
            <line x1="600" y1="240" x2="644" y2="240" stroke="#a855f7" stroke-width="2" marker-end="url(#arrow-cyan-28-2)"/>
            <text x="622" y="230" fill="#a855f7" font-size="10" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Export</text>

            <!-- Section 3: BigQuery Dataset & FinOps SQL -->
            <rect x="650" y="85" width="300" height="325" rx="8" fill="url(#panel-grad-28-2)" stroke="#22c55e" stroke-width="1.5"/>
            <rect x="662" y="97" width="105" height="20" rx="4" fill="#16a34a" fill-opacity="0.25"/>
            <text x="714" y="111" fill="#4ade80" font-size="10" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">FINOPS ANALYTICS</text>
            <text x="662" y="136" fill="#f8fafc" font-size="14" font-weight="700" font-family="system-ui, sans-serif">BigQuery Billing Export</text>
            <text x="662" y="154" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">dataset: billing_export.gcp_billing_...</text>

            <!-- BigQuery Schema Structure snippet -->
            <rect x="662" y="168" width="276" height="110" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="674" y="188" fill="#f8fafc" font-size="11" font-weight="600" font-family="system-ui, sans-serif">Schema: Repeated STRUCT Array</text>
            <text x="674" y="206" fill="#cbd5e1" font-size="10" font-family="monospace">labels: ARRAY&lt;STRUCT&lt;</text>
            <text x="690" y="222" fill="#cbd5e1" font-size="10" font-family="monospace">key STRING, value STRING&gt;&gt;</text>
            <text x="674" y="240" fill="#4ade80" font-size="10" font-weight="600" font-family="monospace">CROSS JOIN UNNEST(labels) AS l</text>
            <text x="674" y="258" fill="#cbd5e1" font-size="10" font-family="monospace">WHERE l.key = 'cost-center'</text>
            <text x="674" y="272" fill="#cbd5e1" font-size="10" font-family="monospace">GROUP BY cost_center, env</text>

            <!-- Attribution Output Card -->
            <rect x="662" y="290" width="276" height="106" rx="6" fill="#052e16" stroke="#22c55e" stroke-width="1"/>
            <text x="674" y="310" fill="#4ade80" font-size="11" font-weight="700" font-family="system-ui, sans-serif">Attribution Worksheet Slicing</text>
            <text x="674" y="328" fill="#86efac" font-size="10" font-family="system-ui, sans-serif">• cc-bakery-ops: $18,420 (94% labeled)</text>
            <text x="674" y="344" fill="#86efac" font-size="10" font-family="system-ui, sans-serif">• cc-growth-mktg: $7,310 (88% labeled)</text>
            <text x="674" y="360" fill="#f87171" font-size="10" font-family="system-ui, sans-serif">• Unlabeled Spend: $4,120 (Audit required)</text>
            <text x="674" y="380" fill="#f8fafc" font-size="10" font-weight="600" font-family="system-ui, sans-serif">&rarr; Zero ambiguity across departments</text>
          </svg>
          <figcaption>Figure 28.2: Resource Labeling Taxonomy &amp; BigQuery Billing Export Cost Attribution Pipeline. Resources tagged with standardized label key-value pairs emit telemetry to the Cloud Billing collector. The detailed billing export stream loads these key-value pairs into BigQuery as repeated STRUCT arrays. FinOps analysts write SQL unnesting queries to partition infrastructure costs by cost center, environment, and service, eliminating shared-resource attribution conflicts.</figcaption>
        </figure>
