<!-- SECTION 3: CONSUMER DEDUPLICATION & IDEMPOTENT PROCESSING TIER -->
<rect x="20" y="450" width="1080" height="205" rx="6" fill="#131b2e" stroke="#1e293b" stroke-width="1.5"/>
<text x="35" y="472" fill="#06b6d4" font-size="13" font-weight="700">3. CONSUMPTION TIER: StreamingPull Consumer, Deduplication Table &amp; Atomic State Transition</text>

<!-- Consumer Pod -->
<rect x="35" y="485" width="295" height="155" rx="4" fill="#0f172a" stroke="#06b6d4" stroke-width="1"/>
<text x="45" y="505" fill="#22d3ee" font-size="11" font-weight="700">Fulfillment Consumer (StreamingPull)</text>
<text x="45" y="522" fill="#cbd5e1" font-size="9.5">Client Library: <code>google-cloud-pubsub</code></text>
<text x="45" y="538" fill="#f59e0b" font-size="9.5">&#9733; Transport EOD Enabled (within deadline)</text>
<rect x="45" y="548" width="275" height="42" rx="3" fill="#164e63" stroke="#06b6d4" stroke-width="1"/>
<text x="52" y="563" fill="#cffafe" font-family="monospace" font-size="8.5">def callback(message):</text>
<text x="52" y="575" fill="#cffafe" font-family="monospace" font-size="8.5">  event_id = message.attributes["event_id"]</text>
<text x="52" y="586" fill="#cffafe" font-family="monospace" font-size="8.5">  process_idempotent(event_id, message.data)</text>
<text x="45" y="605" fill="#f43f5e" font-size="9">&#9888; CRITICAL: Never ACK before DB commit</text>
<text x="45" y="620" fill="#22c55e" font-size="9">&#10003; Auto Ack Deadline Extension active</text>

<!-- Deduplication Engine Box -->
<rect x="365" y="485" width="375" height="155" rx="4" fill="#0f172a" stroke="#06b6d4" stroke-width="1"/>
<text x="375" y="505" fill="#22d3ee" font-size="11" font-weight="700">Idempotent Deduplication Engine (Cloud SQL / Spanner)</text>

<!-- Dedup Table -->
<rect x="375" y="515" width="355" height="115" rx="3" fill="#083344" stroke="#06b6d4" stroke-width="1"/>
<text x="385" y="532" fill="#67e8f9" font-size="10" font-weight="700">TABLE: processed_events (Unique Idempotency Store)</text>
<text x="385" y="548" fill="#cbd5e1" font-family="monospace" font-size="8.5">event_id VARCHAR(64) PRIMARY KEY</text>
<text x="385" y="562" fill="#cbd5e1" font-family="monospace" font-size="8.5">consumer_name VARCHAR(64) NOT NULL</text>
<text x="385" y="576" fill="#cbd5e1" font-family="monospace" font-size="8.5">processed_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP</text>
<text x="385" y="594" fill="#fde68a" font-family="monospace" font-size="8">INSERT INTO processed_events VALUES (id, name)</text>
<text x="385" y="606" fill="#fde68a" font-family="monospace" font-size="8">ON CONFLICT (event_id) DO NOTHING;</text>
<text x="385" y="622" fill="#22c55e" font-size="8.5">&#10003; Rows affected: 1 = NEW &bull; 0 = DUPLICATE REPLAY</text>

<!-- Fulfillment Execution Box -->
<rect x="775" y="485" width="305" height="155" rx="4" fill="#0f172a" stroke="#22c55e" stroke-width="1"/>
<text x="785" y="505" fill="#86efac" font-size="11" font-weight="700">Fulfillment Business Execution</text>
<rect x="785" y="515" width="285" height="52" rx="3" fill="#0f291e" stroke="#22c55e" stroke-width="1"/>
<text x="795" y="532" fill="#cbd5e1" font-size="9">If NEW: Execute Warehouse Pick &amp; Pack</text>
<text x="795" y="546" fill="#cbd5e1" font-size="9">Commit Order Status &rarr; 'FULFILLED'</text>
<text x="795" y="560" fill="#4ade80" font-size="9.5" font-weight="700">COMMIT TRANSACTION;</text>
<rect x="785" y="575" width="285" height="55" rx="3" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
<text x="795" y="593" fill="#fde68a" font-size="10" font-weight="700">Step Final: message.ack()</text>
<text x="795" y="608" fill="#cbd5e1" font-size="8.5">Sent ONLY after DB transaction commits to disk</text>
<text x="795" y="621" fill="#22c55e" font-size="8.5">If duplicate: Skip pick &amp; ack immediately</text>

<!-- SECTION 4: CRASH/ACK BOUNDARY LIFECYCLE -->
<rect x="20" y="670" width="1080" height="175" rx="6" fill="#131b2e" stroke="#1e293b" stroke-width="1.5"/>
<text x="35" y="692" fill="#f59e0b" font-size="13" font-weight="700">4. RECOVERY INVARIANTS: Crash/Ack Boundary Safety &amp; End-to-End Correctness Guarantee</text>

<!-- Left Box: Crash-Before-Ack (Safe) -->
<rect x="35" y="705" width="515" height="125" rx="4" fill="#0f291e" stroke="#22c55e" stroke-width="1.5"/>
<text x="45" y="725" fill="#4ade80" font-size="11" font-weight="700">&#10003; CRASH-BEFORE-ACK: SAFE AT-LEAST-ONCE REPLAY</text>
<text x="45" y="743" fill="#cbd5e1" font-size="9.5">1. Consumer commits business state + <code>processed_events</code> to Cloud SQL.</text>
<text x="45" y="759" fill="#fca5a5" font-size="9.5">2. Worker crashes (OOM / pod preemption) BEFORE sending ACK to Pub/Sub.</text>
<text x="45" y="775" fill="#cbd5e1" font-size="9.5">3. Ack deadline expires &rarr; Pub/Sub broker redelivers message to healthy worker.</text>
<text x="45" y="791" fill="#86efac" font-size="9.5">4. Worker queries <code>processed_events</code> &rarr; finds token &rarr; skips fulfillment logic.</text>
<text x="45" y="807" fill="#4ade80" font-size="9.5" font-weight="700">5. Worker immediately calls <code>message.ack()</code>. Result: ZERO duplicate effects!</text>

<!-- Right Box: Crash-After-Ack (Catastrophic) -->
<rect x="580" y="705" width="500" height="125" rx="4" fill="#2a1215" stroke="#f43f5e" stroke-width="1.5"/>
<text x="590" y="725" fill="#f87171" font-size="11" font-weight="700">&#9888; CRASH-AFTER-ACK: PERMANENT DATA LOSS (FORBIDDEN)</text>
<text x="590" y="743" fill="#cbd5e1" font-size="9.5">1. Worker receives message from Pub/Sub and executes <code>message.ack()</code> FIRST.</text>
<text x="590" y="759" fill="#fca5a5" font-size="9.5">2. Broker deletes message from topic partition, assuming successful processing.</text>
<text x="590" y="775" fill="#fca5a5" font-size="9.5">3. Worker pod crashes (SIGKILL, segfault, node eviction) BEFORE DB commit.</text>
<text x="590" y="791" fill="#f87171" font-size="9.5">4. Cloud SQL transaction is aborted / rolled back by the engine.</text>
<text x="590" y="807" fill="#ef4444" font-size="9.5" font-weight="700">5. Catastrophic state: Order is lost forever. ZERO redelivery possible!</text>

</figure>
