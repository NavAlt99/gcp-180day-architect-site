  <figcaption>
    <strong>Figure 24.3: Incident Flow · Personal Gmail Account Shadow Access vs. Federated Cloud Identity Governance.</strong>
    Contrasts the unmanaged shadow access resulting from binding a contractor's personal Gmail account directly to project IAM against the enterprise architecture enforcing Domain Restricted Sharing and centralized Cloud Identity lifecycle revocation.
    <br><strong>Supplied facts:</strong> A terminated contractor retained active Google Cloud console access because permissions were bound to an unmanaged personal <code>@gmail.com</code> account.
    <br><strong>Architectural inference:</strong> Corporate IT cannot revoke or audit consumer accounts; enterprise IAM policies must restrict members strictly to managed corporate domains.
    <br><strong>Expected post-fix behavior:</strong> Enforcing <code>constraints/iam.allowedPolicyMemberDomains</code> blocks consumer accounts, and centralized directory de-provisioning terminates sessions instantly while preserving &le; 1 physical fulfillment per unique order ID.
  </figcaption>
