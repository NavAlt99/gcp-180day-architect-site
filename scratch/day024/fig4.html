  <figcaption>
    <strong>Figure 24.4: Incident Flow · allAuthenticatedUsers Misconfiguration vs. Domain-Restricted Group Authorization.</strong>
    Contrasts the critical security leak caused by binding <code>allAuthenticatedUsers</code> on an order archive bucket against the enterprise architecture enforcing specific corporate Google Groups and Public Access Prevention.
    <br><strong>Supplied facts:</strong> An engineer bound <code>allAuthenticatedUsers</code> to a storage bucket, allowing an external user with a consumer Gmail account to download order archives.
    <br><strong>Architectural inference:</strong> <code>allAuthenticatedUsers</code> includes any valid Google account globally; internal resources must be restricted to explicit corporate groups.
    <br><strong>Expected post-fix behavior:</strong> Public Access Prevention blocks global principals, access is granted strictly to <code>group:store-managers@brightloaf.com</code>, and transaction idempotency guarantees &le; 1 physical fulfillment per unique order ID.
  </figcaption>
