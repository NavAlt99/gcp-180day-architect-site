<figure class="diagram-figure" id="fig-24-2">
  <div class="diagram-scroll">
    <svg role="img" aria-labelledby="fig24-2-title fig24-2-desc" viewBox="0 0 960 520" width="960" height="520" xmlns="http://www.w3.org/2000/svg">
      <title id="fig24-2-title">Direct Individual User Binding Anti-Pattern vs. Group-Based Authorization Architecture</title>
      <desc id="fig24-2-desc">Architectural comparison contrasting the fragile direct individual user role binding anti-pattern that bloats IAM policies and creates orphaned permissions with the scalable group-based indirect authorization model.</desc>
      <defs>
        <linearGradient id="p24-f2-bg" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#0c101d"/>
          <stop offset="100%" stop-color="#121526"/>
        </linearGradient>
        <linearGradient id="p24-f2-bad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#2d1219"/>
          <stop offset="100%" stop-color="#180b18"/>
        </linearGradient>
        <linearGradient id="p24-f2-good" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#062e1c"/>
          <stop offset="100%" stop-color="#021f14"/>
        </linearGradient>
        <marker id="p24-f2-arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e"/>
        </marker>
        <marker id="p24-f2-arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 9 5 L 0 9 z" fill="#22c55e"/>
        </marker>
      </defs>

      <!-- Canvas Background -->
      <rect width="960" height="520" rx="12" fill="url(#p24-f2-bg)" stroke="#1e293b" stroke-width="1.5"/>

      <!-- Header Label -->
      <text x="32" y="34" fill="#f8fafc" font-size="16" font-weight="700" font-family="system-ui, -apple-system, sans-serif">ENTERPRISE ACCESS ARCHITECTURE: DIRECT USER BINDINGS VS. GOOGLE GROUPS</text>
      <text x="32" y="54" fill="#94a3b8" font-size="12" font-family="system-ui, -apple-system, sans-serif">Direct individual bindings cause policy size overflow and privilege creep; group-based binding decouples identity lifecycle.</text>

      <!-- LEFT: ANTI-PATTERN (Direct User Bindings) -->
      <g transform="translate(36, 85)">
        <rect width="425" height="320" rx="8" fill="url(#p24-f2-bad)" stroke="#f43f5e" stroke-width="1.5"/>
        <rect x="0" y="0" width="425" height="36" rx="8" fill="#881337"/>
        <text x="16" y="24" fill="#ffffff" font-size="12" font-weight="700" font-family="system-ui, -apple-system, sans-serif">ANTI-PATTERN: DIRECT INDIVIDUAL ROLE BINDINGS</text>

        <!-- Diagram elements for direct binding -->
        <g transform="translate(14, 48)">
          <!-- Users Box -->
          <rect width="160" height="130" rx="6" fill="#1f1118" stroke="#f43f5e" stroke-width="1"/>
          <text x="10" y="20" fill="#fca5a5" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif">INDIVIDUAL IDENTITIES</text>
          <text x="10" y="42" fill="#cbd5e1" font-size="9" font-family="ui-monospace, monospace">user:alice@company.com</text>
          <text x="10" y="62" fill="#cbd5e1" font-size="9" font-family="ui-monospace, monospace">user:bob@company.com</text>
          <text x="10" y="82" fill="#cbd5e1" font-size="9" font-family="ui-monospace, monospace">user:charlie@company.com</text>
          <text x="10" y="102" fill="#94a3b8" font-size="9" font-family="ui-monospace, monospace">... (100+ engineers)</text>

          <!-- Many Arrows crossing -->
          <line x1="160" y1="42" x2="230" y2="42" stroke="#f43f5e" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#p24-f2-arrow-bad)"/>
          <line x1="160" y1="62" x2="230" y2="70" stroke="#f43f5e" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#p24-f2-arrow-bad)"/>
          <line x1="160" y1="82" x2="230" y2="98" stroke="#f43f5e" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#p24-f2-arrow-bad)"/>

          <!-- Projects Box -->
          <g transform="translate(235, 0)">
            <rect width="160" height="130" rx="6" fill="#1f1118" stroke="#f43f5e" stroke-width="1"/>
            <text x="10" y="20" fill="#fca5a5" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif">PROJECT IAM POLICIES</text>
            <text x="10" y="42" fill="#e2e8f0" font-size="9" font-family="system-ui, -apple-system, sans-serif">Project bl-order-prod</text>
            <text x="10" y="62" fill="#e2e8f0" font-size="9" font-family="system-ui, -apple-system, sans-serif">Project bl-pos-prod</text>
            <text x="10" y="82" fill="#e2e8f0" font-size="9" font-family="system-ui, -apple-system, sans-serif">Project bl-analytics-prod</text>
            <text x="10" y="102" fill="#fca5a5" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif">Over 2,000 bindings!</text>
          </g>

          <!-- Consequences Box -->
          <g transform="translate(0, 142)">
            <rect width="395" height="115" rx="6" fill="#450a0a" stroke="#f43f5e" stroke-width="1.2"/>
            <text x="12" y="20" fill="#ffffff" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif">CRITICAL FLAWS OF DIRECT USER BINDINGS:</text>
            <text x="12" y="38" fill="#fca5a5" font-size="9" font-family="system-ui, -apple-system, sans-serif">&bull; Breaches 250 KB / 1,500 member policy limit; updates fail</text>
            <text x="12" y="54" fill="#fca5a5" font-size="9" font-family="system-ui, -apple-system, sans-serif">&bull; Severe privilege creep; permissions never removed when roles change</text>
            <text x="12" y="70" fill="#fca5a5" font-size="9" font-family="system-ui, -apple-system, sans-serif">&bull; Offboarding requires scanning &amp; editing hundreds of GCP projects</text>
            <text x="12" y="86" fill="#fca5a5" font-size="9" font-family="system-ui, -apple-system, sans-serif">&bull; Infrastructure CI/CD pipelines constantly redeploying IAM state</text>
          </g>
        </g>
      </g>

      <!-- RIGHT: RECOMMENDED (Group-Based Indirect Authorization) -->
      <g transform="translate(500, 85)">
        <rect width="425" height="320" rx="8" fill="url(#p24-f2-good)" stroke="#22c55e" stroke-width="1.5"/>
        <rect x="0" y="0" width="425" height="36" rx="8" fill="#14532d"/>
        <text x="16" y="24" fill="#ffffff" font-size="12" font-weight="700" font-family="system-ui, -apple-system, sans-serif">RECOMMENDED: GROUP-BASED INDIRECT BINDING</text>

        <!-- Diagram elements for group binding -->
        <g transform="translate(14, 48)">
          <!-- Cloud Identity Groups Box -->
          <rect width="175" height="130" rx="6" fill="#061c12" stroke="#22c55e" stroke-width="1"/>
          <text x="10" y="20" fill="#86efac" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif">CLOUD IDENTITY GROUPS</text>
          <text x="10" y="42" fill="#cbd5e1" font-size="9" font-family="ui-monospace, monospace">group:order-devs@...</text>
          <text x="10" y="62" fill="#cbd5e1" font-size="9" font-family="ui-monospace, monospace">group:pos-sre@...</text>
          <text x="10" y="82" fill="#cbd5e1" font-size="9" font-family="ui-monospace, monospace">group:sec-auditors@...</text>
          <text x="10" y="104" fill="#86efac" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif">Synced via SCIM / HRIS</text>

          <!-- Single Clean Arrow -->
          <line x1="175" y1="62" x2="225" y2="62" stroke="#22c55e" stroke-width="2" marker-end="url(#p24-f2-arrow-good)"/>
          <text x="180" y="55" fill="#86efac" font-size="8" font-family="system-ui, -apple-system, sans-serif">1 Binding</text>

          <!-- Projects Box -->
          <g transform="translate(230, 0)">
            <rect width="165" height="130" rx="6" fill="#061c12" stroke="#22c55e" stroke-width="1"/>
            <text x="10" y="20" fill="#86efac" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif">PROJECT IAM POLICIES</text>
            <text x="10" y="42" fill="#e2e8f0" font-size="9" font-family="system-ui, -apple-system, sans-serif">Role: spannerViewer</text>
            <text x="10" y="62" fill="#e2e8f0" font-size="9" font-family="system-ui, -apple-system, sans-serif">Role: computeViewer</text>
            <text x="10" y="82" fill="#e2e8f0" font-size="9" font-family="system-ui, -apple-system, sans-serif">Role: loggingViewer</text>
            <text x="10" y="104" fill="#22c55e" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif">Total size &lt; 5 KB!</text>
          </g>

          <!-- Benefits Box -->
          <g transform="translate(0, 142)">
            <rect width="395" height="115" rx="6" fill="#052e16" stroke="#22c55e" stroke-width="1.2"/>
            <text x="12" y="20" fill="#ffffff" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif">ENTERPRISE ADVANTAGES OF GOOGLE GROUPS:</text>
            <text x="12" y="38" fill="#bbf7d0" font-size="9" font-family="system-ui, -apple-system, sans-serif">&check; Compact IAM policies; zero risk of hitting 250 KB limit</text>
            <text x="12" y="54" fill="#bbf7d0" font-size="9" font-family="system-ui, -apple-system, sans-serif">&check; Onboarding &amp; offboarding executed in HRIS/IdP (Okta/Entra)</text>
            <text x="12" y="70" fill="#bbf7d0" font-size="9" font-family="system-ui, -apple-system, sans-serif">&check; Instantaneous revocation across all projects when staff depart</text>
            <text x="12" y="86" fill="#bbf7d0" font-size="9" font-family="system-ui, -apple-system, sans-serif">&check; Infrastructure code remains static; zero IAM drift</text>
          </g>
        </g>
      </g>

      <!-- Bottom Guidance Banner -->
      <g transform="translate(36, 420)">
        <rect width="888" height="75" rx="8" fill="#111827" stroke="#334155" stroke-width="1.2"/>
        <text x="18" y="22" fill="#38bdf8" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif">ENTERPRISE WORKFORCE IAM ARCHITECTURAL RULE:</text>
        <text x="18" y="42" fill="#cbd5e1" font-size="10" font-family="system-ui, -apple-system, sans-serif">&bull; <strong>Human Identities:</strong> Always bind roles to <code>group:job-function@company.com</code>. Never assign roles directly to individual users.</text>
        <text x="18" y="58" fill="#cbd5e1" font-size="10" font-family="system-ui, -apple-system, sans-serif">&bull; <strong>Workload Identities:</strong> Bind roles to dedicated <code>serviceAccount:workload-id@project.iam.gserviceaccount.com</code>.</text>
        <text x="18" y="72" fill="#22c55e" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif">&check; Decoupling identity management from infrastructure code guarantees auditability and prevents platform limit failures.</text>
      </g>
    </svg>
  </div>
  <figcaption>
    <strong>Figure 24.2: Direct Individual User Binding Anti-Pattern vs. Group-Based Authorization Architecture.</strong>
    Contrasts the fragile anti-pattern of binding individual developer email addresses directly to IAM policies across multiple projects against the scalable enterprise pattern of binding roles to Google Groups. Group-based access control prevents policy size overflow (250 KB limit), eliminates privilege accumulation, and enables instantaneous employee de-provisioning from centralized corporate HRIS systems.
  </figcaption>
</figure>
