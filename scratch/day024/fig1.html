<figure class="diagram-figure" id="fig-24-1">
  <div class="diagram-scroll">
    <svg role="img" aria-labelledby="fig24-1-title fig24-1-desc" viewBox="0 0 960 520" width="960" height="520" xmlns="http://www.w3.org/2000/svg">
      <title id="fig24-1-title">Google Cloud Workforce Identity Providers and Principal Taxonomy</title>
      <desc id="fig24-1-desc">Architectural taxonomy contrasting unmanaged consumer Google accounts with managed Cloud Identity directories, and categorizing the six Google Cloud IAM principal types with security risk boundaries.</desc>
      <defs>
        <linearGradient id="p24-f1-bg" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#0c101d"/>
          <stop offset="100%" stop-color="#121526"/>
        </linearGradient>
        <linearGradient id="p24-f1-managed" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#064e3b"/>
          <stop offset="100%" stop-color="#022c22"/>
        </linearGradient>
        <linearGradient id="p24-f1-unmanaged" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#3b111e"/>
          <stop offset="100%" stop-color="#180b18"/>
        </linearGradient>
        <marker id="p24-f1-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
        </marker>
      </defs>

      <!-- Background Canvas -->
      <rect width="960" height="520" rx="12" fill="url(#p24-f1-bg)" stroke="#1e293b" stroke-width="1.5"/>

      <!-- Header Label -->
      <text x="32" y="34" fill="#f8fafc" font-size="16" font-weight="700" font-family="system-ui, -apple-system, sans-serif">WORKFORCE IDENTITY TAXONOMY &amp; PRINCIPAL SECURITY BOUNDARIES</text>
      <text x="32" y="54" fill="#94a3b8" font-size="12" font-family="system-ui, -apple-system, sans-serif">Contrasting identity providers and establishing the 6 IAM principal types with associated security postures.</text>

      <!-- LEFT: Identity Repositories -->
      <g transform="translate(36, 85)">
        <rect width="380" height="315" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
        <rect x="0" y="0" width="380" height="36" rx="8" fill="#334155"/>
        <text x="16" y="24" fill="#ffffff" font-size="12" font-weight="700" font-family="system-ui, -apple-system, sans-serif">IDENTITY SOURCES OF TRUTH</text>

        <!-- Managed: Cloud Identity / Workspace -->
        <g transform="translate(14, 48)">
          <rect width="352" height="120" rx="6" fill="url(#p24-f1-managed)" stroke="#22c55e" stroke-width="1.2"/>
          <text x="12" y="20" fill="#86efac" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif">&check; MANAGED: CLOUD IDENTITY / WORKSPACE</text>
          <text x="12" y="38" fill="#cbd5e1" font-size="10" font-family="system-ui, -apple-system, sans-serif">Domain: <tspan fill="#ffffff" font-family="ui-monospace, monospace">@brightloaf.com</tspan> (Verified DNS)</text>
          <text x="12" y="56" fill="#cbd5e1" font-size="10" font-family="system-ui, -apple-system, sans-serif">&bull; Automated HRIS/SCIM user provisioning &amp; suspension</text>
          <text x="12" y="72" fill="#cbd5e1" font-size="10" font-family="system-ui, -apple-system, sans-serif">&bull; Enforces corporate SAML 2.0 / OIDC SSO (Okta/Entra)</text>
          <text x="12" y="88" fill="#cbd5e1" font-size="10" font-family="system-ui, -apple-system, sans-serif">&bull; Mandatory hardware security key 2-Step Verification</text>
          <text x="12" y="104" fill="#86efac" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif">Status: Required for all corporate workforce access</text>
        </g>

        <!-- Unmanaged: Consumer Accounts -->
        <g transform="translate(14, 180)">
          <rect width="352" height="110" rx="6" fill="url(#p24-f1-unmanaged)" stroke="#f43f5e" stroke-width="1.2"/>
          <text x="12" y="20" fill="#fca5a5" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif">&cross; UNMANAGED: CONSUMER GOOGLE ACCOUNTS</text>
          <text x="12" y="38" fill="#cbd5e1" font-size="10" font-family="system-ui, -apple-system, sans-serif">Domain: <tspan fill="#fca5a5" font-family="ui-monospace, monospace">@gmail.com</tspan> or personal external email</text>
          <text x="12" y="56" fill="#cbd5e1" font-size="10" font-family="system-ui, -apple-system, sans-serif">&bull; Zero corporate password policies or MFA enforcement</text>
          <text x="12" y="72" fill="#cbd5e1" font-size="10" font-family="system-ui, -apple-system, sans-serif">&bull; Cannot be revoked when employee or contractor departs</text>
          <text x="12" y="88" fill="#cbd5e1" font-size="10" font-family="system-ui, -apple-system, sans-serif">&bull; Creates severe shadow IT and compliance audit failures</text>
          <text x="12" y="104" fill="#f43f5e" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif">Status: Blocked via constraints/iam.allowedPolicyMemberDomains</text>
        </g>
      </g>

      <!-- Connection Arrow: Identity to Principal Evaluation -->
      <line x1="416" y1="240" x2="456" y2="240" stroke="#38bdf8" stroke-width="2" marker-end="url(#p24-f1-arrow)"/>

      <!-- RIGHT: The 6 Principal Types -->
      <g transform="translate(460, 85)">
        <rect width="464" height="315" rx="8" fill="#111827" stroke="#334155" stroke-width="1.5"/>
        <rect x="0" y="0" width="464" height="36" rx="8" fill="#1e293b"/>
        <text x="16" y="24" fill="#ffffff" font-size="12" font-weight="700" font-family="system-ui, -apple-system, sans-serif">THE 6 GOOGLE CLOUD IAM PRINCIPAL TYPES</text>

        <!-- Types List -->
        <g transform="translate(12, 46)">
          <!-- 1. Group -->
          <rect width="440" height="38" rx="5" fill="#062e1c" stroke="#22c55e" stroke-width="1"/>
          <text x="10" y="22" fill="#86efac" font-size="10" font-weight="700" font-family="ui-monospace, monospace">group:pos-devs@brightloaf.com</text>
          <text x="240" y="22" fill="#22c55e" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif">&check; RECOMMENDED BEST PRACTICE</text>

          <!-- 2. Service Account -->
          <rect y="44" width="440" height="38" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
          <text x="10" y="66" fill="#38bdf8" font-size="10" font-weight="700" font-family="ui-monospace, monospace">serviceAccount:order-api@bl-prod.iam...</text>
          <text x="270" y="66" fill="#7dd3fc" font-size="9" font-family="system-ui, -apple-system, sans-serif">Workload Identity / Non-human</text>

          <!-- 3. User -->
          <rect y="88" width="440" height="38" rx="5" fill="#2d1d03" stroke="#f59e0b" stroke-width="1"/>
          <text x="10" y="110" fill="#fde68a" font-size="10" font-weight="700" font-family="ui-monospace, monospace">user:alice@brightloaf.com</text>
          <text x="240" y="110" fill="#f59e0b" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif">Anti-Pattern (Direct User Binding)</text>

          <!-- 4. Domain -->
          <rect y="132" width="440" height="38" rx="5" fill="#1e1b4b" stroke="#818cf8" stroke-width="1"/>
          <text x="10" y="154" fill="#c7d2fe" font-size="10" font-weight="700" font-family="ui-monospace, monospace">domain:brightloaf.com</text>
          <text x="220" y="154" fill="#a5b4fc" font-size="9" font-family="system-ui, -apple-system, sans-serif">All accounts in corporate directory</text>

          <!-- 5. allAuthenticatedUsers -->
          <rect y="176" width="440" height="38" rx="5" fill="#450a0a" stroke="#f43f5e" stroke-width="1.2"/>
          <text x="10" y="198" fill="#fca5a5" font-size="10" font-weight="700" font-family="ui-monospace, monospace">allAuthenticatedUsers</text>
          <text x="175" y="198" fill="#f43f5e" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif">&cross; ANY Google account globally (High Risk!)</text>

          <!-- 6. allUsers -->
          <rect y="220" width="440" height="38" rx="5" fill="#4c0519" stroke="#e11d48" stroke-width="1.2"/>
          <text x="10" y="242" fill="#fda4af" font-size="10" font-weight="700" font-family="ui-monospace, monospace">allUsers</text>
          <text x="160" y="242" fill="#f43f5e" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif">&cross; Public unauthenticated internet (Public Exposure!)</text>
        </g>
      </g>

      <!-- Bottom Alert Callout -->
      <g transform="translate(36, 420)">
        <rect width="888" height="75" rx="8" fill="#450a0a" stroke="#f43f5e" stroke-width="1.2"/>
        <text x="18" y="22" fill="#fca5a5" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif">ARCHITECTURAL PITFALL WARNING: allAuthenticatedUsers IS NOT DOMAIN-RESTRICTED</text>
        <text x="18" y="42" fill="#fecaca" font-size="10" font-family="system-ui, -apple-system, sans-serif"><code>allAuthenticatedUsers</code> does NOT mean \"all employees authenticated into my company.\" It matches <strong>any human on Earth</strong> logged into any consumer Gmail account or external Google Cloud identity. Never use it for internal resources!</text>
        <text x="18" y="58" fill="#cbd5e1" font-size="9" font-family="system-ui, -apple-system, sans-serif">Enforce <code>constraints/iam.allowedPolicyMemberDomains</code> to block both consumer accounts and unauthorized external domains.</text>
      </g>
    </svg>
  </div>
  <figcaption>
    <strong>Figure 24.1: Google Cloud Workforce Identity Providers and Principal Taxonomy.</strong>
    Contrasts managed enterprise identity directories (Cloud Identity and Google Workspace) against unmanaged consumer accounts. Maps the six IAM principal types and highlights the extreme security exposure of <code>allAuthenticatedUsers</code>, which grants access to any authenticated identity globally rather than internal corporate employees.
  </figcaption>
</figure>
