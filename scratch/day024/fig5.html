  <figcaption>
    <strong>Figure 24.5: Incident Flow · IAM Policy Size Overflow vs. Consolidated Group Role Bindings.</strong>
    Contrasts the deployment paralysis caused by bloating an IAM policy with hundreds of direct user bindings beyond the 250 KB platform limit against the corrected architecture consolidating roles into Google Groups.
    <br><strong>Supplied facts:</strong> Direct user bindings expanded a project IAM policy to 251,480 bytes, causing the Resource Manager API to reject emergency hotfix updates.
    <br><strong>Architectural inference:</strong> Direct user bindings violate Google Cloud's 250 KB / 1,500 member limit; production policies must bind roles exclusively to Google Groups.
    <br><strong>Expected post-fix behavior:</strong> Group consolidation shrinks policy size to 4.2 KB, enabling rapid deployment of emergency POS hotfixes while maintaining &le; 1 physical fulfillment per unique order ID.
  </figcaption>
