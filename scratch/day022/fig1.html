<figure class="diagram-figure" id="fig-22-1">
  <div class="diagram-scroll">
    <svg role="img" aria-labelledby="fig22-1-title fig22-1-desc" viewBox="0 0 960 520" width="960" height="520" xmlns="http://www.w3.org/2000/svg">
      <title id="fig22-1-title">Google Cloud Hierarchical IAM Policy Inheritance and Additive Union Flow</title>
      <desc id="fig22-1-desc">Architectural diagram illustrating how IAM allow policies flow downward through the Google Cloud resource hierarchy and form a mathematical union at the leaf resource, demonstrating that project-level bindings cannot subtract folder-level permissions.</desc>
      <defs>
        <linearGradient id="p22-f1-bg" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#0c101d"/>
          <stop offset="100%" stop-color="#121526"/>
        </linearGradient>
        <linearGradient id="p22-f1-node-org" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#1e293b"/>
          <stop offset="100%" stop-color="#0f172a"/>
        </linearGradient>
        <linearGradient id="p22-f1-node-folder" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#1e293b"/>
          <stop offset="100%" stop-color="#1e1b4b"/>
        </linearGradient>
        <linearGradient id="p22-f1-node-proj" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#1e293b"/>
          <stop offset="100%" stop-color="#172554"/>
        </linearGradient>
        <linearGradient id="p22-f1-union" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#1c1917"/>
          <stop offset="100%" stop-color="#292524"/>
        </linearGradient>
        <marker id="p22-f1-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
        </marker>
        <marker id="p22-f1-arrow-warn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e"/>
        </marker>
      </defs>

      <!-- Background Canvas -->
      <rect width="960" height="520" rx="12" fill="url(#p22-f1-bg)" stroke="#1e293b" stroke-width="1.5"/>

      <!-- Header Label -->
      <text x="32" y="36" fill="#f8fafc" font-size="16" font-weight="700" font-family="system-ui, -apple-system, sans-serif">HIERARCHICAL IAM EVALUATION ENGINE: ADDITIVE POLICY UNION</text>
      <text x="32" y="56" fill="#94a3b8" font-size="12" font-family="system-ui, -apple-system, sans-serif">Policies flow downward; effective permissions equal the mathematical union of all ancestor allow bindings.</text>

      <!-- Top Container: Organization Node -->
      <g transform="translate(40, 80)">
        <rect width="400" height="85" rx="8" fill="url(#p22-f1-node-org)" stroke="#38bdf8" stroke-width="1.5"/>
        <rect x="0" y="0" width="8" height="85" rx="4" fill="#38bdf8"/>
        <text x="24" y="24" fill="#f8fafc" font-size="13" font-weight="700" font-family="system-ui, -apple-system, sans-serif">ORGANIZATION APEX: organizations/714029482103</text>
        <text x="24" y="42" fill="#38bdf8" font-size="11" font-weight="600" font-family="system-ui, -apple-system, sans-serif">Domain: brightloaf.com</text>
        <text x="24" y="60" fill="#cbd5e1" font-size="11" font-family="ui-monospace, monospace">Principal: sec-team@brightloaf.com &rarr; roles/securityReviewer</text>
        <text x="24" y="74" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif">Permissions: {resourcemanager.organizations.get, iam.roles.list}</text>
      </g>

      <!-- Hierarchy Arrow Org -> Folder -->
      <line x1="240" y1="165" x2="240" y2="195" stroke="#38bdf8" stroke-width="2" marker-end="url(#p22-f1-arrow)"/>
      <text x="250" y="185" fill="#38bdf8" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif">Inherits Downward</text>

      <!-- Middle Container: Folder Tier -->
      <g transform="translate(40, 200)">
        <rect width="400" height="95" rx="8" fill="url(#p22-f1-node-folder)" stroke="#f43f5e" stroke-width="1.5"/>
        <rect x="0" y="0" width="8" height="95" rx="4" fill="#f43f5e"/>
        <text x="24" y="24" fill="#f8fafc" font-size="13" font-weight="700" font-family="system-ui, -apple-system, sans-serif">INTERMEDIATE FOLDER: folders/839102482019</text>
        <text x="24" y="42" fill="#f43f5e" font-size="11" font-weight="600" font-family="system-ui, -apple-system, sans-serif">Display Name: Production-Fulfillment</text>
        <text x="24" y="60" fill="#fca5a5" font-size="11" font-weight="600" font-family="ui-monospace, monospace">CRITICAL: contractor-group@ &rarr; roles/editor</text>
        <text x="24" y="74" fill="#cbd5e1" font-size="10" font-family="system-ui, -apple-system, sans-serif">Injected: {spanner.databases.drop, compute.instances.create, ...}</text>
        <text x="24" y="88" fill="#f43f5e" font-size="9" font-style="italic" font-family="system-ui, -apple-system, sans-serif">Cannot be attenuated by lower nodes</text>
      </g>

      <!-- Hierarchy Arrow Folder -> Project -->
      <line x1="240" y1="295" x2="240" y2="325" stroke="#38bdf8" stroke-width="2" marker-end="url(#p22-f1-arrow)"/>
      <text x="250" y="315" fill="#38bdf8" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif">Inherits Downward</text>

      <!-- Bottom Container: Project Tier -->
      <g transform="translate(40, 330)">
        <rect width="400" height="90" rx="8" fill="url(#p22-f1-node-proj)" stroke="#f59e0b" stroke-width="1.5"/>
        <rect x="0" y="0" width="8" height="90" rx="4" fill="#f59e0b"/>
        <text x="24" y="24" fill="#f8fafc" font-size="13" font-weight="700" font-family="system-ui, -apple-system, sans-serif">PROJECT LEAF: bl-order-fulfill-prod</text>
        <text x="24" y="42" fill="#f59e0b" font-size="11" font-weight="600" font-family="system-ui, -apple-system, sans-serif">Project Number: 109283746152</text>
        <text x="24" y="60" fill="#fde68a" font-size="11" font-family="ui-monospace, monospace">Local Binding Attempt: contractor-group@ &rarr; roles/viewer</text>
        <text x="24" y="76" fill="#fca5a5" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif">FALLACY: Binding "viewer" does NOT revoke parent "editor"!</text>
      </g>

      <!-- Hierarchy Arrow Project -> Leaf Resource -->
      <line x1="240" y1="420" x2="240" y2="445" stroke="#38bdf8" stroke-width="2" marker-end="url(#p22-f1-arrow)"/>

      <!-- Leaf Target Resource -->
      <g transform="translate(40, 448)">
        <rect width="400" height="52" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
        <text x="24" y="22" fill="#38bdf8" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif">TARGET RESOURCE: Cloud Spanner Database</text>
        <text x="24" y="38" fill="#94a3b8" font-size="10" font-family="ui-monospace, monospace">projects/bl-order-fulfill-prod/instances/bl-spanner/databases/orders-db</text>
      </g>

      <!-- Right Panel: Mathematical Union Engine -->
      <g transform="translate(480, 80)">
        <rect width="440" height="420" rx="10" fill="url(#p22-f1-union)" stroke="#334155" stroke-width="1.5"/>
        <rect x="0" y="0" width="440" height="38" rx="10" fill="#1e293b"/>
        <text x="20" y="24" fill="#38bdf8" font-size="13" font-weight="700" font-family="system-ui, -apple-system, sans-serif">EVALUATION LOGIC: MATHEMATICAL SET UNION</text>

        <!-- Formula Box -->
        <g transform="translate(20, 52)">
          <rect width="400" height="56" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
          <text x="14" y="22" fill="#e2e8f0" font-size="11" font-family="ui-monospace, monospace">P_effective(R) = P(Org) &cup; P(Folder) &cup; P(Project) &cup; P(Resource)</text>
          <text x="14" y="42" fill="#22c55e" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif">&check; Principle: Permissions are purely additive across all ancestors.</text>
        </g>

        <!-- Evaluation Walkthrough -->
        <text x="20" y="132" fill="#f8fafc" font-size="12" font-weight="700" font-family="system-ui, -apple-system, sans-serif">Evaluation for contractor-group@brightloaf.com:</text>

        <rect x="20" y="142" width="400" height="60" rx="6" fill="#111827" stroke="#1e293b" stroke-width="1"/>
        <text x="30" y="162" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif">1. Query Org Policy:</text>
        <text x="170" y="162" fill="#cbd5e1" font-size="10" font-family="ui-monospace, monospace">No direct grant &rarr; &empty;</text>
        <text x="30" y="180" fill="#f43f5e" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif">2. Query Folder Policy:</text>
        <text x="170" y="180" fill="#fca5a5" font-size="10" font-family="ui-monospace, monospace">roles/editor &rarr; {spanner.databases.drop, ...}</text>
        <text x="30" y="196" fill="#f59e0b" font-size="10" font-family="system-ui, -apple-system, sans-serif">3. Query Project Policy:</text>
        <text x="170" y="196" fill="#cbd5e1" font-size="10" font-family="ui-monospace, monospace">roles/viewer &rarr; {spanner.databases.get, ...}</text>

        <!-- Calculation Result -->
        <g transform="translate(20, 215)">
          <rect width="400" height="90" rx="6" fill="#3f1219" stroke="#f43f5e" stroke-width="1.5"/>
          <text x="14" y="24" fill="#fca5a5" font-size="12" font-weight="700" font-family="system-ui, -apple-system, sans-serif">RESULT: PRIVILEGE ESCALATION VIA INHERITANCE</text>
          <text x="14" y="44" fill="#fecaca" font-size="11" font-family="system-ui, -apple-system, sans-serif">Action attempted: spanner.databases.drop</text>
          <text x="14" y="62" fill="#fecaca" font-size="10" font-family="system-ui, -apple-system, sans-serif">Check: spanner.databases.drop &isin; ({editor} &cup; {viewer}) = TRUE</text>
          <text x="14" y="80" fill="#ffffff" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif">DECISION: ALLOWED &rarr; Table dropped unintentionally!</text>
        </g>

        <!-- Correct Architectural Remedy -->
        <g transform="translate(20, 318)">
          <rect width="400" height="86" rx="6" fill="#052e16" stroke="#22c55e" stroke-width="1.2"/>
          <text x="14" y="22" fill="#86efac" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif">ARCHITECTURAL REMEDIES:</text>
          <text x="14" y="40" fill="#bbf7d0" font-size="10" font-family="system-ui, -apple-system, sans-serif">1. Restrict broad roles to leaf non-production projects only.</text>
          <text x="14" y="56" fill="#bbf7d0" font-size="10" font-family="system-ui, -apple-system, sans-serif">2. Use environment-first folder separation (/Prod vs /NonProd).</text>
          <text x="14" y="72" fill="#bbf7d0" font-size="10" font-family="system-ui, -apple-system, sans-serif">3. Apply IAM Deny policies to block deletion at the project boundary.</text>
        </g>
      </g>
    </svg>
  </div>
  <figcaption>
    <strong>Figure 22.1: Google Cloud Hierarchical IAM Policy Inheritance and Additive Union Flow.</strong>
    Demonstrates the downward propagation of IAM allow bindings across Organization, Folder, and Project tiers. Because IAM permissions are evaluated as the mathematical union of all ancestor policies, granting broad roles at a parent folder exposes leaf project resources to unintended administrative actions that cannot be revoked at the project level.
  </figcaption>
</figure>
