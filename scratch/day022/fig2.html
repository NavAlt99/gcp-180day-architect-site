<figure class="diagram-figure" id="fig-22-2">
  <div class="diagram-scroll">
    <svg role="img" aria-labelledby="fig22-2-title fig22-2-desc" viewBox="0 0 960 540" width="960" height="540" xmlns="http://www.w3.org/2000/svg">
      <title id="fig22-2-title">Three-Plane Architectural Taxonomy: Labels vs. Resource Manager Tags vs. Network Tags</title>
      <desc id="fig22-2-desc">A three-column comparative architectural diagram differentiating Resource Labels for billing, Resource Manager Tags for IAM governance, and Network Tags for VPC firewall packet filtering.</desc>
      <defs>
        <linearGradient id="p22-f2-bg" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#0c101d"/>
          <stop offset="100%" stop-color="#121526"/>
        </linearGradient>
        <linearGradient id="p22-f2-col1" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#0e2a38"/>
          <stop offset="100%" stop-color="#0b1726"/>
        </linearGradient>
        <linearGradient id="p22-f2-col2" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#3b111e"/>
          <stop offset="100%" stop-color="#180b18"/>
        </linearGradient>
        <linearGradient id="p22-f2-col3" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#382609"/>
          <stop offset="100%" stop-color="#1a1205"/>
        </linearGradient>
      </defs>

      <!-- Canvas Background -->
      <rect width="960" height="540" rx="12" fill="url(#p22-f2-bg)" stroke="#1e293b" stroke-width="1.5"/>

      <!-- Header -->
      <text x="32" y="34" fill="#f8fafc" font-size="16" font-weight="700" font-family="system-ui, -apple-system, sans-serif">ARCHITECTURAL TAXONOMY: THREE METADATA &amp; FILTERING PLANES</text>
      <text x="32" y="54" fill="#94a3b8" font-size="12" font-family="system-ui, -apple-system, sans-serif">Comparing Resource Labels, Resource Manager Tags, and Network Tags across purpose, scope, and security boundaries.</text>

      <!-- COLUMN 1: Resource Labels -->
      <g transform="translate(32, 75)">
        <rect width="280" height="380" rx="10" fill="url(#p22-f2-col1)" stroke="#38bdf8" stroke-width="1.5"/>
        <rect x="0" y="0" width="280" height="42" rx="10" fill="#0369a1"/>
        <text x="14" y="26" fill="#ffffff" font-size="13" font-weight="700" font-family="system-ui, -apple-system, sans-serif">1 · RESOURCE LABELS</text>
        <text x="14" y="60" fill="#7dd3fc" font-size="11" font-weight="600" font-family="system-ui, -apple-system, sans-serif">Plane: Operations &amp; Billing</text>

        <!-- Key Specs -->
        <g transform="translate(12, 72)">
          <text x="0" y="16" fill="#94a3b8" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif">TARGET / ATTACHMENT:</text>
          <text x="0" y="32" fill="#e2e8f0" font-size="11" font-family="system-ui, -apple-system, sans-serif">VMs, Buckets, SQL, Disks, Datasets</text>

          <text x="0" y="60" fill="#94a3b8" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif">INHERITANCE:</text>
          <text x="0" y="76" fill="#f43f5e" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif">NONE (Per-resource attribute)</text>

          <text x="0" y="104" fill="#94a3b8" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif">SYNTAX &amp; LIMITS:</text>
          <text x="0" y="120" fill="#cbd5e1" font-size="10" font-family="ui-monospace, monospace">key:value (max 63 chars, regex)</text>
          <text x="0" y="134" fill="#cbd5e1" font-size="10" font-family="system-ui, -apple-system, sans-serif">Max 64 labels per resource</text>

          <text x="0" y="162" fill="#94a3b8" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif">PRIMARY USES:</text>
          <text x="0" y="178" fill="#e2e8f0" font-size="11" font-family="system-ui, -apple-system, sans-serif">&bull; BigQuery Cloud Billing breakdown</text>
          <text x="0" y="194" fill="#e2e8f0" font-size="11" font-family="system-ui, -apple-system, sans-serif">&bull; Cost attribution / chargebacks</text>
          <text x="0" y="210" fill="#e2e8f0" font-size="11" font-family="system-ui, -apple-system, sans-serif">&bull; Inventory filtering via gcloud/API</text>

          <text x="0" y="238" fill="#94a3b8" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif">SECURITY / ACCESS CONTROL:</text>
          <text x="0" y="254" fill="#f87171" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif">&cross; NO IAM condition support</text>
          <text x="0" y="268" fill="#f87171" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif">&cross; ZERO effect on VPC firewalls</text>
          <text x="0" y="284" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif">Mutated via resource update API</text>
        </g>
      </g>

      <!-- COLUMN 2: Resource Manager Tags -->
      <g transform="translate(340, 75)">
        <rect width="280" height="380" rx="10" fill="url(#p22-f2-col2)" stroke="#f43f5e" stroke-width="1.5"/>
        <rect x="0" y="0" width="280" height="42" rx="10" fill="#be123c"/>
        <text x="14" y="26" fill="#ffffff" font-size="13" font-weight="700" font-family="system-ui, -apple-system, sans-serif">2 · RESOURCE MANAGER TAGS</text>
        <text x="14" y="60" fill="#fda4af" font-size="11" font-weight="600" font-family="system-ui, -apple-system, sans-serif">Plane: Central Governance &amp; IAM</text>

        <!-- Key Specs -->
        <g transform="translate(12, 72)">
          <text x="0" y="16" fill="#94a3b8" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif">TARGET / ATTACHMENT:</text>
          <text x="0" y="32" fill="#e2e8f0" font-size="11" font-family="system-ui, -apple-system, sans-serif">Orgs, Folders, Projects, Cloud Res</text>

          <text x="0" y="60" fill="#94a3b8" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif">INHERITANCE:</text>
          <text x="0" y="76" fill="#22c55e" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif">&check; YES (Inherited down tree)</text>

          <text x="0" y="104" fill="#94a3b8" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif">SYNTAX &amp; LIMITS:</text>
          <text x="0" y="120" fill="#cbd5e1" font-size="10" font-family="ui-monospace, monospace">tagKeys/123 &rarr; tagValues/456</text>
          <text x="0" y="134" fill="#cbd5e1" font-size="10" font-family="system-ui, -apple-system, sans-serif">Max 50 tags bound per resource</text>

          <text x="0" y="162" fill="#94a3b8" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif">PRIMARY USES:</text>
          <text x="0" y="178" fill="#e2e8f0" font-size="11" font-family="system-ui, -apple-system, sans-serif">&bull; Conditional IAM: resource.matchTag()</text>
          <text x="0" y="194" fill="#e2e8f0" font-size="11" font-family="system-ui, -apple-system, sans-serif">&bull; Organization Policy constraints</text>
          <text x="0" y="210" fill="#e2e8f0" font-size="11" font-family="system-ui, -apple-system, sans-serif">&bull; Secure Tags for Next-Gen Firewalls</text>

          <text x="0" y="238" fill="#94a3b8" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif">SECURITY / ACCESS CONTROL:</text>
          <text x="0" y="254" fill="#86efac" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif">&check; Protected by TagAdmin/TagUser</text>
          <text x="0" y="268" fill="#86efac" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif">&check; Tamper-resistant against devs</text>
          <text x="0" y="284" fill="#cbd5e1" font-size="10" font-family="system-ui, -apple-system, sans-serif">First-class Google Cloud resource</text>
        </g>
      </g>

      <!-- COLUMN 3: Network Tags -->
      <g transform="translate(648, 75)">
        <rect width="280" height="380" rx="10" fill="url(#p22-f2-col3)" stroke="#f59e0b" stroke-width="1.5"/>
        <rect x="0" y="0" width="280" height="42" rx="10" fill="#b45309"/>
        <text x="14" y="26" fill="#ffffff" font-size="13" font-weight="700" font-family="system-ui, -apple-system, sans-serif">3 · NETWORK TAGS</text>
        <text x="14" y="60" fill="#fcd34d" font-size="11" font-weight="600" font-family="system-ui, -apple-system, sans-serif">Plane: VPC Virtual Data Plane</text>

        <!-- Key Specs -->
        <g transform="translate(12, 72)">
          <text x="0" y="16" fill="#94a3b8" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif">TARGET / ATTACHMENT:</text>
          <text x="0" y="32" fill="#e2e8f0" font-size="11" font-family="system-ui, -apple-system, sans-serif">Compute Engine VMs &amp; Templates ONLY</text>

          <text x="0" y="60" fill="#94a3b8" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif">INHERITANCE:</text>
          <text x="0" y="76" fill="#f43f5e" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif">NONE (Per-VM instance attribute)</text>

          <text x="0" y="104" fill="#94a3b8" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif">SYNTAX &amp; LIMITS:</text>
          <text x="0" y="120" fill="#cbd5e1" font-size="10" font-family="ui-monospace, monospace">string (lowercase, dashes, max 63)</text>
          <text x="0" y="134" fill="#cbd5e1" font-size="10" font-family="system-ui, -apple-system, sans-serif">Max 64 tags per VM instance</text>

          <text x="0" y="162" fill="#94a3b8" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif">PRIMARY USES:</text>
          <text x="0" y="178" fill="#e2e8f0" font-size="11" font-family="system-ui, -apple-system, sans-serif">&bull; VPC Firewall targetTags / sourceTags</text>
          <text x="0" y="194" fill="#e2e8f0" font-size="11" font-family="system-ui, -apple-system, sans-serif">&bull; VPC Custom Route next-hop targets</text>
          <text x="0" y="210" fill="#e2e8f0" font-size="11" font-family="system-ui, -apple-system, sans-serif">&bull; Virtual distributed packet filtering</text>

          <text x="0" y="238" fill="#94a3b8" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif">SECURITY / ACCESS CONTROL:</text>
          <text x="0" y="254" fill="#fca5a5" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif">&cross; Mutable via compute.instances.setTags</text>
          <text x="0" y="268" fill="#fca5a5" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif">&cross; Any VM editor can bypass firewall</text>
          <text x="0" y="284" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif">Not a hardened security perimeter</text>
        </g>
      </g>

      <!-- Bottom Alert Callout -->
      <g transform="translate(32, 470)">
        <rect width="896" height="52" rx="8" fill="#450a0a" stroke="#f43f5e" stroke-width="1.2"/>
        <text x="18" y="22" fill="#fca5a5" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif">ARCHITECTURAL PITFALL WARNING:</text>
        <text x="18" y="38" fill="#fecaca" font-size="10" font-family="system-ui, -apple-system, sans-serif">Resource Labels have ZERO impact on VPC firewall rules or IAM policies. Applying 'role: order-db' as a label does NOT filter network traffic; firewalls require Network Tags or Secure Tags!</text>
      </g>
    </svg>
  </div>
  <figcaption>
    <strong>Figure 22.2: Three-Plane Architectural Taxonomy: Labels vs. Resource Manager Tags vs. Network Tags.</strong>
    Systematically compares the three metadata mechanisms in Google Cloud across attachment scope, inheritance mechanics, syntax, primary use cases, and security boundaries. Labels manage operational billing; Resource Manager Tags enforce centralized hierarchical governance; Network Tags execute distributed VPC packet filtering.
  </figcaption>
</figure>
