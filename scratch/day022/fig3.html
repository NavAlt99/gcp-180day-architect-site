  <figcaption>
    <strong>Figure 22.3: Incident Flow · Additive IAM Inheritance Escalation vs. Bounded Least-Privilege &amp; Deny Guardrails.</strong>
    Contrasts the failure path where an inherited folder-level <code>roles/editor</code> grant permitted an unauthorized database drop against the corrected architecture enforcing environment folder segregation, leaf custom roles, and IAM Deny policies.
    <br><strong>Supplied facts:</strong> A contractor analytics service account issued a <code>DropDatabase</code> API call that succeeded despite an explicit project-level <code>roles/viewer</code> binding.
    <br><strong>Architectural inference:</strong> IAM allow policies are strictly additive; a project-level viewer binding cannot restrict permissions inherited from an ancestor folder editor binding.
    <br><strong>Expected post-fix behavior:</strong> Broad editor roles are purged from parent folders, IAM Deny policies prevent database deletion, and Spanner PITR restoration combined with idempotent event replays ensures &le; 1 physical fulfillment per unique order ID.
  </figcaption>
