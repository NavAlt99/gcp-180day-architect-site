        <figure class="diagram-container">
          <svg viewBox="0 0 960 500" width="100%" height="auto" role="img" aria-labelledby="fig25-2-title fig25-2-desc" style="background:#121526; border-radius:8px; border:1px solid #1e293b; display:block; margin:0 auto;">
            <title id="fig25-2-title">Figure 25.2: IAM Policy Version 3 Structure and CEL Condition Evaluation Engine</title>
            <desc id="fig25-2-desc">Flow diagram showing how incoming API request context and resource attributes are evaluated against IAM policy version 3 bindings and Common Expression Language (CEL) conditions.</desc>
            <defs>
              <marker id="arrow25-2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
              </marker>
              <marker id="arrow25-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1 L 8 5 L 0 9 z" fill="#22c55e"/>
              </marker>
              <marker id="arrow25-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1 L 8 5 L 0 9 z" fill="#f43f5e"/>
              </marker>
            </defs>

            <!-- Header -->
            <text x="480" y="32" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Figure 25.2: IAM Policy v3 Schema &amp; CEL Condition Runtime</text>
            <text x="480" y="52" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">How request attributes and resource metadata are dynamically resolved during authorization</text>

            <!-- Left Box: Policy Document Schema (v3) -->
            <g transform="translate(30, 75)">
              <rect width="320" height="390" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#38bdf8" stroke-width="1.5"/>
              <rect x="0" y="0" width="320" height="36" rx="8" fill="#38bdf8" fill-opacity="0.2"/>
              <text x="160" y="24" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">Policy Document (version: 3)</text>

              <g transform="translate(15, 50)" font-family="monospace" font-size="11">
                <text x="0" y="0" fill="#94a3b8">{</text>
                <text x="15" y="18" fill="#38bdf8">"version": <tspan fill="#f59e0b">3</tspan>,</text>
                <text x="15" y="36" fill="#94a3b8">"etag": "BwW12345678=",</text>
                <text x="15" y="54" fill="#38bdf8">"bindings": [</text>
                <text x="30" y="72" fill="#94a3b8">{</text>
                <text x="45" y="90" fill="#f8fafc">"role": <tspan fill="#22c55e">"roles/pubsub.publisher"</tspan>,</text>
                <text x="45" y="108" fill="#f8fafc">"members": [</text>
                <text x="60" y="126" fill="#cbd5e1">"serviceAccount:app@proj.iam..."</text>
                <text x="45" y="144" fill="#f8fafc">],</text>
                <text x="45" y="162" fill="#f59e0b">"condition": {</text>
                <text x="60" y="180" fill="#94a3b8">"title": "prod_orders_only",</text>
                <text x="60" y="198" fill="#94a3b8">"description": "Topic name check",</text>
                <text x="60" y="216" fill="#38bdf8">"expression":</text>
                <text x="75" y="234" fill="#e2e8f0">"resource.name.startsWith("</text>
                <text x="75" y="252" fill="#22c55e">"projects/_/topics/prod-")"</text>
                <text x="45" y="270" fill="#f59e0b">}</text>
                <text x="30" y="288" fill="#94a3b8">}</text>
                <text x="15" y="306" fill="#38bdf8">]</text>
                <text x="0" y="324" fill="#94a3b8">}</text>
              </g>
            </g>

            <!-- Center Box: CEL Evaluation Engine -->
            <g transform="translate(390, 75)">
              <rect width="280" height="390" rx="8" fill="#182234" stroke="#94a3b8" stroke-width="1.5"/>
              <rect x="0" y="0" width="280" height="36" rx="8" fill="#334155" fill-opacity="0.5"/>
              <text x="140" y="24" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">CEL Evaluation Engine</text>

              <!-- Step 1: Member Match -->
              <rect x="20" y="55" width="240" height="60" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
              <text x="30" y="78" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">1. Member Identity Check</text>
              <text x="30" y="98" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Match principal in bindings.members</text>

              <!-- Arrow down -->
              <line x1="140" y1="115" x2="140" y2="135" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow25-2)"/>

              <!-- Step 2: Role Capability -->
              <rect x="20" y="140" width="240" height="60" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
              <text x="30" y="163" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">2. Role Permission Check</text>
              <text x="30" y="183" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Does role contain requested API verb?</text>

              <!-- Arrow down -->
              <line x1="140" y1="200" x2="140" y2="220" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow25-2)"/>

              <!-- Step 3: CEL Condition Evaluation -->
              <rect x="20" y="225" width="240" height="95" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
              <text x="30" y="248" fill="#f59e0b" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">3. CEL Condition Runtime</text>
              <text x="30" y="268" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">&bull; Request: <tspan fill="#e2e8f0">request.time, auth.claims</tspan></text>
              <text x="30" y="288" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">&bull; Resource: <tspan fill="#e2e8f0">name, type, tags</tspan></text>
              <text x="30" y="306" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">&bull; Result: <tspan fill="#22c55e">true</tspan> or <tspan fill="#f43f5e">false</tspan></text>

              <!-- Arrow down -->
              <line x1="140" y1="320" x2="140" y2="345" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow25-2)"/>

              <rect x="20" y="348" width="240" height="30" rx="4" fill="#0c4a6e"/>
              <text x="140" y="368" fill="#bae6fd" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Evaluation Decision Node</text>
            </g>

            <!-- Connector from Policy to Engine -->
            <line x1="350" y1="270" x2="385" y2="270" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow25-2)"/>

            <!-- Right Box: Decision Outcomes -->
            <g transform="translate(710, 110)">
              <!-- TRUE branch -->
              <rect width="210" height="130" rx="8" fill="#052e16" stroke="#22c55e" stroke-width="1.5"/>
              <text x="105" y="30" fill="#22c55e" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle">CONDITION = TRUE</text>
              <text x="20" y="60" fill="#bbf7d0" font-family="system-ui, -apple-system, sans-serif" font-size="11">&bull; Binding immediately satisfied</text>
              <text x="20" y="80" fill="#bbf7d0" font-family="system-ui, -apple-system, sans-serif" font-size="11">&bull; Permission granted for call</text>
              <rect x="20" y="95" width="170" height="24" rx="4" fill="#15803d"/>
              <text x="105" y="111" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">ALLOW (200 OK)</text>

              <!-- FALSE branch -->
              <g transform="translate(0, 170)">
                <rect width="210" height="150" rx="8" fill="#450a0a" stroke="#f43f5e" stroke-width="1.5"/>
                <text x="105" y="28" fill="#f43f5e" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle">CONDITION = FALSE</text>
                <text x="20" y="55" fill="#fecdd3" font-family="system-ui, -apple-system, sans-serif" font-size="10">&bull; Binding does not apply</text>
                <text x="20" y="73" fill="#fecdd3" font-family="system-ui, -apple-system, sans-serif" font-size="10">&bull; Continues checking other</text>
                <text x="20" y="89" fill="#fecdd3" font-family="system-ui, -apple-system, sans-serif" font-size="10">  bindings or parent policies</text>
                <rect x="20" y="105" width="170" height="32" rx="4" fill="#991b1b"/>
                <text x="105" y="120" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">DENY (403 PERMISSION_DENIED)</text>
                <text x="105" y="132" fill="#fca5a5" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">(if no other ancestor allows)</text>
              </g>
            </g>

            <!-- Lines from Decision Node to Outcomes -->
            <path d="M 670 355 L 690 355 L 690 180 L 705 180" fill="none" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow25-green)"/>
            <path d="M 670 370 L 690 370 L 690 340 L 705 340" fill="none" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrow25-red)"/>
          </svg>
          <figcaption class="diagram-caption">Figure 25.2: Evaluation flow of an IAM Policy Version 3 payload. A request principal must match the binding members, the role must contain the target API permission, and the Common Expression Language (CEL) condition must evaluate to true against the runtime context before an authorization ALLOW is returned.</figcaption>
        </figure>
