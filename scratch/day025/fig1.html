        <figure class="diagram-container">
          <svg viewBox="0 0 960 480" width="100%" height="auto" role="img" aria-labelledby="fig25-1-title fig25-1-desc" style="background:#121526; border-radius:8px; border:1px solid #1e293b; display:block; margin:0 auto;">
            <title id="fig25-1-title">Figure 25.1: The Three Role Tiers in Google Cloud IAM</title>
            <desc id="fig25-1-desc">Architectural comparison of Basic primitive roles, Predefined managed roles, and Custom roles highlighting permission blast radius and operational maintenance overhead.</desc>
            <defs>
              <linearGradient id="gBasic" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.2"/>
                <stop offset="100%" stop-color="#121526" stop-opacity="0.8"/>
              </linearGradient>
              <linearGradient id="gPredef" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
                <stop offset="100%" stop-color="#121526" stop-opacity="0.8"/>
              </linearGradient>
              <linearGradient id="gCustom" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#22c55e" stop-opacity="0.2"/>
                <stop offset="100%" stop-color="#121526" stop-opacity="0.8"/>
              </linearGradient>
              <marker id="arrow25-1" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8"/>
              </marker>
            </defs>

            <!-- Grid Header -->
            <text x="480" y="34" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Figure 25.1: Google Cloud IAM Role Tiers &amp; Principle of Least Privilege</text>
            <text x="480" y="56" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">Trade-offs between permission blast radius, service coverage, and lifecycle maintenance overhead</text>

            <!-- Column 1: Basic Roles -->
            <g transform="translate(40, 80)">
              <rect width="260" height="340" rx="8" fill="url(#gBasic)" stroke="#f43f5e" stroke-width="1.5"/>
              <rect x="0" y="0" width="260" height="42" rx="8" fill="#f43f5e" fill-opacity="0.25"/>
              <text x="130" y="26" fill="#f43f5e" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle">BASIC (PRIMITIVE) ROLES</text>

              <text x="20" y="65" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="700">roles/viewer</text>
              <text x="20" y="85" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="700">roles/editor</text>
              <text x="20" y="105" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="700">roles/owner</text>

              <line x1="20" y1="120" x2="240" y2="120" stroke="#334155" stroke-width="1"/>

              <text x="20" y="145" fill="#fca5a5" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">&bull; Scope: All GCP APIs &amp; Services</text>
              <text x="20" y="170" fill="#fca5a5" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">&bull; Granularity: Coarse (thousands of perms)</text>
              <text x="20" y="195" fill="#fca5a5" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">&bull; Blast Radius: Catastrophic</text>
              <text x="20" y="220" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">&bull; Maintenance: Zero (fixed definition)</text>
              <text x="20" y="245" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">&bull; Conditions: Unsupported in many bindings</text>

              <rect x="20" y="275" width="220" height="45" rx="6" fill="#450a0a" stroke="#f43f5e" stroke-width="1"/>
              <text x="130" y="295" fill="#fecdd3" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">STRICT PRODUCTION PROHIBITION</text>
              <text x="130" y="310" fill="#fca5a5" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">Violates PCI-DSS, SOC2, and ISO 27001</text>
            </g>

            <!-- Column 2: Predefined Roles -->
            <g transform="translate(350, 80)">
              <rect width="260" height="340" rx="8" fill="url(#gPredef)" stroke="#38bdf8" stroke-width="1.5"/>
              <rect x="0" y="0" width="260" height="42" rx="8" fill="#38bdf8" fill-opacity="0.25"/>
              <text x="130" y="26" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle">PREDEFINED ROLES</text>

              <text x="20" y="65" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="700">roles/pubsub.publisher</text>
              <text x="20" y="85" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="700">roles/storage.objectViewer</text>
              <text x="20" y="105" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="700">roles/spanner.databaseUser</text>

              <line x1="20" y1="120" x2="240" y2="120" stroke="#334155" stroke-width="1"/>

              <text x="20" y="145" fill="#7dd3fc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">&bull; Scope: Specific GCP Service/Resource</text>
              <text x="20" y="170" fill="#7dd3fc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">&bull; Granularity: Service-curated roles</text>
              <text x="20" y="195" fill="#7dd3fc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">&bull; Blast Radius: Contained to resource</text>
              <text x="20" y="220" fill="#22c55e" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">&bull; Maintenance: Managed by Google</text>
              <text x="20" y="245" fill="#7dd3fc" font-family="system-ui, -apple-system, sans-serif" font-size="11">&bull; Conditions: Fully supported (CEL)</text>

              <rect x="20" y="275" width="220" height="45" rx="6" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1"/>
              <text x="130" y="295" fill="#bae6fd" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">ENTERPRISE RECOMMENDED DEFAULT</text>
              <text x="130" y="310" fill="#7dd3fc" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">Automatic updates when new APIs launch</text>
            </g>

            <!-- Column 3: Custom Roles -->
            <g transform="translate(660, 80)">
              <rect width="260" height="340" rx="8" fill="url(#gCustom)" stroke="#22c55e" stroke-width="1.5"/>
              <rect x="0" y="0" width="260" height="42" rx="8" fill="#22c55e" fill-opacity="0.25"/>
              <text x="130" y="26" fill="#22c55e" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle">CUSTOM ROLES</text>

              <text x="20" y="65" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="700">organizations/123/roles/bakeryDev</text>
              <text x="20" y="85" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="700">projects/p1/roles/batchWorker</text>
              <text x="20" y="105" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="700">Explicit API permission list</text>

              <line x1="20" y1="120" x2="240" y2="120" stroke="#334155" stroke-width="1"/>

              <text x="20" y="145" fill="#86efac" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">&bull; Scope: Project or Organization scope</text>
              <text x="20" y="170" fill="#86efac" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">&bull; Granularity: Exact surgical permissions</text>
              <text x="20" y="195" fill="#86efac" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">&bull; Blast Radius: Minimal (tailored)</text>
              <text x="20" y="220" fill="#f59e0b" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">&bull; Maintenance: Customer responsible</text>
              <text x="20" y="245" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">&bull; Limitation: Some APIs do not support</text>

              <rect x="20" y="275" width="220" height="45" rx="6" fill="#052e16" stroke="#22c55e" stroke-width="1"/>
              <text x="130" y="295" fill="#bbf7d0" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">SURGICAL LEAST PRIVILEGE</text>
              <text x="130" y="310" fill="#86efac" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">Used when predefined roles expose excess APIs</text>
            </g>

            <!-- Bottom Note -->
            <text x="480" y="450" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">Key Rule: If a predefined role grants administrative verbs when only read/write is needed, decompose into custom roles or add CEL conditions.</text>
          </svg>
          <figcaption class="diagram-caption">Figure 25.1: Structural comparison across the three Google Cloud IAM role tiers. Basic roles present extreme operational risk by spanning entire cloud projects, predefined roles provide balanced security maintained by Google, and custom roles deliver granular, surgical least-privilege boundaries at the cost of lifecycle maintenance.</figcaption>
        </figure>
