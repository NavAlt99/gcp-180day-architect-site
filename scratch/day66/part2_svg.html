<rect x="35" y="220" width="335" height="235" rx="4" fill="#0f172a" stroke="#f43f5e" stroke-width="1.2"/>
<text x="45" y="240" fill="#f87171" font-size="11" font-weight="700">FAILURE 1: Datastore Loss &amp; PSC Partition</text>
<text x="45" y="256" fill="#cbd5e1" font-size="9">Target: Cloud SQL Regional HA (PSC 10.128.0.50:5432)</text>

<rect x="45" y="265" width="315" height="48" rx="3" fill="#2a1215" stroke="#f43f5e" stroke-width="1"/>

<text x="52" y="295" fill="#fecaca" font-size="8.5">Socket timeout (2000ms) or connection pool exhausted</text>
<text x="52" y="307" fill="#f87171" font-size="8">&rarr; HikariCP ConnectionAcquisitionTimeoutException</text>

<rect x="45" y="320" width="315" height="60" rx="3" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
<text x="52" y="336" fill="#fbbf24" font-size="9" font-weight="700">Diagnostic Mechanism: Decoupled Probes</text>
<text x="52" y="351" fill="#22c55e" font-size="8.5">&bull; /healthz (Liveness) &rarr; 200 OK (container healthy, no loop)</text>
<text x="52" y="365" fill="#f43f5e" font-size="8.5">&bull; /readyz (Readiness) &rarr; 503 SERVICE UNAVAILABLE</text>
<text x="52" y="375" fill="#cbd5e1" font-size="8">&rarr; ALB removes pod from pool in &lt;1s; 0 hanging requests</text>

<rect x="45" y="388" width="315" height="55" rx="3" fill="#0f291e" stroke="#22c55e" stroke-width="1"/>
<text x="52" y="403" fill="#86efac" font-size="9" font-weight="700">&#10003; Recovery: Circuit Breaker Trips (Fast Fail)</text>
<text x="52" y="418" fill="#cbd5e1" font-size="8.5">&bull; Tripped to OPEN state after 3 failures; returns HTTP 503</text>
<text x="52" y="432" fill="#22c55e" font-size="8.5">&bull; Zero hung sockets; auto-heals upon PSC route restoration</text>

<!-- FAILURE 2: POISON PILL PAYLOAD & DLT QUARANTINE -->

<text x="400" y="240" fill="#d8b4fe" font-size="11" font-weight="700">FAILURE 2: Poison Pill Payload &amp; DLT Quarantine</text>
<text x="400" y="256" fill="#cbd5e1" font-size="9">Target: Pub/Sub Topic orders.v1 (ordering_key = order_id)</text>

<rect x="400" y="265" width="335" height="48" rx="3" fill="#2e1065" stroke="#a855f7" stroke-width="1"/>
<text x="407" y="280" fill="#e9d5ff" font-size="9" font-weight="700">&#9888; Simulated Fault: Corrupt Payload + Ordering Key</text>
<text x="407" y="295" fill="#cbd5e1" font-size="8.5">Corrupt JSON / non-UTF8 bytes with ordering_key="ord-bad-99"</text>
<text x="407" y="307" fill="#f87171" font-size="8">&rarr; Consumer throws JSONDecodeError / Crash-Before-Ack</text>

<rect x="400" y="320" width="335" height="60" rx="3" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
<text x="407" y="336" fill="#fbbf24" font-size="9" font-weight="700">Quarantine Mechanism: maxDeliveryAttempts = 5</text>
<text x="407" y="351" fill="#cbd5e1" font-size="8.5">&bull; Delivery attempts 1 to 5: Consumer NACKs payload</text>
<text x="407" y="365" fill="#f43f5e" font-size="8.5">&bull; Without DLT: Head-of-Line (HoL) blocking stalls partition!</text>
<text x="407" y="375" fill="#22c55e" font-size="8">&bull; With DLT: Pub/Sub routes to orders.v1.dlq automatically</text>

<rect x="400" y="388" width="335" height="55" rx="3" fill="#0f291e" stroke="#22c55e" stroke-width="1"/>
<text x="407" y="403" fill="#86efac" font-size="9" font-weight="700">&#10003; Recovery: DLT Alert &amp; Partition Unblocked</text>
<text x="407" y="418" fill="#cbd5e1" font-size="8.5">&bull; Metric Alert: pubsub/dead_letter_message_count &gt; 0</text>
<text x="407" y="432" fill="#22c55e" font-size="8.5">&bull; Ordering partition restored; subsequent valid orders proceed</text>

<text x="35" y="657" fill="#a78bfa" font-size="13" font-weight="700">4. MULTI-RUNTIME ARCHITECTURAL DECISION TOPOLOGY</text>

<!-- Runtime 1: Cloud Run -->
<rect x="35" y="670" width="250" height="102" rx="4" fill="#0f172a" stroke="#22c55e" stroke-width="1.2"/>
<text x="45" y="688" fill="#86efac" font-size="10.5" font-weight="700">Cloud Run (Baseline Choice)</text>
<text x="45" y="703" fill="#cbd5e1" font-size="8.5">&bull; 0-to-N autoscaling (sub-second scale)</text>
<text x="45" y="716" fill="#cbd5e1" font-size="8.5">&bull; Direct VPC Egress (/24 subnet private IPs)</text>
<text x="45" y="729" fill="#cbd5e1" font-size="8.5">&bull; Concurrency: up to 250 req/container</text>
<text x="45" y="742" fill="#cbd5e1" font-size="8.5">&bull; Cost: $0 when idle (true scale-to-zero)</text>
<text x="45" y="757" fill="#22c55e" font-size="8.5">&#10003; Fit: HTTP APIs, microservices, stateless</text>

<!-- Runtime 2: GKE Autopilot -->
<rect x="305" y="670" width="250" height="102" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
<text x="315" y="688" fill="#7dd3fc" font-size="10.5" font-weight="700">GKE Autopilot / Standard</text>
<text x="315" y="703" fill="#cbd5e1" font-size="8.5">&bull; Pod IP aliasing (VPC-native CNI)</text>
<text x="315" y="716" fill="#cbd5e1" font-size="8.5">&bull; DaemonSets, sidecars, custom ingress</text>
<text x="315" y="729" fill="#cbd5e1" font-size="8.5">&bull; StatefulSets + Persistent Volume Claims</text>
<text x="315" y="742" fill="#cbd5e1" font-size="8.5">&bull; Base cost: cluster mgmt fee + node pool</text>
<text x="315" y="757" fill="#38bdf8" font-size="8.5">&#10003; Fit: Complex meshes, multi-container, stateful</text>

<!-- Runtime 3: Compute Engine MIG -->
<rect x="575" y="670" width="250" height="102" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2"/>
<text x="585" y="688" fill="#fbbf24" font-size="10.5" font-weight="700">Compute Engine MIGs</text>
<text x="585" y="703" fill="#cbd5e1" font-size="8.5">&bull; Full OS kernel control, raw VM NICs</text>
<text x="585" y="716" fill="#cbd5e1" font-size="8.5">&bull; Autoscaler: CPU / custom metric (slow, 3-5m)</text>
<text x="585" y="729" fill="#cbd5e1" font-size="8.5">&bull; Stateful MIGs (per-instance disk/IP preserve)</text>
<text x="585" y="742" fill="#cbd5e1" font-size="8.5">&bull; High Day-2 toil (OS patching, golden images)</text>
<text x="585" y="757" fill="#f59e0b" font-size="8.5">&#10003; Fit: Legacy monoliths, GPU, custom OS drivers</text>
