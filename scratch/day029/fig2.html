        <figure class="architecture-diagram" id="fig-29-2">
          <svg viewBox="0 0 980 440" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-29-2-title fig-29-2-desc">
            <title id="fig-29-2-title">Figure 29.2: BigQuery Billing Export Multi-Stream Pipeline &amp; Schema Hierarchy</title>
            <desc id="fig-29-2-desc">Architecture diagram detailing the three BigQuery Cloud Billing export streams—Standard, Detailed, and Pricing—along with their structural schemas and downstream analytical destinations.</desc>
            <defs>
              <linearGradient id="bg-grad-29-2" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#090d16"/>
                <stop offset="100%" stop-color="#121526"/>
              </linearGradient>
              <linearGradient id="panel-grad-29-2" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#161b30"/>
                <stop offset="100%" stop-color="#1e243d"/>
              </linearGradient>
              <marker id="arrow-cyan-29-2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
              </marker>
              <marker id="arrow-purple-29-2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1 L 8 5 L 0 9 z" fill="#c084fc"/>
              </marker>
            </defs>

            <!-- Background Canvas -->
            <rect width="980" height="440" rx="12" fill="url(#bg-grad-29-2)" stroke="#1e293b" stroke-width="1.5"/>

            <!-- Banner Header -->
            <text x="30" y="38" fill="#f8fafc" font-size="16" font-weight="700" font-family="system-ui, -apple-system, sans-serif">BigQuery Billing Export Streams &amp; Schema Specialization</text>
            <text x="30" y="58" fill="#94a3b8" font-size="12" font-family="system-ui, -apple-system, sans-serif">Three distinct export streams: Standard daily SKU costs, Detailed resource-level tracking, and Enterprise Pricing</text>

            <!-- Box 1: Stream A - Standard Usage Export -->
            <rect x="30" y="90" width="280" height="320" rx="8" fill="url(#panel-grad-29-2)" stroke="#38bdf8" stroke-width="1.5"/>
            <rect x="42" y="102" width="105" height="20" rx="4" fill="#0284c7" fill-opacity="0.25"/>
            <text x="94" y="116" fill="#38bdf8" font-size="10" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">STANDARD EXPORT</text>
            <text x="42" y="142" fill="#f8fafc" font-size="13" font-weight="700" font-family="monospace">gcp_billing_export_v1_*</text>
            <text x="42" y="162" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">Daily service-level cost rollups</text>

            <rect x="42" y="176" width="256" height="150" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="52" y="196" fill="#cbd5e1" font-size="11" font-family="monospace">• billing_account_id: STRING</text>
            <text x="52" y="214" fill="#cbd5e1" font-size="11" font-family="monospace">• service: STRUCT&lt;id, desc&gt;</text>
            <text x="52" y="232" fill="#cbd5e1" font-size="11" font-family="monospace">• sku: STRUCT&lt;id, desc&gt;</text>
            <text x="52" y="250" fill="#cbd5e1" font-size="11" font-family="monospace">• project: STRUCT&lt;id, name&gt;</text>
            <text x="52" y="268" fill="#cbd5e1" font-size="11" font-family="monospace">• cost: FLOAT64 | currency: STRING</text>
            <text x="52" y="286" fill="#cbd5e1" font-size="11" font-family="monospace">• credits: ARRAY&lt;STRUCT&gt;</text>
            <text x="52" y="306" fill="#f87171" font-size="10" font-family="system-ui, sans-serif">&#10006; No individual resource IDs</text>

            <text x="42" y="348" fill="#38bdf8" font-size="11" font-weight="600" font-family="system-ui, sans-serif">Best for: Macro budgets &amp; invoice totals</text>
            <text x="42" y="366" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif">Low storage footprint &amp; fast scans</text>

            <!-- Box 2: Stream B - Detailed Usage Export -->
            <rect x="330" y="90" width="320" height="320" rx="8" fill="url(#panel-grad-29-2)" stroke="#22c55e" stroke-width="1.5"/>
            <rect x="342" y="102" width="105" height="20" rx="4" fill="#16a34a" fill-opacity="0.25"/>
            <text x="394" y="116" fill="#4ade80" font-size="10" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">DETAILED EXPORT</text>
            <text x="342" y="142" fill="#f8fafc" font-size="13" font-weight="700" font-family="monospace">gcp_billing_export_resource_v1_*</text>
            <text x="342" y="162" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">Resource-level granularity with labels</text>

            <rect x="342" y="176" width="296" height="150" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="352" y="196" fill="#4ade80" font-size="11" font-weight="700" font-family="monospace">• resource.name: STRING</text>
            <text x="352" y="214" fill="#cbd5e1" font-size="11" font-family="monospace">  (e.g., //compute/instances/prod-01)</text>
            <text x="352" y="232" fill="#4ade80" font-size="11" font-weight="700" font-family="monospace">• resource.global_name: STRING</text>
            <text x="352" y="250" fill="#cbd5e1" font-size="11" font-family="monospace">• location: STRUCT&lt;region, zone&gt;</text>
            <text x="352" y="268" fill="#4ade80" font-size="11" font-weight="700" font-family="monospace">• labels: ARRAY&lt;STRUCT&lt;k, v&gt;&gt;</text>
            <text x="352" y="286" fill="#cbd5e1" font-size="11" font-family="monospace">• cost: FLOAT64 | usage: STRUCT</text>
            <text x="352" y="306" fill="#86efac" font-size="10" font-family="system-ui, sans-serif">&#10004; Pinpoints exact VMs, disks &amp; buckets</text>

            <text x="342" y="348" fill="#4ade80" font-size="11" font-weight="600" font-family="system-ui, sans-serif">Essential for: FinOps chargeback &amp; waste audit</text>
            <text x="342" y="366" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif">Requires date partition filters to limit query cost</text>

            <!-- Box 3: Stream C - Pricing Export -->
            <rect x="670" y="90" width="280" height="320" rx="8" fill="url(#panel-grad-29-2)" stroke="#a855f7" stroke-width="1.5"/>
            <rect x="682" y="102" width="105" height="20" rx="4" fill="#9333ea" fill-opacity="0.25"/>
            <text x="734" y="116" fill="#c084fc" font-size="10" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">PRICING EXPORT</text>
            <text x="682" y="142" fill="#f8fafc" font-size="13" font-weight="700" font-family="monospace">cloud_pricing_export</text>
            <text x="682" y="162" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">Contract SKU rates &amp; tiered discounts</text>

            <rect x="682" y="176" width="256" height="150" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="692" y="196" fill="#cbd5e1" font-size="11" font-family="monospace">• sku.id: STRING</text>
            <text x="692" y="214" fill="#cbd5e1" font-size="11" font-family="monospace">• service: STRUCT&lt;id, desc&gt;</text>
            <text x="692" y="232" fill="#cbd5e1" font-size="11" font-family="monospace">• pricing_expression: STRUCT</text>
            <text x="692" y="250" fill="#cbd5e1" font-size="11" font-family="monospace">• tiered_rates: ARRAY&lt;STRUCT&gt;</text>
            <text x="692" y="268" fill="#cbd5e1" font-size="11" font-family="monospace">• list_price: STRUCT</text>
            <text x="692" y="286" fill="#cbd5e1" font-size="11" font-family="monospace">• effective_price: STRUCT</text>
            <text x="692" y="306" fill="#c084fc" font-size="10" font-family="system-ui, sans-serif">&#10004; Captures custom enterprise terms</text>

            <text x="682" y="348" fill="#c084fc" font-size="11" font-weight="600" font-family="system-ui, sans-serif">Used for: Cost modeling &amp; what-if simulations</text>
            <text x="682" y="366" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif">Replaces public pricing calculator tables</text>
          </svg>
          <figcaption>Figure 29.2: BigQuery Billing Export Multi-Stream Pipeline &amp; Schema Hierarchy. Cloud Billing feeds three distinct BigQuery streams: Standard Export (macro project/SKU costs), Detailed Export (granular resource identifiers, regional zones, and repeated label structs for root-cause cost attribution), and Pricing Export (contractual SKU rates and tiered discount structures).</figcaption>
        </figure>
