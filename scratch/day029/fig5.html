          <figcaption>Figure 29.5: Incident 29.2 - Standard Export Omission vs. Detailed Resource-Level Identification.
            <br><strong>Supplied facts:</strong> Month-over-month storage spend increased by $14,000. FinOps could only see aggregate SSD usage in the standard billing export table because standard export lacks individual resource IDs.
            <br><strong>Architectural inference:</strong> Identifying waste in shared infrastructure requires <code>resource.name</code> and zone-level granularity, which is only present in the Detailed Billing Export.
            <br><strong>Expected post-fix behavior:</strong> Enabling Detailed Usage Export reveals the exact resource URI (<code>//compute.googleapis.com/.../disks/disk-pvc-88a2-orphan</code>), enabling automated cleanup scripts to snapshot and delete the unattached 20TB disk within minutes.
          </figcaption>
