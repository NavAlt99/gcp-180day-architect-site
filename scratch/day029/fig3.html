        <figure class="architecture-diagram" id="fig-29-3">
          <svg viewBox="0 0 980 440" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-29-3-title fig-29-3-desc">
            <title id="fig-29-3-title">Figure 29.3: Quota Hierarchy &amp; The Capacity Triad</title>
            <desc id="fig-29-3-desc">Architectural diagram contrasting Rate Quotas (API frequency limits), Allocation Quotas (provisioned resource ceilings), and Physical Hardware Capacity (actual datacenter inventory), along with their distinct failure modes.</desc>
            <defs>
              <linearGradient id="bg-grad-29-3" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#090d16"/>
                <stop offset="100%" stop-color="#121526"/>
              </linearGradient>
              <linearGradient id="panel-grad-29-3" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#161b30"/>
                <stop offset="100%" stop-color="#1e243d"/>
              </linearGradient>
            </defs>

            <!-- Background Canvas -->
            <rect width="980" height="440" rx="12" fill="url(#bg-grad-29-3)" stroke="#1e293b" stroke-width="1.5"/>

            <!-- Banner Header -->
            <text x="30" y="38" fill="#f8fafc" font-size="16" font-weight="700" font-family="system-ui, -apple-system, sans-serif">The Capacity Triad: Rate Quotas, Allocation Quotas &amp; Physical Inventory</text>
            <text x="30" y="58" fill="#94a3b8" font-size="12" font-family="system-ui, -apple-system, sans-serif">Understanding the three independent failure boundaries governing Google Cloud workload execution</text>

            <!-- Column 1: Rate Quotas -->
            <rect x="30" y="85" width="280" height="325" rx="8" fill="url(#panel-grad-29-3)" stroke="#f59e0b" stroke-width="1.5"/>
            <rect x="42" y="97" width="100" height="20" rx="4" fill="#d97706" fill-opacity="0.25"/>
            <text x="92" y="111" fill="#f59e0b" font-size="10" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">RATE QUOTAS</text>
            <text x="42" y="136" fill="#f8fafc" font-size="14" font-weight="700" font-family="system-ui, sans-serif">API Frequency Limits</text>
            <text x="42" y="154" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">Velocity boundary: calls per minute</text>

            <rect x="42" y="168" width="256" height="74" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="52" y="186" fill="#f8fafc" font-size="11" font-weight="600" font-family="system-ui, sans-serif">Scope Examples:</text>
            <text x="52" y="204" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">• Read/Write requests per 100 sec</text>
            <text x="52" y="220" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">• Cloud Pub/Sub publish bytes/sec</text>
            <text x="52" y="234" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">• Secret Manager access QPS</text>

            <rect x="42" y="248" width="256" height="74" rx="4" fill="#450a0a" stroke="#f43f5e" stroke-width="1"/>
            <text x="52" y="266" fill="#fca5a5" font-size="11" font-weight="700" font-family="system-ui, sans-serif">Failure Signal:</text>
            <text x="52" y="284" fill="#f87171" font-size="11" font-weight="600" font-family="monospace">HTTP 429 Too Many Requests</text>
            <text x="52" y="302" fill="#cbd5e1" font-size="10" font-family="monospace">RESOURCE_EXHAUSTED</text>
            <text x="52" y="316" fill="#fca5a5" font-size="9" font-style="italic" font-family="system-ui, sans-serif">Client throttled immediately</text>

            <rect x="42" y="328" width="256" height="66" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="52" y="346" fill="#f59e0b" font-size="11" font-weight="700" font-family="system-ui, sans-serif">Remediation Architecture:</text>
            <text x="52" y="364" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif">• Exponential backoff with full jitter</text>
            <text x="52" y="380" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif">• Batch requests / client-side caching</text>

            <!-- Column 2: Allocation Quotas -->
            <rect x="330" y="85" width="310" height="325" rx="8" fill="url(#panel-grad-29-3)" stroke="#38bdf8" stroke-width="1.5"/>
            <rect x="342" y="97" width="130" height="20" rx="4" fill="#0284c7" fill-opacity="0.25"/>
            <text x="407" y="111" fill="#38bdf8" font-size="10" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">ALLOCATION QUOTAS</text>
            <text x="342" y="136" fill="#f8fafc" font-size="14" font-weight="700" font-family="system-ui, sans-serif">Provisioned Resource Caps</text>
            <text x="342" y="154" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">Inventory boundary: aggregate resources</text>

            <rect x="342" y="168" width="286" height="74" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="352" y="186" fill="#f8fafc" font-size="11" font-weight="600" font-family="system-ui, sans-serif">Scope Examples:</text>
            <text x="352" y="204" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">• CPUs per region (e.g. 500 vCPUs in us-east1)</text>
            <text x="352" y="220" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">• Persistent Disk SSD (GB per region)</text>
            <text x="352" y="234" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">• Static external IP addresses</text>

            <rect x="342" y="248" width="286" height="74" rx="4" fill="#450a0a" stroke="#f43f5e" stroke-width="1"/>
            <text x="352" y="266" fill="#fca5a5" font-size="11" font-weight="700" font-family="system-ui, sans-serif">Failure Signal:</text>
            <text x="352" y="284" fill="#f87171" font-size="11" font-weight="600" font-family="monospace">QUOTA_EXCEEDED</text>
            <text x="352" y="302" fill="#cbd5e1" font-size="10" font-family="monospace">Quota 'CPUS' exceeded. Limit: 100.0</text>
            <text x="352" y="316" fill="#fca5a5" font-size="9" font-style="italic" font-family="system-ui, sans-serif">Creation/Autoscaling blocked</text>

            <rect x="342" y="328" width="286" height="66" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="352" y="346" fill="#38bdf8" font-size="11" font-weight="700" font-family="system-ui, sans-serif">Remediation Architecture:</text>
            <text x="352" y="364" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif">• Submit quota increase via Console/API</text>
            <text x="352" y="380" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif">• Clean idle instances / unattached disks</text>

            <!-- Column 3: Physical Capacity -->
            <rect x="660" y="85" width="290" height="325" rx="8" fill="url(#panel-grad-29-3)" stroke="#ef4444" stroke-width="1.5"/>
            <rect x="672" y="97" width="130" height="20" rx="4" fill="#b91c1c" fill-opacity="0.25"/>
            <text x="737" y="111" fill="#f87171" font-size="10" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">PHYSICAL CAPACITY</text>
            <text x="672" y="136" fill="#f8fafc" font-size="14" font-weight="700" font-family="system-ui, sans-serif">Datacenter Inventory</text>
            <text x="672" y="154" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">Physical hardware in specific zone</text>

            <rect x="672" y="168" width="266" height="74" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="682" y="186" fill="#f8fafc" font-size="11" font-weight="600" font-family="system-ui, sans-serif">Scope Examples:</text>
            <text x="682" y="204" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">• Physical server slots in zone us-central1-b</text>
            <text x="682" y="220" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">• GPU inventory (NVIDIA H100 / A100)</text>
            <text x="682" y="234" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">• Specific machine families (e.g. C3/M2)</text>

            <rect x="672" y="248" width="266" height="74" rx="4" fill="#450a0a" stroke="#f43f5e" stroke-width="1"/>
            <text x="682" y="266" fill="#fca5a5" font-size="11" font-weight="700" font-family="system-ui, sans-serif">Failure Signal:</text>
            <text x="682" y="284" fill="#f87171" font-size="11" font-weight="600" font-family="monospace">ZONE_RESOURCE_POOL_EXHAUSTED</text>
            <text x="682" y="302" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">Occurs EVEN IF quota limit is 10,000!</text>
            <text x="682" y="316" fill="#fca5a5" font-size="9" font-style="italic" font-family="system-ui, sans-serif">Google has no physical server free</text>

            <rect x="672" y="328" width="266" height="66" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="682" y="346" fill="#ef4444" font-size="11" font-weight="700" font-family="system-ui, sans-serif">Remediation Architecture:</text>
            <text x="682" y="364" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif">• Regional MIGs across multiple zones</text>
            <text x="682" y="380" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif">• Compute Engine Capacity Reservations</text>
          </svg>
          <figcaption>Figure 29.3: Quota Hierarchy &amp; The Capacity Triad. Architectural comparison of the three failure planes in Google Cloud resource provisioning. Rate Quotas throttle request velocity with <code>HTTP 429</code>; Allocation Quotas cap maximum provisioned resource quantities with <code>QUOTA_EXCEEDED</code>; Physical Capacity reflects actual physical datacenter hardware availability, failing with <code>ZONE_RESOURCE_POOL_EXHAUSTED</code> even when approved quotas are abundant.</figcaption>
        </figure>
