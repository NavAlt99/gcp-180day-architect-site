        <figure class="architecture-diagram" id="fig-29-4">
          <svg viewBox="0 0 980 460" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-29-4-title fig-29-4-desc">
            <title id="fig-29-4-title">Figure 29.4: Incident 29.1 - Billing Reports Ingestion Latency vs. Real-Time Telemetry Interception</title>
            <desc id="fig-29-4-desc">Diagram showing the failed path of trusting delayed console billing reports during a runaway query loop versus the corrected path of streaming log metrics and automated BigQuery slot quotas.</desc>
            <defs>
              <linearGradient id="bg-grad-29-4" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#090d16"/>
                <stop offset="100%" stop-color="#121526"/>
              </linearGradient>
              <marker id="arrow-rose-29-4" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1 L 8 5 L 0 9 z" fill="#f43f5e"/>
              </marker>
              <marker id="arrow-green-29-4" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1 L 8 5 L 0 9 z" fill="#22c55e"/>
              </marker>
            </defs>

            <!-- Canvas Background -->
            <rect width="980" height="460" rx="12" fill="url(#bg-grad-29-4)" stroke="#1e293b" stroke-width="1.5"/>

            <!-- Header -->
            <text x="30" y="36" fill="#f8fafc" font-size="16" font-weight="700" font-family="system-ui, -apple-system, sans-serif">Incident 29.1: Billing Console Latency Illusion &amp; Runaway Spend</text>
            <text x="30" y="56" fill="#94a3b8" font-size="12" font-family="system-ui, -apple-system, sans-serif">Console 4-hour ingestion delay hides active query loop vs. real-time slot limits &amp; log monitoring</text>

            <!-- Components Columns -->
            <!-- Col 1: Workload Trigger -->
            <rect x="30" y="80" width="160" height="40" rx="6" fill="#1e243d" stroke="#f59e0b" stroke-width="1.5"/>
            <text x="110" y="105" fill="#f8fafc" font-size="13" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">Batch Job</text>
            <line x1="110" y1="120" x2="110" y2="430" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>

            <!-- Col 2: Cloud Billing Console -->
            <rect x="270" y="80" width="180" height="40" rx="6" fill="#1e243d" stroke="#38bdf8" stroke-width="1.5"/>
            <text x="360" y="105" fill="#f8fafc" font-size="13" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">Billing Reports Console</text>
            <line x1="360" y1="120" x2="360" y2="430" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>

            <!-- Col 3: Cloud Monitoring / Alerting -->
            <rect x="530" y="80" width="180" height="40" rx="6" fill="#1e243d" stroke="#a855f7" stroke-width="1.5"/>
            <text x="620" y="105" fill="#f8fafc" font-size="13" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">Real-Time Monitoring</text>
            <line x1="620" y1="120" x2="620" y2="430" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>

            <!-- Col 4: BigQuery Engine -->
            <rect x="790" y="80" width="160" height="40" rx="6" fill="#1e243d" stroke="#22c55e" stroke-width="1.5"/>
            <text x="870" y="105" fill="#f8fafc" font-size="13" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">BigQuery Engine</text>
            <line x1="870" y1="120" x2="870" y2="430" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>

            <!-- FAILED PATH (TOP HALF) -->
            <!-- Step 1: Infinite retry loop -->
            <line x1="110" y1="150" x2="864" y2="150" stroke="#f43f5e" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-rose-29-4)"/>
            <text x="485" y="142" fill="#f87171" font-size="11" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">[FAILED PATH: Infinite cross-join query loop consumes on-demand slots]</text>

            <!-- Step 2: On-call checks console -->
            <line x1="360" y1="175" x2="116" y2="175" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow-cyan-29-1)"/>
            <text x="235" y="168" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Check Billing Reports</text>

            <!-- Step 3: Console displays delayed flatline -->
            <rect x="280" y="190" width="160" height="42" rx="4" fill="#450a0a" stroke="#f43f5e" stroke-width="1"/>
            <text x="360" y="206" fill="#fca5a5" font-size="10" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">DELAY ILLUSION (4h lag)</text>
            <text x="360" y="222" fill="#f87171" font-size="9" font-family="system-ui, sans-serif" text-anchor="middle">Shows $120 &rarr; Dismissed as false</text>

            <!-- Step 4: Runaway burn -->
            <line x1="870" y1="245" x2="870" y2="255" stroke="#f43f5e" stroke-width="2"/>
            <rect x="790" y="245" width="160" height="35" rx="4" fill="#450a0a" stroke="#f43f5e" stroke-width="1"/>
            <text x="870" y="262" fill="#fca5a5" font-size="10" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">CRASH: $28,000 SPEND</text>
            <text x="870" y="274" fill="#fca5a5" font-size="9" font-family="system-ui, sans-serif" text-anchor="middle">Credit card limit exceeded</text>

            <!-- Divider Line -->
            <line x1="30" y1="290" x2="950" y2="290" stroke="#334155" stroke-width="1.5" stroke-dasharray="2 2"/>

            <!-- CORRECTED PATH (BOTTOM HALF) -->
            <!-- Step 5: BigQuery Job execution with byte limit -->
            <line x1="110" y1="320" x2="864" y2="320" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow-green-29-4)"/>
            <text x="485" y="312" fill="#4ade80" font-size="11" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">[CORRECTED PATH: Query submitted with maximum_bytes_billed limit]</text>

            <!-- Step 6: Real-time Cloud Monitoring metrics -->
            <line x1="870" y1="350" x2="626" y2="350" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow-green-29-4)"/>
            <text x="748" y="342" fill="#4ade80" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Stream slot metrics (0s lag)</text>

            <!-- Step 7: Immediate alert and circuit break -->
            <rect x="540" y="370" width="160" height="42" rx="4" fill="#052e16" stroke="#22c55e" stroke-width="1"/>
            <text x="620" y="386" fill="#4ade80" font-size="10" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">CIRCUIT BREAKER</text>
            <text x="620" y="402" fill="#86efac" font-size="9" font-family="system-ui, sans-serif" text-anchor="middle">Slots capped; alert in 90 sec</text>

            <line x1="620" y1="420" x2="116" y2="420" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow-green-29-4)"/>
            <text x="360" y="414" fill="#4ade80" font-size="11" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">[CORRECTED PATH: Job cancelled before $50 spent; prod safe]</text>
          </svg>
          <figcaption>Figure 29.4: Incident 29.1 - Billing Reports Ingestion Latency vs. Real-Time Telemetry Interception.
            <br><strong>Supplied facts:</strong> An unpartitioned BigQuery query loop ran for 4 hours. The on-call engineer checked console Billing Reports, saw a flatline due to the 1-to-4 hour billing data ingestion delay, and dismissed the alert, causing an unexpected $28,000 charge.
            <br><strong>Architectural inference:</strong> Console billing reports are asynchronous accounting views, not real-time operational monitors; spend runaway defense must rely on real-time Cloud Monitoring metrics and query slot caps.
            <br><strong>Expected post-fix behavior:</strong> BigQuery queries enforce <code>maximum_bytes_billed</code> guardrails, Cloud Monitoring tracks <code>bigquery.googleapis.com/slots/allocated_for_project</code> in real time, and alerts fire in seconds without relying on billing console updates.
          </figcaption>
        </figure>
