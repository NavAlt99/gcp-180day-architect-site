        <figure class="architecture-diagram" id="fig-29-1">
          <svg viewBox="0 0 980 440" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-29-1-title fig-29-1-desc">
            <title id="fig-29-1-title">Figure 29.1: Cloud Billing Console Reports &amp; Cost Table Exploration Architecture</title>
            <desc id="fig-29-1-desc">Architecture diagram showing how usage telemetry from projects feeds the Cloud Billing Data Engine, powering interactive Billing Reports for trend exploration and the itemized Cost Table for invoice reconciliation.</desc>
            <defs>
              <linearGradient id="bg-grad-29-1" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#090d16"/>
                <stop offset="100%" stop-color="#121526"/>
              </linearGradient>
              <linearGradient id="panel-grad-29-1" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#161b30"/>
                <stop offset="100%" stop-color="#1e243d"/>
              </linearGradient>
              <marker id="arrow-cyan-29-1" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
              </marker>
              <marker id="arrow-green-29-1" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1 L 8 5 L 0 9 z" fill="#22c55e"/>
              </marker>
              <marker id="arrow-amber-29-1" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1 L 8 5 L 0 9 z" fill="#f59e0b"/>
              </marker>
            </defs>

            <!-- Background Canvas -->
            <rect width="980" height="440" rx="12" fill="url(#bg-grad-29-1)" stroke="#1e293b" stroke-width="1.5"/>

            <!-- Banner Header -->
            <text x="30" y="38" fill="#f8fafc" font-size="16" font-weight="700" font-family="system-ui, -apple-system, sans-serif">Cloud Billing Console Reports &amp; Cost Table Data Architecture</text>
            <text x="30" y="58" fill="#94a3b8" font-size="12" font-family="system-ui, -apple-system, sans-serif">Raw usage telemetry &rarr; Cloud Billing aggregation engine &rarr; Trend analysis &amp; invoice-matched ledger</text>

            <!-- Box 1: Resource Telemetry Generation -->
            <rect x="30" y="90" width="220" height="320" rx="8" fill="url(#panel-grad-29-1)" stroke="#38bdf8" stroke-width="1.5"/>
            <rect x="42" y="102" width="130" height="20" rx="4" fill="#0284c7" fill-opacity="0.25"/>
            <text x="107" y="116" fill="#38bdf8" font-size="10" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">USAGE EMISSION</text>
            <text x="42" y="142" fill="#f8fafc" font-size="14" font-weight="700" font-family="system-ui, sans-serif">Linked Projects</text>
            <text x="42" y="162" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">Emits metering records:</text>

            <rect x="42" y="176" width="196" height="52" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="52" y="196" fill="#f8fafc" font-size="11" font-weight="600" font-family="system-ui, sans-serif">Compute Engine (vCPU/RAM)</text>
            <text x="52" y="214" fill="#38bdf8" font-size="10" font-family="system-ui, sans-serif">Granular core-hour usage</text>

            <rect x="42" y="238" width="196" height="52" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="52" y="258" fill="#f8fafc" font-size="11" font-weight="600" font-family="system-ui, sans-serif">Cloud Storage &amp; BigQuery</text>
            <text x="52" y="276" fill="#38bdf8" font-size="10" font-family="system-ui, sans-serif">Byte-hours &amp; query slots</text>

            <rect x="42" y="300" width="196" height="52" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="52" y="320" fill="#f8fafc" font-size="11" font-weight="600" font-family="system-ui, sans-serif">Network Egress &amp; APIs</text>
            <text x="52" y="338" fill="#38bdf8" font-size="10" font-family="system-ui, sans-serif">Inter-region / internet transfer</text>

            <text x="42" y="380" fill="#94a3b8" font-size="10" font-style="italic" font-family="system-ui, sans-serif">Hourly billing collection pipeline</text>

            <!-- Arrow 1: Telemetry -> Billing Engine -->
            <line x1="250" y1="250" x2="294" y2="250" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-cyan-29-1)"/>
            <text x="272" y="240" fill="#38bdf8" font-size="10" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Stream</text>

            <!-- Box 2: Cloud Billing Aggregation Engine -->
            <rect x="300" y="90" width="260" height="320" rx="8" fill="url(#panel-grad-29-1)" stroke="#a855f7" stroke-width="1.5"/>
            <rect x="312" y="102" width="120" height="20" rx="4" fill="#9333ea" fill-opacity="0.25"/>
            <text x="372" y="116" fill="#c084fc" font-size="10" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">BILLING CORE</text>
            <text x="312" y="142" fill="#f8fafc" font-size="14" font-weight="700" font-family="system-ui, sans-serif">Cloud Billing Data Engine</text>
            <text x="312" y="162" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">Processes &amp; calculates gross/net spend</text>

            <rect x="312" y="176" width="236" height="66" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="322" y="196" fill="#f8fafc" font-size="11" font-weight="600" font-family="system-ui, sans-serif">Pricing &amp; Contract Engine</text>
            <text x="322" y="214" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif">• Multiplies usage units &times; SKU rate</text>
            <text x="322" y="230" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif">• Applies CUDs &amp; Sustained Use</text>

            <rect x="312" y="252" width="236" height="66" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="322" y="272" fill="#f8fafc" font-size="11" font-weight="600" font-family="system-ui, sans-serif">Credit &amp; Discount Engine</text>
            <text x="322" y="290" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif">• Promotional vouchers &amp; offsets</text>
            <text x="322" y="306" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif">• Multi-tier volume discounts</text>

            <rect x="312" y="328" width="236" height="68" rx="4" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
            <text x="322" y="348" fill="#818cf8" font-size="11" font-weight="700" font-family="system-ui, sans-serif">Data Ingestion Latency</text>
            <text x="322" y="366" fill="#c7d2fe" font-size="10" font-family="system-ui, sans-serif">Lag: 1 to 4 hours (sometimes &le;24h)</text>
            <text x="322" y="382" fill="#c7d2fe" font-size="9" font-style="italic" font-family="system-ui, sans-serif">Console reports are NOT instantaneous</text>

            <!-- Arrows to outputs -->
            <path d="M 560 170 L 610 170" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-cyan-29-1)"/>
            <path d="M 560 330 L 610 330" fill="none" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow-green-29-1)"/>

            <!-- Box 3A: Cloud Billing Reports -->
            <rect x="620" y="90" width="330" height="150" rx="8" fill="url(#panel-grad-29-1)" stroke="#38bdf8" stroke-width="1.5"/>
            <rect x="632" y="102" width="100" height="20" rx="4" fill="#0284c7" fill-opacity="0.25"/>
            <text x="682" y="116" fill="#38bdf8" font-size="10" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">BILLING REPORTS</text>
            <text x="632" y="142" fill="#f8fafc" font-size="14" font-weight="700" font-family="system-ui, sans-serif">Interactive Visual Explorer</text>
            <text x="632" y="162" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">• Time-series line &amp; stacked bar charts</text>
            <text x="632" y="180" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">• Slicing by: Project, Service, SKU, Region, Label</text>
            <text x="632" y="198" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">• Group-by dimensions &amp; currency conversion</text>
            <text x="632" y="222" fill="#38bdf8" font-size="11" font-weight="600" font-family="system-ui, sans-serif">Primary tool for human trend triage</text>

            <!-- Box 3B: Cost Table -->
            <rect x="620" y="260" width="330" height="150" rx="8" fill="url(#panel-grad-29-1)" stroke="#22c55e" stroke-width="1.5"/>
            <rect x="632" y="272" width="85" height="20" rx="4" fill="#16a34a" fill-opacity="0.25"/>
            <text x="674" y="286" fill="#4ade80" font-size="10" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">COST TABLE</text>
            <text x="632" y="312" fill="#f8fafc" font-size="14" font-weight="700" font-family="system-ui, sans-serif">Itemized Invoice Reconciler</text>
            <text x="632" y="332" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">• Matches official monthly PDF invoice</text>
            <text x="632" y="350" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">• Columns: Gross Cost, Credits, Net Cost, Taxes</text>
            <text x="632" y="368" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">• CSV / Sheets export for corporate accounting</text>
            <text x="632" y="392" fill="#4ade80" font-size="11" font-weight="600" font-family="system-ui, sans-serif">Mathematical source of invoice truth</text>
          </svg>
          <figcaption>Figure 29.1: Cloud Billing Console Reports &amp; Cost Table Exploration Architecture. Metered telemetry from linked projects flows into the Cloud Billing Data Engine with a 1-to-4 hour calculation latency. It populates interactive Billing Reports for graphical trend analysis and the tabular Cost Table for SKU-level invoice reconciliation and accounting chargebacks.</figcaption>
        </figure>
