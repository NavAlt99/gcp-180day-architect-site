                <rect x="0" y="90" width="320" height="55" rx="4" fill="#1e293b"/>
                <text x="10" y="109" fill="#22c55e" font-family="monospace" font-size="11" font-weight="700">roles/billing.user</text>
                <text x="10" y="129" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">DevOps / Project Creators: Link projects, no payment view</text>

                <rect x="0" y="155" width="320" height="55" rx="4" fill="#1e293b"/>
                <text x="10" y="174" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700">roles/billing.viewer</text>
                <text x="10" y="194" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">FinOps &amp; Audit: Read-only spend reports &amp; invoices</text>

                </g>

            <!-- Linkage Arrows from Billing Account to Projects -->
            <path d="M 400 115 L 430 115 L 430 280 L 540 280" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow27-link)"/>
            <path d="M 400 115 L 430 115 L 430 355 L 540 355" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow27-link)"/>
            <text x="435" y="235" fill="#f59e0b" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" transform="rotate(90, 435, 235)">projectBillingInfo</text>
          </svg>
          <figcaption class="diagram-caption">Figure 27.1: The Google Cloud Billing boundary is decoupled from the Resource Manager hierarchy. Multiple projects attach horizontally to a centralized billing account via projectBillingInfo links. Segregation of duties ensures infrastructure engineers possess only roles/billing.user to link projects, reserving roles/billing.admin strictly for financial administrators.</figcaption>
