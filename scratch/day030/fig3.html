        <figure class="architecture-diagram" id="fig-30-3">
          <svg viewBox="0 0 980 440" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-30-3-title fig-30-3-desc">
            <title id="fig-30-3-title">Figure 30.3: Regulatory Data Sovereignty Infraction vs Enforced Org Policy Location Boundary</title>
            <desc id="fig-30-3-desc">Incident diagram showing unconstrained Terraform provisioning routing EU customer PII to us-east4 causing GDPR violations, contrasted with enforced Resource Locations organization policy restricting deployments to europe-west3.</desc>
            <defs>
              <linearGradient id="bg-grad-30-3" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#090d16"/>
                <stop offset="100%" stop-color="#121526"/>
              </linearGradient>
              <linearGradient id="card-grad-30-3" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#161b30"/>
                <stop offset="100%" stop-color="#1e243d"/>
              </linearGradient>
              <marker id="arrow-red-30-3" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1 L 8 5 L 0 9 z" fill="#f43f5e"/>
              </marker>
              <marker id="arrow-green-30-3" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1 L 8 5 L 0 9 z" fill="#22c55e"/>
              </marker>
            </defs>

            <!-- Background Canvas -->
            <rect width="980" height="440" rx="12" fill="url(#bg-grad-30-3)" stroke="#1e293b" stroke-width="1.5"/>

            <!-- Banner Header -->
            <text x="30" y="38" fill="#f8fafc" font-size="16" font-weight="700" font-family="system-ui, -apple-system, sans-serif">Incident 30.1 · Regional Boundary Violation vs Enforced Location Constraint</text>
            <text x="30" y="58" fill="#94a3b8" font-size="12" font-family="system-ui, -apple-system, sans-serif">Preventing cross-border data sovereignty breaches using hierarchical constraints/gcp.resourceLocations</text>

            <!-- Ingress: European Retail Expansion Client / Terraform Pipeline -->
            <rect x="30" y="90" width="220" height="150" rx="8" fill="url(#card-grad-30-3)" stroke="#38bdf8" stroke-width="1.5"/>
            <rect x="42" y="102" width="130" height="20" rx="4" fill="#0284c7" fill-opacity="0.25"/>
            <text x="107" y="116" fill="#38bdf8" font-size="10" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">EXPANSION PIPELINE</text>
            <text x="42" y="140" fill="#f8fafc" font-size="13" font-weight="700" font-family="system-ui, sans-serif">EU Retail Orders &amp; DB</text>
            <text x="42" y="160" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">• Berlin &amp; Paris retail stores</text>
            <text x="42" y="178" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">• PII: Customer names, IBANs</text>
            <text x="42" y="196" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">• Invariant: &le;1 order dispatch</text>
            <text x="42" y="222" fill="#94a3b8" font-size="10" font-family="monospace">terraform apply (default region)</text>

            <!-- Middle: Policy Gatekeeper -->
            <rect x="290" y="90" width="200" height="150" rx="8" fill="url(#card-grad-30-3)" stroke="#f59e0b" stroke-width="1.5"/>
            <rect x="302" y="102" width="140" height="20" rx="4" fill="#d97706" fill-opacity="0.25"/>
            <text x="372" y="116" fill="#f59e0b" font-size="10" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">ORG POLICY ENGINE</text>
            <text x="302" y="140" fill="#f8fafc" font-size="13" font-weight="700" font-family="system-ui, sans-serif">Resource Location Gate</text>
            <text x="302" y="162" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">Before: Policy unassigned</text>
            <text x="302" y="180" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">After: Enforce constraint</text>
            <text x="302" y="198" fill="#4ade80" font-size="10" font-weight="600" font-family="monospace">in:europe-locations</text>
            <text x="302" y="222" fill="#94a3b8" font-size="10" font-family="sans-serif">Deny all non-EU regions</text>

            <!-- FAILED PATH (TOP RIGHT) -->
            <rect x="550" y="90" width="400" height="145" rx="8" fill="#450a0a" stroke="#f43f5e" stroke-width="1.5"/>
            <rect x="562" y="102" width="110" height="20" rx="4" fill="#dc2626" fill-opacity="0.3"/>
            <text x="617" y="116" fill="#fca5a5" font-size="10" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">&#10008; FAILED PATH</text>
            <text x="562" y="138" fill="#f8fafc" font-size="13" font-weight="700" font-family="system-ui, sans-serif">Unchecked Deployment in us-east4 (N. Virginia)</text>
            <text x="562" y="158" fill="#fecaca" font-size="11" font-family="system-ui, sans-serif">• Cloud SQL instance provisioned in US datacenter</text>
            <text x="562" y="176" fill="#fecaca" font-size="11" font-family="system-ui, sans-serif">• EU customer order PII transferred cross-Atlantic</text>
            <text x="562" y="194" fill="#f87171" font-size="11" font-weight="700" font-family="system-ui, sans-serif">&#9888; GDPR Art. 44 violation; $180,000 regulatory fine</text>
            <text x="562" y="218" fill="#fca5a5" font-size="10" font-weight="600" font-family="sans-serif">[FAILED PATH: Unconstrained terraform apply provisions Cloud SQL in us-east4, causing cross-border PII transfer and GDPR violation]</text>

            <!-- CORRECTED PATH (BOTTOM RIGHT) -->
            <rect x="550" y="265" width="400" height="150" rx="8" fill="#052e16" stroke="#22c55e" stroke-width="1.5"/>
            <rect x="562" y="277" width="130" height="20" rx="4" fill="#16a34a" fill-opacity="0.3"/>
            <text x="627" y="291" fill="#86efac" font-size="10" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">&#10004; CORRECTED PATH</text>
            <text x="562" y="313" fill="#f8fafc" font-size="13" font-weight="700" font-family="system-ui, sans-serif">Enforced Residency in europe-west3 (Frankfurt)</text>
            <text x="562" y="333" fill="#bbf7d0" font-size="11" font-family="system-ui, sans-serif">• constraints/gcp.resourceLocations rejects non-EU regions</text>
            <text x="562" y="351" fill="#bbf7d0" font-size="11" font-family="system-ui, sans-serif">• Regional Cloud SQL HA deployed in Frankfurt (a, b, c)</text>
            <text x="562" y="369" fill="#4ade80" font-size="11" font-weight="700" font-family="system-ui, sans-serif">&#10004; 100% GDPR compliant; &lt;14ms low-latency EU ordering</text>
            <text x="562" y="393" fill="#86efac" font-size="10" font-weight="600" font-family="sans-serif">[CORRECTED PATH: Org Policy enforces constraints/gcp.resourceLocations, provisioning database in europe-west3 with guaranteed residency]</text>

            <!-- Connection lines -->
            <!-- From pipeline to gatekeeper -->
            <line x1="250" y1="165" x2="282" y2="165" stroke="#38bdf8" stroke-width="2"/>

            <!-- Failed Path: Red dashed arrow from Gatekeeper to us-east4 -->
            <path d="M 490 140 L 515 140 L 515 140 L 542 140" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow-red-30-3)"/>

            <!-- Corrected Path: Green solid arrow from Gatekeeper down to europe-west3 -->
            <path d="M 490 190 L 515 190 L 515 340 L 542 340" fill="none" stroke="#22c55e" stroke-width="2.5" marker-end="url(#arrow-green-30-3)"/>
          </svg>
          <figcaption>Figure 30.3: Architectural trace of Incident 30.1. <strong>Supplied facts:</strong> Brightloaf's European expansion team provisioned a customer order database in <code>us-east4</code> without resource location governance, transferring European customer PII to US datacenters and violating GDPR Article 44. <strong>Architectural inference:</strong> Ad-hoc regional selection without root-level Organization Policy enforcement allows developers to unintentionally deploy data storage outside national regulatory boundaries. <strong>Expected post-fix behavior:</strong> Enforcing <code>constraints/gcp.resourceLocations</code> restricted to <code>in:europe-locations</code> deterministically rejects unauthorized regional provisioning at API submission time and guarantees database deployment in <code>europe-west3</code> with full regulatory compliance and zero duplicate fulfillment risk.</figcaption>
        </figure>
