        <figure class="architecture-diagram" id="fig-30-1">
          <svg viewBox="0 0 980 440" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-30-1-title fig-30-1-desc">
            <title id="fig-30-1-title">Figure 30.1: Multi-Criteria Region Selection Architecture</title>
            <desc id="fig-30-1-desc">Architecture diagram showing the five core vectors evaluated during Google Cloud region selection: latency, cost, compliance and sovereignty, service and accelerator availability, and carbon footprint.</desc>
            <defs>
              <linearGradient id="bg-grad-30-1" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#090d16"/>
                <stop offset="100%" stop-color="#121526"/>
              </linearGradient>
              <linearGradient id="panel-grad-30-1" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#161b30"/>
                <stop offset="100%" stop-color="#1e243d"/>
              </linearGradient>
              <marker id="arrow-cyan-30-1" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
              </marker>
              <marker id="arrow-green-30-1" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1 L 8 5 L 0 9 z" fill="#22c55e"/>
              </marker>
            </defs>

            <!-- Background Canvas -->
            <rect width="980" height="440" rx="12" fill="url(#bg-grad-30-1)" stroke="#1e293b" stroke-width="1.5"/>

            <!-- Banner Header -->
            <text x="30" y="38" fill="#f8fafc" font-size="16" font-weight="700" font-family="system-ui, -apple-system, sans-serif">Google Cloud Multi-Criteria Region Selection Architecture</text>
            <text x="30" y="58" fill="#94a3b8" font-size="12" font-family="system-ui, -apple-system, sans-serif">Balancing latency, cost variance, regulatory boundaries, hardware availability &amp; carbon footprint</text>

            <!-- Section 1: The 5 Selection Criteria Cards -->
            <rect x="30" y="90" width="460" height="320" rx="8" fill="url(#panel-grad-30-1)" stroke="#38bdf8" stroke-width="1.5"/>
            <rect x="42" y="102" width="130" height="20" rx="4" fill="#0284c7" fill-opacity="0.25"/>
            <text x="107" y="116" fill="#38bdf8" font-size="10" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">EVALUATION VECTORS</text>
            <text x="42" y="140" fill="#f8fafc" font-size="14" font-weight="700" font-family="system-ui, sans-serif">The 5 Regional Selection Criteria</text>

            <!-- Vector 1: Latency -->
            <rect x="42" y="156" width="210" height="70" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="52" y="174" fill="#38bdf8" font-size="11" font-weight="700" font-family="system-ui, sans-serif">1. Client-to-Workload Latency</text>
            <text x="52" y="192" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">Round-trip time (RTT) to users</text>
            <text x="52" y="208" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif">&lt;30ms target for interactive APIs</text>

            <!-- Vector 2: Cost Differential -->
            <rect x="264" y="156" width="210" height="70" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="274" y="174" fill="#f59e0b" font-size="11" font-weight="700" font-family="system-ui, sans-serif">2. Regional Pricing Delta</text>
            <text x="274" y="192" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">Identical SKUs vary up to 25%</text>
            <text x="274" y="208" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif">us-central1 lowest; São Paulo higher</text>

            <!-- Vector 3: Compliance & Residency -->
            <rect x="42" y="234" width="210" height="76" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="52" y="252" fill="#f43f5e" font-size="11" font-weight="700" font-family="system-ui, sans-serif">3. Compliance &amp; Residency</text>
            <text x="52" y="270" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">Data sovereignty (GDPR / HIPAA)</text>
            <text x="52" y="286" fill="#94a3b8" font-size="9" font-family="monospace">constraints/gcp.resourceLocations</text>

            <!-- Vector 4: Service Availability -->
            <rect x="264" y="234" width="210" height="76" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="274" y="252" fill="#a855f7" font-size="11" font-weight="700" font-family="system-ui, sans-serif">4. Service &amp; HW Availability</text>
            <text x="274" y="270" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">Specific machine families (C3, M2)</text>
            <text x="274" y="286" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">Accelerators (TPU v5p, H100 GPU)</text>

            <!-- Vector 5: Carbon Footprint (Full Width) -->
            <rect x="42" y="318" width="432" height="74" rx="6" fill="#052e16" stroke="#22c55e" stroke-width="1"/>
            <text x="52" y="338" fill="#4ade80" font-size="11" font-weight="700" font-family="system-ui, sans-serif">5. Carbon Free Energy (CFE%)</text>
            <text x="52" y="356" fill="#86efac" font-size="10" font-family="system-ui, sans-serif">Google hourly matched carbon-free energy score (e.g., europe-north1: 94% CFE vs. us-central1: 64% CFE)</text>
            <text x="52" y="372" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">Enables enterprise ESG &amp; corporate sustainability targets</text>

            <!-- Arrow from Vectors to Decision Matrix -->
            <line x1="490" y1="250" x2="524" y2="250" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-cyan-30-1)"/>

            <!-- Section 2: Regional Trade-off Comparison Output -->
            <rect x="530" y="90" width="420" height="320" rx="8" fill="url(#panel-grad-30-1)" stroke="#22c55e" stroke-width="1.5"/>
            <rect x="542" y="102" width="130" height="20" rx="4" fill="#16a34a" fill-opacity="0.25"/>
            <text x="607" y="116" fill="#4ade80" font-size="10" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">DECISION MATRIX</text>
            <text x="542" y="140" fill="#f8fafc" font-size="14" font-weight="700" font-family="system-ui, sans-serif">Brightloaf Production Candidates</text>

            <!-- Region Candidate A -->
            <rect x="542" y="156" width="396" height="110" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="554" y="176" fill="#38bdf8" font-size="12" font-weight="700" font-family="system-ui, sans-serif">Primary: us-central1 (Iowa, USA)</text>
            <text x="554" y="196" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">• Latency: 18ms to Midwest/Chicago retail hubs</text>
            <text x="554" y="214" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">• Cost: Tier 1 baseline ($0.0384/vCPU-hr) — Lowest cost</text>
            <text x="554" y="232" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">• Availability: 4 zones (a, b, c, f), C3 &amp; GPUs present</text>
            <text x="554" y="250" fill="#4ade80" font-size="11" font-weight="600" font-family="system-ui, sans-serif">&#10004; Selected for core Order Ingestion &amp; Logistics</text>

            <!-- Region Candidate B -->
            <rect x="542" y="276" width="396" height="116" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="554" y="296" fill="#a855f7" font-size="12" font-weight="700" font-family="system-ui, sans-serif">Disaster Recovery: us-east4 (N. Virginia, USA)</text>
            <text x="554" y="316" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">• Latency: 22ms inter-region transit via Google optical backbone</text>
            <text x="554" y="334" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">• Cost: +8% premium over us-central1</text>
            <text x="554" y="352" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">• Compliance: US sovereign boundary preserved</text>
            <text x="554" y="372" fill="#38bdf8" font-size="11" font-weight="600" font-family="system-ui, sans-serif">&#10004; Asynchronous DR replication pair</text>
          </svg>
          <figcaption>Figure 30.1: Multi-Criteria Region Selection Architecture. Balancing latency, pricing tiers, regulatory data boundaries, hardware availability, and carbon-free energy scores. For Brightloaf's order processing, <code>us-central1</code> delivers optimal latency and lowest baseline cost with 4 availability zones, paired with <code>us-east4</code> across Google's private backbone for compliant disaster recovery.</figcaption>
        </figure>
