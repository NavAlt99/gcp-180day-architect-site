        <figure class="architecture-diagram" id="fig-30-4">
          <svg viewBox="0 0 980 440" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-30-4-title fig-30-4-desc">
            <title id="fig-30-4-title">Figure 30.4: Zonal Single Point of Failure Outage vs Multi-Zone Regional High-Availability Architecture</title>
            <desc id="fig-30-4-desc">Incident diagram showing single-zone VM outage in us-central1-a crashing during a datacenter power event, contrasted with a Regional MIG spanning three zones with Cloud SQL HA auto-failover.</desc>
            <defs>
              <linearGradient id="bg-grad-30-4" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#090d16"/>
                <stop offset="100%" stop-color="#121526"/>
              </linearGradient>
              <linearGradient id="card-grad-30-4" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#161b30"/>
                <stop offset="100%" stop-color="#1e243d"/>
              </linearGradient>
              <marker id="arrow-red-30-4" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1 L 8 5 L 0 9 z" fill="#f43f5e"/>
              </marker>
              <marker id="arrow-green-30-4" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1 L 8 5 L 0 9 z" fill="#22c55e"/>
              </marker>
            </defs>

            <!-- Background Canvas -->
            <rect width="980" height="440" rx="12" fill="url(#bg-grad-30-4)" stroke="#1e293b" stroke-width="1.5"/>

            <!-- Banner Header -->
            <text x="30" y="38" fill="#f8fafc" font-size="16" font-weight="700" font-family="system-ui, -apple-system, sans-serif">Incident 30.2 · Zonal Single Point of Failure vs Regional Multi-Zone Resilience</text>
            <text x="30" y="58" fill="#94a3b8" font-size="12" font-family="system-ui, -apple-system, sans-serif">Eliminating datacenter blast radius with Regional MIGs, Regional Load Balancing &amp; Cloud SQL HA</text>

            <!-- Ingress: Franchise Order Traffic -->
            <rect x="30" y="90" width="210" height="150" rx="8" fill="url(#card-grad-30-4)" stroke="#38bdf8" stroke-width="1.5"/>
            <rect x="42" y="102" width="130" height="20" rx="4" fill="#0284c7" fill-opacity="0.25"/>
            <text x="107" y="116" fill="#38bdf8" font-size="10" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">INGRESS DISPATCH</text>
            <text x="42" y="140" fill="#f8fafc" font-size="13" font-weight="700" font-family="system-ui, sans-serif">Bakery Order Webhooks</text>
            <text x="42" y="160" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">• 6,500 breakfast orders</text>
            <text x="42" y="178" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">• 40 regional retail stores</text>
            <text x="42" y="196" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">• Peak: 05:00–07:00 AM</text>
            <text x="42" y="222" fill="#94a3b8" font-size="10" font-family="monospace">POST /api/v1/orders</text>

            <!-- FAILED PATH (TOP) -->
            <rect x="280" y="90" width="670" height="145" rx="8" fill="#450a0a" stroke="#f43f5e" stroke-width="1.5"/>
            <rect x="292" y="102" width="110" height="20" rx="4" fill="#dc2626" fill-opacity="0.3"/>
            <text x="347" y="116" fill="#fca5a5" font-size="10" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">&#10008; FAILED PATH</text>
            <text x="292" y="138" fill="#f8fafc" font-size="13" font-weight="700" font-family="system-ui, sans-serif">Zonal Architecture: Single Standalone Compute Engine VM in us-central1-a</text>
            <text x="292" y="158" fill="#fecaca" font-size="11" font-family="system-ui, sans-serif">• Power substation event shuts down datacenter zone us-central1-a</text>
            <text x="292" y="176" fill="#fecaca" font-size="11" font-family="system-ui, sans-serif">• Standalone VM order-gateway-vm crashes; zonal persistent disk inaccessible</text>
            <text x="292" y="194" fill="#f87171" font-size="11" font-weight="700" font-family="system-ui, sans-serif">&#9888; 42-minute outage: 6,500 dropped orders, $48,000 lost breakfast revenue</text>
            <text x="292" y="218" fill="#fca5a5" font-size="10" font-weight="600" font-family="sans-serif">[FAILED PATH: Ingress traffic hits single-zone VM in us-central1-a; zone outage crashes VM and drops 6,500 orders]</text>

            <!-- CORRECTED PATH (BOTTOM) -->
            <rect x="280" y="255" width="670" height="165" rx="8" fill="#052e16" stroke="#22c55e" stroke-width="1.5"/>
            <rect x="292" y="267" width="130" height="20" rx="4" fill="#16a34a" fill-opacity="0.3"/>
            <text x="357" y="281" fill="#86efac" font-size="10" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">&#10004; CORRECTED PATH</text>
            <text x="292" y="303" fill="#f8fafc" font-size="13" font-weight="700" font-family="system-ui, sans-serif">Regional Multi-Zone Architecture: Regional MIG + Internal ALB + Cloud SQL HA</text>

            <!-- Zone breakdown boxes inside corrected path -->
            <rect x="292" y="315" width="180" height="65" rx="5" fill="#0f172a" stroke="#dc2626" stroke-width="1"/>
            <text x="302" y="332" fill="#f87171" font-size="10" font-weight="700" font-family="sans-serif">Zone us-central1-a (DOWN)</text>
            <text x="302" y="348" fill="#fca5a5" font-size="10" font-family="sans-serif">• MIG VM 1: Terminated</text>
            <text x="302" y="364" fill="#94a3b8" font-size="9" font-family="sans-serif">Primary DB fails over</text>

            <rect x="482" y="315" width="180" height="65" rx="5" fill="#0f172a" stroke="#22c55e" stroke-width="1"/>
            <text x="492" y="332" fill="#4ade80" font-size="10" font-weight="700" font-family="sans-serif">Zone us-central1-b (ACTIVE)</text>
            <text x="492" y="348" fill="#bbf7d0" font-size="10" font-family="sans-serif">• MIG VM 2: Serving 50%</text>
            <text x="492" y="364" fill="#86efac" font-size="9" font-family="sans-serif">Standby DB promoted</text>

            <rect x="672" y="315" width="180" height="65" rx="5" fill="#0f172a" stroke="#22c55e" stroke-width="1"/>
            <text x="682" y="332" fill="#4ade80" font-size="10" font-weight="700" font-family="sans-serif">Zone us-central1-c (ACTIVE)</text>
            <text x="682" y="348" fill="#bbf7d0" font-size="10" font-family="sans-serif">• MIG VM 3: Serving 50%</text>
            <text x="682" y="364" fill="#86efac" font-size="9" font-family="sans-serif">Auto-scaler adds VM 4</text>

            <text x="292" y="405" fill="#86efac" font-size="10" font-weight="600" font-family="sans-serif">[CORRECTED PATH: Regional ALB routes across 3-zone Regional MIG with Cloud SQL HA failover, sustaining order intake during zone outage]</text>

            <!-- Connections -->
            <!-- Failed Path: Red dashed arrow from Ingress to Zonal VM -->
            <path d="M 240 145 L 260 145 L 260 145 L 272 145" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow-red-30-4)"/>

            <!-- Corrected Path: Green solid arrow from Ingress down to Regional MIG -->
            <path d="M 240 185 L 260 185 L 260 335 L 272 335" fill="none" stroke="#22c55e" stroke-width="2.5" marker-end="url(#arrow-green-30-4)"/>
          </svg>
          <figcaption>Figure 30.4: Architectural trace of Incident 30.2. <strong>Supplied facts:</strong> A localized power failure in zone <code>us-central1-a</code> crashed the standalone Compute Engine order gateway VM, dropping 6,500 morning bakery dispatch orders and inflicting $48,000 in lost revenue across 40 stores. <strong>Architectural inference:</strong> Pinning transactional intake systems to zonal resources creates an unmitigated single point of failure (SPOF) with a blast radius equal to the entire zone. <strong>Expected post-fix behavior:</strong> Migrating to a Regional Managed Instance Group spanning three zones (<code>us-central1-a, b, c</code>) behind an Internal Application Load Balancer and backed by Cloud SQL High Availability ensures zero service interruption during zonal disasters while enforcing Brightloaf's duplicate fulfillment invariant (&le;1 physical fulfillment per unique order ID) across automatic instance failovers.</figcaption>
        </figure>
