        <figure class="architecture-diagram" id="fig-30-2">
          <svg viewBox="0 0 980 440" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-30-2-title fig-30-2-desc">
            <title id="fig-30-2-title">Figure 30.2: Resource Scope Hierarchy &amp; Availability Blast Radiuses</title>
            <desc id="fig-30-2-desc">Architectural diagram detailing the four resource availability scopes in Google Cloud—Zonal, Regional, Multi-Regional, and Global—illustrating their containment blast radiuses, sample resources, and survivability profiles.</desc>
            <defs>
              <linearGradient id="bg-grad-30-2" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#090d16"/>
                <stop offset="100%" stop-color="#121526"/>
              </linearGradient>
              <linearGradient id="panel-grad-30-2" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#161b30"/>
                <stop offset="100%" stop-color="#1e243d"/>
              </linearGradient>
            </defs>

            <!-- Background Canvas -->
            <rect width="980" height="440" rx="12" fill="url(#bg-grad-30-2)" stroke="#1e293b" stroke-width="1.5"/>

            <!-- Banner Header -->
            <text x="30" y="38" fill="#f8fafc" font-size="16" font-weight="700" font-family="system-ui, -apple-system, sans-serif">Google Cloud Resource Scope Hierarchy &amp; Failure Blast Radiuses</text>
            <text x="30" y="58" fill="#94a3b8" font-size="12" font-family="system-ui, -apple-system, sans-serif">Mapping infrastructure survivability from single-facility zonal components to worldwide global Anycast services</text>

            <!-- Scope 1: Zonal (Leftmost) -->
            <rect x="30" y="85" width="215" height="325" rx="8" fill="url(#panel-grad-30-2)" stroke="#f43f5e" stroke-width="1.5"/>
            <rect x="42" y="97" width="80" height="20" rx="4" fill="#450a0a" fill-opacity="0.5"/>
            <text x="82" y="111" fill="#f87171" font-size="10" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">ZONAL SCOPE</text>
            <text x="42" y="136" fill="#f8fafc" font-size="14" font-weight="700" font-family="system-ui, sans-serif">Single Zone</text>
            <text x="42" y="154" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">Blast Radius: 1 Datacenter</text>

            <rect x="42" y="168" width="191" height="84" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="50" y="186" fill="#f8fafc" font-size="11" font-weight="600" font-family="system-ui, sans-serif">Typical Resources:</text>
            <text x="50" y="204" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">• Standalone Compute VM</text>
            <text x="50" y="220" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">• Zonal Persistent Disk (pd-ssd)</text>
            <text x="50" y="236" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">• Single-zone GKE cluster</text>

            <rect x="42" y="260" width="191" height="74" rx="4" fill="#450a0a" stroke="#f43f5e" stroke-width="1"/>
            <text x="50" y="278" fill="#fca5a5" font-size="11" font-weight="700" font-family="system-ui, sans-serif">Failure Impact:</text>
            <text x="50" y="296" fill="#f87171" font-size="10" font-family="system-ui, sans-serif">Outage in zone us-central1-a</text>
            <text x="50" y="312" fill="#f87171" font-size="10" font-family="system-ui, sans-serif">halts all operations completely</text>

            <text x="42" y="360" fill="#94a3b8" font-size="10" font-style="italic" font-family="system-ui, sans-serif">Anti-pattern for production core</text>

            <!-- Scope 2: Regional -->
            <rect x="265" y="85" width="225" height="325" rx="8" fill="url(#panel-grad-30-2)" stroke="#38bdf8" stroke-width="1.5"/>
            <rect x="277" y="97" width="95" height="20" rx="4" fill="#0284c7" fill-opacity="0.25"/>
            <text x="324" y="111" fill="#38bdf8" font-size="10" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">REGIONAL SCOPE</text>
            <text x="277" y="136" fill="#f8fafc" font-size="14" font-weight="700" font-family="system-ui, sans-serif">&ge;3 Zones in Metro</text>
            <text x="277" y="154" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">Blast Radius: Entire Metro Area</text>

            <rect x="277" y="168" width="201" height="84" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="285" y="186" fill="#f8fafc" font-size="11" font-weight="600" font-family="system-ui, sans-serif">Typical Resources:</text>
            <text x="285" y="204" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">• Regional MIG (Auto-spread)</text>
            <text x="285" y="220" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">• Cloud SQL HA (sync standby)</text>
            <text x="285" y="236" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">• Cloud Run &amp; VPC Subnets</text>

            <rect x="277" y="260" width="201" height="74" rx="4" fill="#052e16" stroke="#22c55e" stroke-width="1"/>
            <text x="285" y="278" fill="#4ade80" font-size="11" font-weight="700" font-family="system-ui, sans-serif">Failure Impact:</text>
            <text x="285" y="296" fill="#86efac" font-size="10" font-family="system-ui, sans-serif">Survives total loss of 1 full zone</text>
            <text x="285" y="312" fill="#86efac" font-size="10" font-family="system-ui, sans-serif">Zero data loss (RPO = 0)</text>

            <text x="277" y="360" fill="#38bdf8" font-size="10" font-weight="600" font-family="system-ui, sans-serif">Default standard for production</text>

            <!-- Scope 3: Multi-Regional -->
            <rect x="510" y="85" width="225" height="325" rx="8" fill="url(#panel-grad-30-2)" stroke="#a855f7" stroke-width="1.5"/>
            <rect x="522" y="97" width="115" height="20" rx="4" fill="#9333ea" fill-opacity="0.25"/>
            <text x="579" y="111" fill="#c084fc" font-size="10" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">MULTI-REGIONAL</text>
            <text x="522" y="136" fill="#f8fafc" font-size="14" font-weight="700" font-family="system-ui, sans-serif">&ge;2 Regions (&gt;160km)</text>
            <text x="522" y="154" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">Blast Radius: Geographic Landmass</text>

            <rect x="522" y="168" width="201" height="84" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="530" y="186" fill="#f8fafc" font-size="11" font-weight="600" font-family="system-ui, sans-serif">Typical Resources:</text>
            <text x="530" y="204" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">• GCS Multi-region (e.g. US/EU)</text>
            <text x="530" y="220" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">• BigQuery multi-regional dataset</text>
            <text x="530" y="236" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">• Cloud Spanner multi-region</text>

            <rect x="522" y="260" width="201" height="74" rx="4" fill="#0f172a" stroke="#a855f7" stroke-width="1"/>
            <text x="530" y="278" fill="#c084fc" font-size="11" font-weight="700" font-family="system-ui, sans-serif">Failure Impact:</text>
            <text x="530" y="296" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">Survives regional catastrophe</text>
            <text x="530" y="312" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">Higher replication cost &amp; RTT</text>

            <text x="522" y="360" fill="#c084fc" font-size="10" font-style="italic" font-family="system-ui, sans-serif">Enterprise DR &amp; compliance backup</text>

            <!-- Scope 4: Global -->
            <rect x="755" y="85" width="195" height="325" rx="8" fill="url(#panel-grad-30-2)" stroke="#22c55e" stroke-width="1.5"/>
            <rect x="767" y="97" width="85" height="20" rx="4" fill="#16a34a" fill-opacity="0.25"/>
            <text x="809" y="111" fill="#4ade80" font-size="10" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">GLOBAL SCOPE</text>
            <text x="767" y="136" fill="#f8fafc" font-size="14" font-weight="700" font-family="system-ui, sans-serif">Anycast Edge</text>
            <text x="767" y="154" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">Worldwide Software Fabric</text>

            <rect x="767" y="168" width="171" height="84" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
            <text x="775" y="186" fill="#f8fafc" font-size="11" font-weight="600" font-family="system-ui, sans-serif">Typical Resources:</text>
            <text x="775" y="204" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">• Global Ext App Load Balancer</text>
            <text x="775" y="220" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">• VPC Network &amp; Routes</text>
            <text x="775" y="236" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">• Cloud DNS &amp; Cloud IAM</text>

            <rect x="767" y="260" width="171" height="74" rx="4" fill="#052e16" stroke="#22c55e" stroke-width="1"/>
            <text x="775" y="278" fill="#4ade80" font-size="11" font-weight="700" font-family="system-ui, sans-serif">Failure Impact:</text>
            <text x="775" y="296" fill="#86efac" font-size="10" font-family="system-ui, sans-serif">BGP Anycast routing routes</text>
            <text x="775" y="312" fill="#86efac" font-size="10" font-family="system-ui, sans-serif">traffic to nearest healthy PoP</text>

            <text x="767" y="360" fill="#4ade80" font-size="10" font-weight="600" font-family="system-ui, sans-serif">Edge ingress &amp; IAM governance</text>
          </svg>
          <figcaption>Figure 30.2: Resource Scope Hierarchy &amp; Availability Blast Radiuses. Progression of failure containment across Google Cloud infrastructure: Zonal resources fail on single-datacenter loss; Regional resources distribute across &ge;3 zones within a metro area to provide automated zero-RPO failover; Multi-Regional resources replicate data across separate geographic landmasses for catastrophic DR; Global resources live on Google's Anycast edge and SDN control plane.</figcaption>
        </figure>
