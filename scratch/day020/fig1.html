
<figure class="diagram-figure" id="fig-20-1">
  <div class="diagram-scroll">
    <svg role="img" aria-labelledby="fig20-1-title fig20-1-desc" viewBox="0 0 960 520" width="960" height="520" xmlns="http://www.w3.org/2000/svg">
      <title id="fig20-1-title">Google Cloud Client Library Invocation Flow &amp; Asynchronous LRO Polling Lifecycle</title>
      <desc id="fig20-1-desc">Sequence diagram illustrating the client library interaction, Service Usage authorization, synchronous return of an Operation resource, and exponential backoff polling until operation completion.</desc>
      <defs>
        <linearGradient id="p20-f1-bg" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#090d16"/>
          <stop offset="100%" stop-color="#121526"/>
        </linearGradient>
        <linearGradient id="p20-f1-panel" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
          <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
        </linearGradient>
        <marker id="p20-f1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
        </marker>
        <marker id="p20-f1-arrow-poll" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
        </marker>
        <marker id="p20-f1-arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#22c55e"/>
        </marker>
      </defs>

      <rect width="960" height="520" rx="12" fill="url(#p20-f1-bg)" stroke="#1e293b" stroke-width="1"/>

      <!-- Header -->
      <text x="480" y="32" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Figure 20.1: Client Library Invocation &amp; Asynchronous LRO Polling Lifecycle</text>
      <text x="480" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Service Usage Check · Immediate Operation Handle · Exponential Backoff Polling with Jitter · Final Result</text>

      <!-- Actors Header -->
      <g transform="translate(50, 75)">
        <!-- Client Runtime -->
        <rect x="0" y="0" width="180" height="40" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
        <text x="90" y="24" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Client Application</text>
        <line x1="90" y1="40" x2="90" y2="380" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/>

        <!-- API Gateway / Service Usage -->
        <rect x="260" y="0" width="180" height="40" rx="6" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
        <text x="350" y="24" fill="#818cf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Google API Gateway</text>
        <line x1="350" y1="40" x2="350" y2="380" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/>

        <!-- Managed Service Backend -->
        <rect x="520" y="0" width="180" height="40" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
        <text x="610" y="24" fill="#22c55e" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Cloud Service Backend</text>
        <line x1="610" y1="40" x2="610" y2="380" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/>

        <!-- Messages Flow -->
        <!-- Step 1: Create request -->
        <path d="M 90 70 L 345 70" fill="none" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#p20-f1-arrow)"/>
        <text x="215" y="64" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">1. POST /v1/instances (Cloud SQL Create)</text>

        <!-- Gateway check -->
        <rect x="300" y="80" width="100" height="24" rx="4" fill="#090d16" stroke="#6366f1" stroke-width="1"/>
        <text x="350" y="96" fill="#818cf8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Auth &amp; Service Check</text>

        <path d="M 350 115 L 605 115" fill="none" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#p20-f1-arrow)"/>
        <text x="480" y="110" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Forward request to provisioner</text>

        <!-- Step 2: Immediate LRO response -->
        <path d="M 605 140 L 95 140" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#p20-f1-arrow-poll)"/>
        <text x="350" y="134" fill="#fbbf24" font-family="monospace" font-size="10" text-anchor="middle">2. Return Operation { id: "op-9182", done: false }</text>

        <!-- Step 3: Polling Loop 1 -->
        <path d="M 90 180 L 345 180" fill="none" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#p20-f1-arrow-poll)"/>
        <text x="215" y="174" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">3a. Poll: GET /operations/op-9182 (t = 1s)</text>
        <path d="M 345 200 L 95 200" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#p20-f1-arrow-poll)"/>
        <text x="215" y="194" fill="#f59e0b" font-family="monospace" font-size="10" text-anchor="middle">{ done: false, status: "PENDING" }</text>

        <!-- Sleep / Backoff box -->
        <rect x="35" y="215" width="110" height="22" rx="4" fill="#1e1810" stroke="#f59e0b" stroke-width="1"/>
        <text x="90" y="230" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Backoff: sleep(2.5s)</text>

        <!-- Step 4: Polling Loop 2 -->
        <path d="M 90 255 L 345 255" fill="none" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#p20-f1-arrow-poll)"/>
        <text x="215" y="249" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">3b. Poll: GET /operations/op-9182 (t = 3.5s)</text>
        <path d="M 345 275 L 95 275" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#p20-f1-arrow-poll)"/>
        <text x="215" y="269" fill="#f59e0b" font-family="monospace" font-size="10" text-anchor="middle">{ done: false, status: "RUNNING" }</text>

        <!-- Sleep / Backoff box -->
        <rect x="35" y="290" width="110" height="22" rx="4" fill="#1e1810" stroke="#f59e0b" stroke-width="1"/>
        <text x="90" y="305" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Backoff: sleep(5.0s)</text>

        <!-- Step 5: Final Poll OK -->
        <path d="M 90 330 L 605 330" fill="none" stroke="#22c55e" stroke-width="1.5" marker-end="url(#p20-f1-arrow-ok)"/>
        <text x="350" y="324" fill="#86efac" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">3c. Poll: GET /operations/op-9182 (t = 8.5s)</text>
        <path d="M 605 350 L 95 350" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="4 2" marker-end="url(#p20-f1-arrow-ok)"/>
        <text x="350" y="344" fill="#4ade80" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">{ done: true, response: { instance: "brightloaf-db", ip: "10.0.1.5" } }</text>
      </g>

      <!-- Right Side Callout: Architectural Rules -->
      <g transform="translate(740, 85)">
        <rect x="0" y="0" width="190" height="350" rx="8" fill="#0d1527" stroke="#38bdf8" stroke-width="1.5"/>
        <text x="15" y="24" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">LRO Polling Rules</text>
        
        <rect x="12" y="40" width="166" height="95" rx="6" fill="#1e1418" stroke="#ef4444" stroke-width="1"/>
        <text x="20" y="58" fill="#f87171" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">The Synchronous Trap:</text>
        <text x="20" y="74" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9">Assuming HTTP 200 means</text>
        <text x="20" y="88" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9">resource is ready causes</text>
        <text x="20" y="102" fill="#ef4444" font-family="system-ui, sans-serif" font-size="9">connection refusal errors</text>
        <text x="20" y="116" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="9">in downstream steps.</text>

        <rect x="12" y="145" width="166" height="105" rx="6" fill="#09261a" stroke="#22c55e" stroke-width="1"/>
        <text x="20" y="163" fill="#4ade80" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Correct Backoff Rule:</text>
        <text x="20" y="180" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9">1. Initial delay: 1.0s</text>
        <text x="20" y="194" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9">2. Multiplier: 1.5x</text>
        <text x="20" y="208" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9">3. Random jitter: &plusmn;20%</text>
        <text x="20" y="222" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9">4. Max delay cap: 30s</text>
        <text x="20" y="236" fill="#86efac" font-family="system-ui, sans-serif" font-size="9">5. Total timeout: 15m</text>

        <rect x="12" y="260" width="166" height="75" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
        <text x="20" y="280" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Error Checking:</text>
        <text x="20" y="296" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Always check error field in</text>
        <text x="20" y="310" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">operation when done: true</text>
        <text x="20" y="324" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9">before accessing result.</text>
      </g>

      <!-- Bottom Banner -->
      <rect x="30" y="460" width="900" height="45" rx="6" fill="#111827" stroke="#334155" stroke-width="1"/>
      <text x="45" y="480" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Architectural Rule: Service mutations in Google Cloud return asynchronous LRO handles by contract.</text>
      <text x="45" y="495" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Automated deployment pipelines must poll operations with exponential backoff and jitter, validating completion before initiating application traffic.</text>
    </svg>
  </div>
  <figcaption>
    <strong>Figure 20.1: Google Cloud Client Library Invocation Flow &amp; Asynchronous LRO Polling Lifecycle.</strong>
    Visualizes the transition from initial client request through Service Usage validation, the return of an uncompleted Operation resource, and programmatic exponential backoff polling until final resource readiness.
    <br><strong>Supplied facts:</strong> Long-running infrastructure mutations return an Operation resource with <code>done: false</code>; final status must be polled via <code>operations.get</code> until <code>done: true</code>.
    <br><strong>Architectural inference:</strong> Treating an initial HTTP 200 response as resource completion causes immediate connection failures in downstream deployment stages.
    <br><strong>Expected post-fix behavior:</strong> Pipelines implement structured exponential backoff with randomized jitter and operation error inspection, ensuring resources are 100% operational before service traffic is routed.
  </figcaption>
</figure>
