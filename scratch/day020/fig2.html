
<figure class="diagram-figure" id="fig-20-2">
  <div class="diagram-scroll">
    <svg role="img" aria-labelledby="fig20-2-title fig20-2-desc" viewBox="0 0 960 520" width="960" height="520" xmlns="http://www.w3.org/2000/svg">
      <title id="fig20-2-title">Local Emulator Redirection Architecture &amp; Four-Service Behavioral Boundaries</title>
      <desc id="fig20-2-desc">Architecture diagram showing how client libraries redirect traffic to local Pub/Sub, Firestore, Spanner, and Bigtable emulators via environment variables, detailing the specific divergence points from production.</desc>
      <defs>
        <linearGradient id="p20-f2-bg" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#090d16"/>
          <stop offset="100%" stop-color="#121526"/>
        </linearGradient>
        <linearGradient id="p20-f2-panel" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
          <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
        </linearGradient>
        <marker id="p20-f2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
        </marker>
        <marker id="p20-f2-arrow-err" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">

        </marker>
        <marker id="p20-f2-arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">

        </marker>

      <rect width="960" height="520" rx="12" fill="url(#p20-f2-bg)" stroke="#1e293b" stroke-width="1"/>

      <!-- Header -->
      <text x="480" y="32" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Figure 20.2: Local Emulator Redirection &amp; Four-Service Divergence Matrix</text>
      <text x="480" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Environment Redirection Hooks · In-Memory Simulation Limits · Production System Contrasts</text>

      <!-- Client Application Box (Left) -->
      <rect x="30" y="80" width="210" height="350" rx="8" fill="url(#p20-f2-panel)" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="42" y="104" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Client Application Runtime</text>
      <text x="42" y="128" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">Google Cloud Client Library</text>
      
      <!-- Env Redirection Hooks -->
      <rect x="40" y="145" width="190" height="200" rx="6" fill="#090d16" stroke="#334155" stroke-width="1"/>
      <text x="50" y="165" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Redirection Variables:</text>
      
      <text x="50" y="190" fill="#38bdf8" font-family="monospace" font-size="9">PUBSUB_EMULATOR_HOST</text>
      <text x="50" y="204" fill="#94a3b8" font-family="monospace" font-size="9">=localhost:8085</text>

      <text x="50" y="230" fill="#f59e0b" font-family="monospace" font-size="9">FIRESTORE_EMULATOR_HOST</text>
      <text x="50" y="244" fill="#94a3b8" font-family="monospace" font-size="9">=localhost:8080</text>

      <text x="50" y="270" fill="#22c55e" font-family="monospace" font-size="9">SPANNER_EMULATOR_HOST</text>
      <text x="50" y="284" fill="#94a3b8" font-family="monospace" font-size="9">=localhost:9010</text>

      <text x="50" y="310" fill="#818cf8" font-family="monospace" font-size="9">BIGTABLE_EMULATOR_HOST</text>
      <text x="50" y="324" fill="#94a3b8" font-family="monospace" font-size="9">=localhost:8086</text>

      <text x="42" y="370" fill="#4ade80" font-family="system-ui, sans-serif" font-size="10">Auth Check: Bypassed</text>
      <text x="42" y="388" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Transport: HTTP/2 plaintext</text>
      <text x="42" y="406" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Zero cloud cost incurred</text>

      <!-- Four Service Emulator Boxes in Center-Right -->
      <g transform="translate(270, 80)">
        <!-- 1. Pub/Sub -->
        <rect x="0" y="0" width="660" height="80" rx="6" fill="#0d1626" stroke="#38bdf8" stroke-width="1.5"/>
        <text x="15" y="20" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">1. Cloud Pub/Sub Emulator (Port 8085 · Java Runtime)</text>
        <text x="15" y="40" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">Storage: In-memory only (ephemeral) · Ordering: Trivial single-thread FIFO without partition loss simulation</text>
        <text x="15" y="58" fill="#f87171" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Divergence: Masks at-least-once message delivery replays and network ack timeouts seen in production.</text>

        <!-- 2. Firestore -->
        <rect x="0" y="90" width="660" height="80" rx="6" fill="#1e1810" stroke="#f59e0b" stroke-width="1.5"/>
        <text x="15" y="110" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">2. Cloud Firestore Emulator (Port 8080 · Java Runtime)</text>
        <text x="15" y="130" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">Storage: Ephemeral memory (requires export/import flags) · Rules: Local engine tests rule syntax</text>
        <text x="15" y="148" fill="#f87171" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Divergence: Relaxed index enforcement; does not simulate regional multi-master quorum latency or hot contention.</text>

        <!-- 3. Spanner -->
        <rect x="0" y="180" width="660" height="80" rx="6" fill="#09261a" stroke="#22c55e" stroke-width="1.5"/>
        <text x="15" y="200" fill="#4ade80" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">3. Cloud Spanner Emulator (Port 9010 gRPC / 9020 REST · C++ Binary)</text>
        <text x="15" y="220" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">Storage: In-memory / single-process · Engine: SQLite backing core relational SQL parsing</text>
        <text x="15" y="238" fill="#f87171" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Divergence: NO TrueTime uncertainty wait (&epsilon;); no distributed Paxos consensus, failover, or query cost modeling.</text>

        <!-- 4. Bigtable -->
        <rect x="0" y="270" width="660" height="80" rx="6" fill="#161226" stroke="#818cf8" stroke-width="1.5"/>
        <text x="15" y="290" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">4. Cloud Bigtable Emulator (Port 8086 · Go Binary)</text>
        <text x="15" y="310" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">Storage: In-memory hash table · API: gRPC Bigtable data and admin API contracts</text>
        <text x="15" y="328" fill="#f87171" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Divergence: No tablet splitting, no SSD performance simulation, no hotspotting detection, and zero IAM check.</text>
      </g>

      <!-- Connecting Arrow from Client to Grid -->
      <path d="M 240 255 L 268 255" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#p20-f2-arrow)"/>

      <!-- Bottom Banner -->
      <rect x="30" y="460" width="900" height="45" rx="6" fill="#111827" stroke="#334155" stroke-width="1"/>
      <text x="45" y="480" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Architectural Rule: An emulator validates API contract syntax, not distributed system semantics.</text>
      <text x="45" y="495" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Always implement application-layer deduplication and idempotency keys to survive real-world at-least-once cloud delivery.</text>
    </svg>
  </div>
  <figcaption>
    <strong>Figure 20.2: Local Emulator Redirection Architecture &amp; Four-Service Behavioral Boundaries.</strong>
    Illustrates how Google Cloud Client Libraries intercept endpoint configuration to target local emulator processes and highlights key divergences from cloud production environments.
    <br><strong>Supplied facts:</strong> Setting environment variables (such as <code>PUBSUB_EMULATOR_HOST</code>) transparently redirects client library RPCs to local loopback ports without authentication.
    <br><strong>Architectural inference:</strong> Local emulators execute single-node in-memory implementations that mask distributed timing, TrueTime commit waits, and message replay loops inherent in production systems.
    <br><strong>Expected post-fix behavior:</strong> Architecture teams utilize emulators for functional interface tests while enforcing consumer idempotency invariants to protect against production distributed failures.
  </figcaption>
</figure>
